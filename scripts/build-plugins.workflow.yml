name: Build Plugins

on:
  workflow_dispatch:
  push:
    paths:
      - 'CimaCloud/**'
      - 'AnimeDay/**'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build plugins
        run: |
          ./gradlew :CimaCloud:clean :CimaCloud:make
          ./gradlew :AnimeDay:clean :AnimeDay:make

      - name: Copy artifacts to build/
        run: |
          for module in CimaCloud AnimeDay; do
            if [ -f "$module/build/$module.cs3" ]; then
              cp "$module/build/$module.cs3" "build/$module.cs3"
            else
              echo "$module.cs3 not found!"
              exit 1
            fi
          done

      - name: Commit and push built cs3 to build/
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add -f build/CimaCloud.cs3 build/AnimeDay.cs3
          git commit --allow-empty -m "🤖 Build plugins (CimaCloud, AnimeDay)"
          git pull --rebase origin "$GITHUB_REF_NAME" || true
          git push