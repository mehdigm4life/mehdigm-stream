name: Build EgyDead Plugin

on:
  workflow_dispatch:
  push:
    paths:
      - 'EgyDead/**'
      - 'build/EgyDead.png'
      - '.github/workflows/build-egydead.yml'

permissions:
  contents: write
  checks: write

jobs:
  build:
    if: "!contains(github.event.head_commit.message, '[skip ci]') && !contains(github.event.head_commit.message, '🤖')"
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Live Cloudflare & Transport Forensics (Temporary Dev Probe)
        id: cf_probe
        continue-on-error: true
        run: |
          python3 -m pip install --quiet curl_cffi playwright 2>/dev/null || true
          python3 - <<'PY' | tee cf_probe.log
          import subprocess, time, json, urllib.request, ssl

          print("=== 1. TLS IMPERSONATION (curl_cffi chrome131_android) DIRECT ===")
          try:
              from curl_cffi import requests as creq
              for imp in ["chrome131_android", "chrome124", "safari17_0"]:
                  r = creq.get("https://tv10.egydead.live/h3/", impersonate=imp, timeout=10)
                  print(f"curl_cffi({imp}) direct /h3/ -> status={r.status_code}, len={len(r.text)}, cf_mitigated={r.headers.get('cf-mitigated')}, server={r.headers.get('server')}, hasMovieItem={'movieItem' in r.text}")
          except Exception as e:
              print("curl_cffi direct err:", e)

          print("\n=== 2. ALTERNATIVE ENDPOINTS / PATHS / DOMAINS (curl_cffi) ===")
          try:
              from curl_cffi import requests as creq
              test_urls = [
                  "https://egydead.live/",
                  "https://egydead.fyi/",
                  "https://tv10.egydead.live/feed/",
                  "https://tv10.egydead.live/movies/feed/",
                  "https://tv10.egydead.live/wp-json/wp/v2/posts?per_page=5",
                  "https://tv10.egydead.live/wp-admin/admin-ajax.php",
                  "https://tv10.egydead.live/sitemap.xml",
                  "https://r.jina.ai/https://tv10.egydead.live/h3/",
                  "https://api.codetabs.com/v1/proxy?quest=https://tv10.egydead.live/h3/",
                  "https://api.allorigins.win/raw?url=https%3A%2F%2Ftv10.egydead.live%2Fh3%2F",
                  "https://corsproxy.io/?https%3A%2F%2Ftv10.egydead.live%2Fh3%2F",
              ]
              for u in test_urls:
                  try:
                      r = creq.get(u, impersonate="chrome124", timeout=10, allow_redirects=True)
                      print(f"PROBE {u} -> status={r.status_code}, final={r.url}, len={len(r.text)}, hasEgy={'egydead' in r.text.lower()}, hasMovieItem={'movieItem' in r.text}")
                  except Exception as ex:
                      print(f"PROBE {u} -> ERR {ex}")
          except Exception as e:
              print("alt endpoints err:", e)

          print("\n=== 3. CURL_CFFI OVER LIVE SOCKS5 PROXIES (monosans top 25) ===")
          try:
              from curl_cffi import requests as creq
              import concurrent.futures
              raw = urllib.request.urlopen("https://raw.githubusercontent.com/monosans/proxy-list/main/proxies/socks5.txt", timeout=8).read().decode()
              proxies = [ln.strip() for ln in raw.splitlines() if ":" in ln][:30]
              def test_px(px):
                  t0 = time.time()
                  try:
                      r = creq.get("https://tv10.egydead.live/h3/", impersonate="chrome131_android", proxies={"https": f"socks5h://{px}", "http": f"socks5h://{px}"}, timeout=7)
                      return f"px={px} ({int((time.time()-t0)*1000)}ms) -> status={r.status_code}, len={len(r.text)}, cf={r.headers.get('cf-mitigated')}, movieItem={'movieItem' in r.text}"
                  except Exception as ex:
                      return f"px={px} -> ERR {type(ex).__name__}: {str(ex)[:60]}"
              with concurrent.futures.ThreadPoolExecutor(max_workers=15) as ex:
                  for res in ex.map(test_px, proxies):
                      print(" ", res)
          except Exception as e:
              print("proxy curl_cffi err:", e)
          PY

          echo "=== 4. REAL CHROMIUM (XVFB SOFTWARE RENDERED) TURNSTILE DOM & AUTO-TAP TEST ===" | tee -a cf_probe.log
          xvfb-run -a --server-args="-screen 0 412x915x24" python3 - <<'PY' 2>&1 | tee -a cf_probe.log
          import time, subprocess
          from playwright.sync_api import sync_playwright

          with sync_playwright() as p:
              # Use system google-chrome if available so we don't even need playwright install!
              browser = p.chromium.launch(
                  channel="chrome",
                  headless=False,
                  args=[
                      "--no-sandbox",
                      "--disable-blink-features=AutomationControlled",
                      "--window-size=412,915",
                  ]
              )
              ctx = browser.new_context(
                  viewport={"width": 412, "height": 915},
                  device_scale_factor=2,
                  user_agent="Mozilla/5.0 (Linux; Android 14; K) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/131.0.0.0 Mobile Safari/537.36",
                  locale="ar-EG"
              )
              page = ctx.new_page()
              t0 = time.time()
              resp = page.goto("https://tv10.egydead.live/h3/", wait_until="domcontentloaded", timeout=20000)
              print(f"[CHROME] initial goto ({int((time.time()-t0)*1000)}ms) -> status={resp.status if resp else None}, title={page.title()!r}, url={page.url}")
              time.sleep(3.0)
              print(f"[CHROME +3s] title={page.title()!r}, webdriver={page.evaluate('navigator.webdriver')}, ownWebdriver={page.evaluate('Object.getOwnPropertyDescriptor(navigator, \"webdriver\") !== undefined')}")
              boxes = page.evaluate("""() => {
                  const out = [];
                  const els = document.querySelectorAll('div, iframe, input, label, body > *');
                  for (const el of els) {
                      const r = el.getBoundingClientRect();
                      if (r.width >= 40 && r.height >= 20 && r.height <= 200) {
                          out.push({tag: el.tagName, id: el.id, cls: (el.className || '').toString().slice(0,50), w: Math.round(r.width), h: Math.round(r.height), x: Math.round(r.left), y: Math.round(r.top), childCount: el.children.length});
                      }
                  }
                  return out.slice(0, 30);
              }""")
              print("[CHROME +3s] candidate boxes:", json.dumps(boxes) if 'json' in globals() else boxes)
              html_head = page.content()[:1800].replace("\n", " ")
              print("[CHROME +3s] html snippet:", html_head)

              for attempt in range(1, 6):
                  cards = page.locator("li.movieItem").count()
                  if cards > 0:
                      print(f"[CHROME SOLVED!] attempt={attempt} ({int((time.time()-t0)*1000)}ms) -> title={page.title()!r}, movieItems={cards}, cookies={[c['name'] for c in ctx.cookies()]}")
                      break
                  # Find Turnstile host div exactly like CloudflareSolver.kt!
                  pt = page.evaluate("""() => {
                      const divs = document.querySelectorAll('div');
                      for (let i = divs.length - 1; i >= 0; i--) {
                          const d = divs[i];
                          const r = d.getBoundingClientRect();
                          if (r.width >= 240 && r.width <= 380 && r.height >= 50 && r.height <= 95 && r.top > 0) {
                              return {xLtr: r.left + 28, xRtl: r.right - 28, y: r.top + (r.height / 2), w: r.width, h: r.height, id: d.id, cls: d.className};
                          }
                      }
                      return null;
                  }""")
                  print(f"[CHROME tap #{attempt}] target={pt}")
                  if pt:
                      page.mouse.click(pt["xLtr"], pt["y"])
                      time.sleep(0.35)
                      page.mouse.click(pt["xRtl"], pt["y"])
                  time.sleep(2.5)
              cards = page.locator("li.movieItem").count()
              print(f"[CHROME FINAL] ({int((time.time()-t0)*1000)}ms) title={page.title()!r}, movieItems={cards}, cookies={[c['name'] for c in ctx.cookies()]}")
              if cards > 0:
                  f_res = page.evaluate("""async () => {
                      const r = await fetch('/movies/', {credentials: 'include'});
                      const t = await r.text();
                      return {status: r.status, len: t.length, hasCards: t.includes('movieItem')};
                  }""")
                  print("[CHROME window.fetch('/movies/')] ->", f_res)
              browser.close()
          PY

      - name: Configure Android SDK, test, and build EgyDead plugin
        id: gradle_build
        run: |
          set -o pipefail
          chmod +x gradlew
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          ./gradlew :EgyDead:testDebugUnitTest :EgyDead:make --info --stacktrace --no-daemon 2>&1 | tee gradle.log

      - name: Publish Detailed Test & Build Report to Check Run API
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OUTCOME: ${{ steps.gradle_build.outcome }}
          SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import glob, json, os, subprocess, xml.etree.ElementTree as ET

          xml_report = []
          for xml_path in sorted(glob.glob("EgyDead/build/test-results/testDebugUnitTest/*.xml")):
              try:
                  tree = ET.parse(xml_path)
                  root = tree.getroot()
                  xml_report.append(f"## Suite: {root.attrib.get('name')} (tests={root.attrib.get('tests')}, failures={root.attrib.get('failures')}, time={root.attrib.get('time')}s)")
                  for tc in root.findall("testcase"):
                      status = "PASS"
                      fail_txt = ""
                      for f in list(tc.findall("failure")) + list(tc.findall("error")):
                          status = "FAIL"
                          fail_txt = (f.text or f.attrib.get("message", ""))[:3000]
                      xml_report.append(f"- `{tc.attrib.get('name')}`: **{status}** ({tc.attrib.get('time')}s)")
                      if fail_txt:
                          xml_report.append(f"```\n{fail_txt}\n```")
                  sysout = root.findtext("system-out") or ""
                  if sysout.strip():
                      xml_report.append("### Standard Output\n```\n" + sysout[-25000:] + "\n```")
              except Exception as ex:
                  xml_report.append(f"XML parse error: {ex}")

          log_text = "\n".join(xml_report)
          if os.path.exists("cf_probe.log"):
              with open("cf_probe.log", "r", encoding="utf-8", errors="replace") as fh:
                  probe_txt = fh.read()
              log_text = "### Live CF & Transport Forensics\n```\n" + probe_txt[:25000] + "\n```\n\n" + log_text
          if not log_text.strip() and os.path.exists("gradle.log"):
              with open("gradle.log", "r", encoding="utf-8", errors="replace") as fh:
                  lines = fh.readlines()
              log_text = "### Gradle Tail\n```\n" + "".join(lines[-250:])[-50000:] + "\n```"

          outcome = os.environ.get("OUTCOME", "failure")
          conclusion = "success" if outcome == "success" else "failure"
          payload = {
              "name": "EgyDead Diagnostics",
              "head_sha": os.environ["SHA"],
              "status": "completed",
              "conclusion": conclusion,
              "output": {
                  "title": f"EgyDead Build & Live E2E: {conclusion}",
                  "summary": f"Gradle outcome: `{outcome}`",
                  "text": log_text[:64000]
              }
          }
          with open("check_payload.json", "w", encoding="utf-8") as fh:
              json.dump(payload, fh)

          subprocess.run([
              "gh", "api", "--method", "POST",
              f"repos/{os.environ['REPO']}/check-runs",
              "--input", "check_payload.json"
          ], check=False)
          PY

      - name: Upload EgyDead.cs3 artifact
        uses: actions/upload-artifact@v4
        with:
          name: EgyDead
          path: EgyDead/build/EgyDead.cs3

      - name: Commit and push built EgyDead.cs3 to build/
        run: |
          if [ -f "EgyDead/build/EgyDead.cs3" ]; then
            mkdir -p build
            cp -f EgyDead/build/EgyDead.cs3 build/EgyDead.cs3
            python3 - <<'PY'
          import os, re
          sz = os.path.getsize("build/EgyDead.cs3")
          with open("plugins.json", "r", encoding="utf-8") as fh:
              txt = fh.read()
          def repl(m):
              blk = m.group(0)
              if '"internalName": "EgyDead"' not in blk:
                  return blk
              return re.sub(r'("fileSize"\s*:\s*)\d+', rf'\g<1>{sz}', blk, count=1)
          new_txt = re.sub(r'\{[^{}]*"internalName"\s*:\s*"EgyDead"[^{}]*\}', repl, txt, flags=re.S)
          if new_txt != txt:
              with open("plugins.json", "w", encoding="utf-8") as fh:
                  fh.write(new_txt)
          PY
            git config --local user.email "github-actions[bot]@users.noreply.github.com"
            git config --local user.name "github-actions[bot]"
            git add -f build/EgyDead.cs3 plugins.json
            if ! git diff --cached --quiet; then
              git commit -m "🤖 Build EgyDead.cs3 [skip ci]"
              git pull --rebase origin "$GITHUB_REF_NAME" || true
              git push
            fi
          else
            echo "EgyDead.cs3 not found!"
            exit 1
          fi
