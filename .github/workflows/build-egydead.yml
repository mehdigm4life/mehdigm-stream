name: Build EgyDead Plugin

on:
  workflow_dispatch:
  push:
    paths:
      - 'EgyDead/**'
      - 'build/EgyDead.png'
      - '.github/workflows/build-egydead.yml'

permissions:
  contents: write
  checks: write

jobs:
  build:
    if: "!contains(github.event.head_commit.message, '[skip ci]') && !contains(github.event.head_commit.message, '🤖')"
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Live Cloudflare & Transport Forensics (Temporary Dev Probe)
        id: cf_probe
        run: |
          python3 -m pip install --quiet patchright pillow curl_cffi
          xvfb-run -a --server-args="-screen 0 412x915x24" python3 - <<'PY' 2>&1 | tee cf_probe.log
          import time, json
          from PIL import Image
          from patchright.sync_api import sync_playwright
          from curl_cffi import requests as creq

          UA = "Mozilla/5.0 (Linux; Android 14; K) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/131.0.0.0 Mobile Safari/537.36"

          with sync_playwright() as p:
              browser = p.chromium.launch(
                  channel="chrome",
                  headless=False,
                  args=[
                      "--no-sandbox",
                      "--disable-blink-features=AutomationControlled",
                      "--window-size=412,915",
                  ]
              )
              ctx = browser.new_context(
                  viewport={"width": 412, "height": 915},
                  device_scale_factor=2,
                  user_agent=UA,
                  locale="ar-EG"
              )
              page = ctx.new_page()
              t0 = time.time()
              resp = page.goto("https://tv10.egydead.live/h3/", wait_until="domcontentloaded", timeout=20000)
              print(f"[PATCHRIGHT] goto ({int((time.time()-t0)*1000)}ms) -> status={resp.status if resp else None}, title={page.title()!r}")
              time.sleep(3.5)

              # Inspect exact DOM & screenshot of Turnstile box at y~378!
              info = page.evaluate("""() => {
                  const inp = document.querySelector('input[name="cf-turnstile-response"], input[id^="cf-chl-widget-"]');
                  let target = null;
                  if (inp && inp.parentElement) {
                      const r = inp.parentElement.getBoundingClientRect();
                      if (r.width >= 200 && r.height >= 45) {
                          target = {via: 'inputParent', left: r.left, right: r.right, top: r.top, width: r.width, height: r.height, html: inp.parentElement.outerHTML.slice(0, 300)};
                      }
                  }
                  if (!target) {
                      const divs = document.querySelectorAll('div');
                      for (let i = 0; i < divs.length; i++) {
                          const d = divs[i];
                          if (d.closest('.footer, footer, [role="contentinfo"]')) continue;
                          const r = d.getBoundingClientRect();
                          if (d.children.length === 0 && r.width >= 200 && r.width <= 420 && r.height >= 45 && r.height <= 95 && r.top > 0) {
                              target = {via: 'leafDiv', left: r.left, right: r.right, top: r.top, width: r.width, height: r.height, parentHtml: d.parentElement ? d.parentElement.outerHTML.slice(0, 300) : ''};
                              break;
                          }
                      }
                  }
                  return {title: document.title, dir: document.documentElement.dir, target};
              }""")
              print("[PATCHRIGHT +3.5s] info =", json.dumps(info, ensure_ascii=False))

              page.screenshot(path="/tmp/turnstile.png")
              im = Image.open("/tmp/turnstile.png").convert("RGB")
              print(f"[SCREENSHOT] actual pixel size={im.size} (scale=2 -> 824x1830)")
              if info["target"]:
                  t = info["target"]
                  # Inspect CSS row y = top + height/2 (multiply by 2 for device_scale_factor=2!)
                  cy_css = t["top"] + t["height"] / 2.0
                  py = int(cy_css * 2)
                  # Find dark/border pixels across the widget width to pinpoint the exact checkbox X!
                  dark_xs_css = []
                  for cx in range(int(t["left"]), int(t["right"])):
                      r, g, b = im.getpixel((cx * 2, py))
                      if (r, g, b) not in ((255,255,255), (250,250,250), (34,34,34), (35,35,35), (249,249,249)):
                          dark_xs_css.append((cx, (r,g,b)))
                  print(f"[WIDGET PIXEL SCAN at y_css={cy_css}] active CSS X samples: first5={dark_xs_css[:8]}, last5={dark_xs_css[-8:]}")

              # Now auto-tap using our exact selector!
              for attempt in range(1, 6):
                  cards = page.locator("li.movieItem").count()
                  if cards > 0:
                      print(f">>> SOLVED BEFORE TAP #{attempt}! ({int((time.time()-t0)*1000)}ms) cards={cards}, title={page.title()!r} <<<")
                      break
                  t = info["target"]
                  if t:
                      # In RTL (<html dir="rtl">), check if checkbox is on right (right - 28) or left (left + 28)
                      is_rtl = (info.get("dir") or "").lower() == "rtl"
                      x1 = (t["right"] - 28) if is_rtl else (t["left"] + 28)
                      x2 = (t["left"] + 28) if is_rtl else (t["right"] - 28)
                      cy = t["top"] + t["height"] / 2.0
                      click_x = x1 if attempt % 2 == 1 else x2
                      print(f"[TAP #{attempt}] clicking ({click_x}, {cy}) (is_rtl={is_rtl})")
                      page.mouse.click(click_x, cy)
                  time.sleep(3.5)

              cards = page.locator("li.movieItem").count()
              cookies = ctx.cookies()
              print(f"[FINAL] ({int((time.time()-t0)*1000)}ms) title={page.title()!r}, url={page.url}, movieItems={cards}, cookies={[(c['name'], len(c['value'])) for c in cookies]}")

              if cards > 0:
                  # Test 1: window.fetch inside solved browser (Tier 3A persistent WebView model!)
                  t_f = time.time()
                  f_mov = page.evaluate("""async () => {
                      const r = await fetch('/movies/', {credentials: 'include'});
                      const txt = await r.text();
                      return {status: r.status, len: txt.length, movieItem: txt.includes('movieItem')};
                  }""")
                  print(f"[TEST window.fetch('/movies/')] ({int((time.time()-t_f)*1000)}ms) -> {f_mov}")

                  t_s = time.time()
                  f_srch = page.evaluate("""async () => {
                      const r = await fetch('/?s=Lupin', {credentials: 'include'});
                      const txt = await r.text();
                      return {status: r.status, len: txt.length, movieItem: txt.includes('movieItem')};
                  }""")
                  print(f"[TEST window.fetch('/?s=Lupin')] ({int((time.time()-t_s)*1000)}ms) -> {f_srch}")

                  # Test 2: Does curl_cffi or Python urllib (non-Chrome TLS) work with extracted cf_clearance?
                  cookie_hdr = "; ".join(f"{c['name']}={c['value']}" for c in cookies)
                  r_cffi = creq.get("https://tv10.egydead.live/movies/", impersonate="chrome131_android", headers={"User-Agent": UA, "Cookie": cookie_hdr}, timeout=8)
                  print(f"[TEST curl_cffi + cf_clearance] -> status={r_cffi.status_code}, len={len(r_cffi.text)}, movieItem={'movieItem' in r_cffi.text}")

                  import urllib.request
                  req_std = urllib.request.Request("https://tv10.egydead.live/movies/", headers={"User-Agent": UA, "Cookie": cookie_hdr})
                  try:
                      with urllib.request.urlopen(req_std, timeout=8) as uresp:
                          ubody = uresp.read().decode("utf-8", "ignore")
                          print(f"[TEST stdlib TLS + cf_clearance] -> status={uresp.status}, len={len(ubody)}, movieItem={'movieItem' in ubody}")
                  except Exception as ue:
                      print(f"[TEST stdlib TLS + cf_clearance] -> BLOCKED ({ue})")
              browser.close()
          PY

      - name: Configure Android SDK, test, and build EgyDead plugin
        id: gradle_build
        run: |
          set -o pipefail
          chmod +x gradlew
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          ./gradlew :EgyDead:testDebugUnitTest --tests com.egydead.EgyDeadUnitTest --no-daemon 2>&1 | tee gradle.log

      - name: Publish Detailed Test & Build Report to Check Run API
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OUTCOME: ${{ steps.gradle_build.outcome }}
          SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import glob, json, os, subprocess, xml.etree.ElementTree as ET

          xml_report = []
          for xml_path in sorted(glob.glob("EgyDead/build/test-results/testDebugUnitTest/*.xml")):
              try:
                  tree = ET.parse(xml_path)
                  root = tree.getroot()
                  xml_report.append(f"## Suite: {root.attrib.get('name')} (tests={root.attrib.get('tests')}, failures={root.attrib.get('failures')}, time={root.attrib.get('time')}s)")
                  for tc in root.findall("testcase"):
                      status = "PASS"
                      fail_txt = ""
                      for f in list(tc.findall("failure")) + list(tc.findall("error")):
                          status = "FAIL"
                          fail_txt = (f.text or f.attrib.get("message", ""))[:3000]
                      xml_report.append(f"- `{tc.attrib.get('name')}`: **{status}** ({tc.attrib.get('time')}s)")
                      if fail_txt:
                          xml_report.append(f"```\n{fail_txt}\n```")
                  sysout = root.findtext("system-out") or ""
                  if sysout.strip():
                      xml_report.append("### Standard Output\n```\n" + sysout[-25000:] + "\n```")
              except Exception as ex:
                  xml_report.append(f"XML parse error: {ex}")

          log_text = "\n".join(xml_report)
          if os.path.exists("cf_probe.log"):
              with open("cf_probe.log", "r", encoding="utf-8", errors="replace") as fh:
                  probe_txt = fh.read()
              log_text = "### Live CF & Transport Forensics\n```\n" + probe_txt[:25000] + "\n```\n\n" + log_text
          if not log_text.strip() and os.path.exists("gradle.log"):
              with open("gradle.log", "r", encoding="utf-8", errors="replace") as fh:
                  lines = fh.readlines()
              log_text = "### Gradle Tail\n```\n" + "".join(lines[-250:])[-50000:] + "\n```"

          outcome = os.environ.get("OUTCOME", "failure")
          conclusion = "success" if outcome == "success" else "failure"
          payload = {
              "name": "EgyDead Diagnostics",
              "head_sha": os.environ["SHA"],
              "status": "completed",
              "conclusion": conclusion,
              "output": {
                  "title": f"EgyDead Build & Live E2E: {conclusion}",
                  "summary": f"Gradle outcome: `{outcome}`",
                  "text": log_text[:64000]
              }
          }
          with open("check_payload.json", "w", encoding="utf-8") as fh:
              json.dump(payload, fh)

          subprocess.run([
              "gh", "api", "--method", "POST",
              f"repos/{os.environ['REPO']}/check-runs",
              "--input", "check_payload.json"
          ], check=False)
          PY

      - name: Upload EgyDead.cs3 artifact
        uses: actions/upload-artifact@v4
        with:
          name: EgyDead
          path: EgyDead/build/EgyDead.cs3

      - name: Commit and push built EgyDead.cs3 to build/
        run: |
          if [ -f "EgyDead/build/EgyDead.cs3" ]; then
            mkdir -p build
            cp -f EgyDead/build/EgyDead.cs3 build/EgyDead.cs3
            python3 - <<'PY'
          import os, re
          sz = os.path.getsize("build/EgyDead.cs3")
          with open("plugins.json", "r", encoding="utf-8") as fh:
              txt = fh.read()
          def repl(m):
              blk = m.group(0)
              if '"internalName": "EgyDead"' not in blk:
                  return blk
              return re.sub(r'("fileSize"\s*:\s*)\d+', rf'\g<1>{sz}', blk, count=1)
          new_txt = re.sub(r'\{[^{}]*"internalName"\s*:\s*"EgyDead"[^{}]*\}', repl, txt, flags=re.S)
          if new_txt != txt:
              with open("plugins.json", "w", encoding="utf-8") as fh:
                  fh.write(new_txt)
          PY
            git config --local user.email "github-actions[bot]@users.noreply.github.com"
            git config --local user.name "github-actions[bot]"
            git add -f build/EgyDead.cs3 plugins.json
            if ! git diff --cached --quiet; then
              git commit -m "🤖 Build EgyDead.cs3 [skip ci]"
              git pull --rebase origin "$GITHUB_REF_NAME" || true
              git push
            fi
          else
            echo "EgyDead.cs3 not found!"
            exit 1
          fi
