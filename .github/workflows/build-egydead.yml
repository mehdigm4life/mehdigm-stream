name: Build EgyDead Plugin

on:
  workflow_dispatch:
  push:
    paths:
      - 'EgyDead/**'
      - 'build/EgyDead.png'
      - '.github/workflows/build-egydead.yml'

permissions:
  contents: write
  checks: write

jobs:
  build:
    if: "!contains(github.event.head_commit.message, '[skip ci]') && !contains(github.event.head_commit.message, '🤖')"
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Build and unit-test EgyDead plugin
        id: gradle_build
        run: |
          set -o pipefail
          chmod +x gradlew
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          ./gradlew :EgyDead:testDebugUnitTest --tests com.egydead.EgyDeadUnitTest :EgyDead:make --no-daemon 2>&1 | tee gradle.log

      - name: Report Gradle Build Error if Failed
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import json, os, subprocess
          txt = open("gradle.log", encoding="utf-8", errors="replace").read()[-45000:] if os.path.exists("gradle.log") else "no log"
          payload = {
              "name": "EgyDead Build Log",
              "head_sha": os.environ["SHA"],
              "status": "completed",
              "conclusion": "failure",
              "output": {"title": "Gradle Build Log", "summary": "Failure tail", "text": f"```\n{txt}\n```"}
          }
          with open("cp.json", "w") as f: json.dump(payload, f)
          subprocess.run(["gh", "api", "--method", "POST", f"repos/{os.environ['REPO']}/check-runs", "--input", "cp.json"], check=False)
          PY

      - name: Upload EgyDead.cs3 artifact
        uses: actions/upload-artifact@v4
        with:
          name: EgyDead
          path: EgyDead/build/EgyDead.cs3

      - name: Commit and push built EgyDead.cs3 to build/
        if: github.ref == 'refs/heads/main'
        run: |
          if [ -f "EgyDead/build/EgyDead.cs3" ]; then
            mkdir -p build
            cp -f EgyDead/build/EgyDead.cs3 build/EgyDead.cs3
            python3 - <<'PY'
          import os, re
          sz = os.path.getsize("build/EgyDead.cs3")
          with open("plugins.json", "r", encoding="utf-8") as fh:
              txt = fh.read()
          def repl(m):
              blk = m.group(0)
              if '"internalName": "EgyDead"' not in blk:
                  return blk
              return re.sub(r'("fileSize"\s*:\s*)\d+', rf'\g<1>{sz}', blk, count=1)
          new_txt = re.sub(r'\{[^{}]*"internalName"\s*:\s*"EgyDead"[^{}]*\}', repl, txt, flags=re.S)
          if new_txt != txt:
              with open("plugins.json", "w", encoding="utf-8") as fh:
                  fh.write(new_txt)
          PY
            git config --local user.email "github-actions[bot]@users.noreply.github.com"
            git config --local user.name "github-actions[bot]"
            git add -f build/EgyDead.cs3 plugins.json
            if ! git diff --cached --quiet; then
              git commit -m "🤖 Build EgyDead.cs3 [skip ci]"
              git pull --rebase origin "$GITHUB_REF_NAME" || true
              git push
            fi
          else
            echo "EgyDead.cs3 not found!"
            exit 1
          fi
