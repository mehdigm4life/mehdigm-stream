name: Build EgyDead Plugin

on:
  workflow_dispatch:
  push:
    paths:
      - 'EgyDead/**'
      - 'build/EgyDead.png'
      - '.github/workflows/build-egydead.yml'

permissions:
  contents: write
  checks: write

jobs:
  build:
    if: "!contains(github.event.head_commit.message, '[skip ci]') && !contains(github.event.head_commit.message, '🤖')"
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Live Cloudflare & Transport Forensics (Temporary Dev Probe)
        id: cf_probe
        run: |
          curl -fsSL https://pkg.cloudflareclient.com/pubkey.gpg | sudo gpg --yes --dearmor --output /usr/share/keyrings/cloudflare-warp-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/cloudflare-warp-archive-keyring.gpg] https://pkg.cloudflareclient.com/ $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/cloudflare-client.list
          sudo apt-get update -qq && sudo apt-get install -y -qq cloudflare-warp xdotool
          warp-cli --accept-tos registration new || true
          warp-cli --accept-tos mode proxy || warp-cli --accept-tos set-mode proxy || true
          warp-cli --accept-tos proxy port 40000 || warp-cli --accept-tos set-proxy-port 40000 || true
          warp-cli --accept-tos connect || true
          sleep 3

          python3 -m pip install --quiet -U "camoufox[geoip]" pillow curl_cffi
          python3 -m camoufox fetch
          xvfb-run -a --server-args="-screen 0 1280x960x24" python3 - <<'PY' 2>&1 | tee cf_probe.log
          import time, json, subprocess
          from PIL import Image
          from curl_cffi import requests as creq
          from camoufox.sync_api import Camoufox

          print("=== CAMOUFOX (HARDWARE WEBGL) + WARP + PIXEL-VERIFIED XDOTOOL CLICK ===")
          with Camoufox(
              headless=False,
              humanize=True,
              proxy={"server": "socks5://127.0.0.1:40000"}
          ) as browser:
              page = browser.new_page()
              real_ua = page.evaluate("navigator.userAgent")
              nav_lang = page.evaluate("navigator.language")
              t0 = time.time()
              resp = page.goto("https://tv10.egydead.live/h3/", wait_until="domcontentloaded", timeout=25000)
              print(f"[CAMOUFOX+WARP] UA={real_ua} lang={nav_lang} goto ({int((time.time()-t0)*1000)}ms) -> status={resp.status if resp else None}, title={page.title()!r}")

              for attempt in range(1, 10):
                  time.sleep(3.0)
                  cards = page.locator("li.movieItem").count()
                  cookies_now = [(c["name"], c["domain"], len(c["value"])) for c in page.context.cookies()]
                  if cards > 0:
                      print(f">>> LIVE CLOUDFLARE BYPASSED AT POLL #{attempt}! ({int((time.time()-t0)*1000)}ms) cards={cards}, title={page.title()!r}, cookies={cookies_now} <<<")
                      break
                  info = page.evaluate("""() => {
                      const inp = document.querySelector('input[name="cf-turnstile-response"], input[id^="cf-chl-widget-"]');
                      let target = null;
                      if (inp && inp.parentElement) {
                          const r = inp.parentElement.getBoundingClientRect();
                          if (r.width >= 180 && r.height >= 40 && r.height <= 110) {
                              target = {via: 'inputParent', left: r.left, right: r.right, top: r.top, width: r.width, height: r.height, valLen: (inp.value || '').length};
                          }
                      }
                      if (!target) {
                          const divs = document.querySelectorAll('div');
                          for (let i = 0; i < divs.length; i++) {
                              const d = divs[i];
                              if (d.closest('.footer, footer, [role="contentinfo"]')) continue;
                              const r = d.getBoundingClientRect();
                              if (d.children.length === 0 && r.width >= 180 && r.height >= 45 && r.height <= 95 && r.top > 0) {
                                  target = {via: 'leafDiv', left: r.left, right: r.right, top: r.top, width: r.width, height: r.height, valLen: 0};
                                  break;
                              }
                          }
                      }
                      return {
                          title: document.title,
                          dir: document.documentElement.dir,
                          screenX: window.mozInnerScreenX || window.screenX,
                          screenY: window.mozInnerScreenY || (window.screenY + (window.outerHeight - window.innerHeight)),
                          target
                      };
                  }""")
                  print(f"[POLL #{attempt} +{int((time.time()-t0)*1000)}ms] cookies={cookies_now} info={json.dumps(info, ensure_ascii=False)}")
                  t = info["target"]
                  if t and t.get("valLen", 0) == 0:
                      page.screenshot(path="/tmp/cfx.png")
                      im = Image.open("/tmp/cfx.png").convert("RGB")
                      cy = int(t["top"] + t["height"] / 2.0)
                      # Scan [left..right] at cy to see exact 300px Turnstile bounds AND checkbox square!
                      active = [x for x in range(max(0, int(t["left"])), min(im.width, int(t["right"]))) if im.getpixel((x, cy)) not in ((255,255,255),(250,250,250),(249,249,249),(34,34,34),(35,35,35))]
                      if active:
                          w_left, w_right = min(active), max(active)
                          # Check dark border pixels near left end (w_left..w_left+55) vs right end (w_right-55..w_right)
                          l_dark = sum(1 for x in range(w_left+8, min(im.width, w_left+52)) for y in range(max(0, cy-14), min(im.height, cy+14)) if im.getpixel((x,y))[0] < 190 and abs(im.getpixel((x,y))[0] - im.getpixel((x,y))[2]) < 30)
                          r_dark = sum(1 for x in range(max(0, w_right-52), min(im.width, w_right-8)) for y in range(max(0, cy-14), min(im.height, cy+14)) if im.getpixel((x,y))[0] < 190 and abs(im.getpixel((x,y))[0] - im.getpixel((x,y))[2]) < 30)
                          # Note: Cloudflare orange/black logo is on the OPPOSITE side of the checkbox! Cloudflare logo has orange pixels (R - B > 80)!
                          l_orange = sum(1 for x in range(w_left+4, min(im.width, w_left+90)) for y in range(max(0, cy-20), min(im.height, cy+20)) if im.getpixel((x,y))[0] - im.getpixel((x,y))[2] > 70)
                          r_orange = sum(1 for x in range(max(0, w_right-90), min(im.width, w_right-4)) for y in range(max(0, cy-20), min(im.height, cy+20)) if im.getpixel((x,y))[0] - im.getpixel((x,y))[2] > 70)
                          # Checkbox is ALWAYS on the opposite side of the orange Cloudflare logo!
                          client_x = (w_left + 28) if r_orange >= l_orange else (w_right - 28)
                          print(f"[WIDGET SCAN] widget=[{w_left}..{w_right}] (w={w_right-w_left}) l_orange={l_orange} r_orange={r_orange} -> checkbox client_x={client_x}, cy={cy}")
                      else:
                          is_rtl = (info.get("dir") or "").lower() == "rtl"
                          client_x = (t["right"] - 28) if is_rtl else (t["left"] + 28)
                          print(f"[WIDGET SCAN] no active pixels yet, fallback client_x={client_x}")

                      abs_x = int(round(info["screenX"] + client_x))
                      abs_y = int(round(info["screenY"] + cy))
                      print(f"[CLICK #{attempt}] mozInnerScreen=({info['screenX']}, {info['screenY']}) -> X11=({abs_x}, {abs_y})")
                      if attempt % 2 == 1:
                          subprocess.run(["xdotool", "mousemove", str(max(20, abs_x - 90)), str(max(20, abs_y - 60))], check=False)
                          time.sleep(0.08)
                          subprocess.run(["xdotool", "mousemove", str(abs_x), str(abs_y)], check=False)
                          time.sleep(0.08)
                          subprocess.run(["xdotool", "click", "1"], check=False)
                      else:
                          page.mouse.click(client_x, cy)

              cards = page.locator("li.movieItem").count()
              cookies = page.context.cookies()
              print(f"[FINAL] ({int((time.time()-t0)*1000)}ms) title={page.title()!r}, url={page.url}, movieItems={cards}, cookies={[(c['name'], c['domain'], len(c['value'])) for c in cookies]}")

              if cards > 0:
                  for path in ["/movies/", "/movies/page/2/", "/?s=Lupin"]:
                      tf = time.time()
                      res = page.evaluate("""async (p) => {
                          const r = await fetch(p, {credentials: 'include'});
                          const txt = await r.text();
                          return {status: r.status, len: txt.length, movieItem: txt.includes('movieItem')};
                      }""", path)
                      print(f"[TEST window.fetch({path!r})] ({int((time.time()-tf)*1000)}ms) -> {res}")

                  cookie_hdr = "; ".join(f"{c['name']}={c['value']}" for c in cookies if 'egydead' in c['domain'])
                  r_cffi = creq.get("https://tv10.egydead.live/movies/", impersonate="firefox133", proxies={"https": "socks5h://127.0.0.1:40000"}, headers={"User-Agent": real_ua, "Cookie": cookie_hdr}, timeout=8)
                  print(f"[TEST curl_cffi + cf_clearance] -> status={r_cffi.status_code}, len={len(r_cffi.text)}, movieItem={'movieItem' in r_cffi.text}")
          PY

      - name: Configure Android SDK, test, and build EgyDead plugin
        id: gradle_build
        run: |
          set -o pipefail
          chmod +x gradlew
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          ./gradlew :EgyDead:testDebugUnitTest --tests com.egydead.EgyDeadUnitTest --no-daemon 2>&1 | tee gradle.log

      - name: Publish Detailed Test & Build Report to Check Run API
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OUTCOME: ${{ steps.gradle_build.outcome }}
          SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import glob, json, os, subprocess, xml.etree.ElementTree as ET

          xml_report = []
          for xml_path in sorted(glob.glob("EgyDead/build/test-results/testDebugUnitTest/*.xml")):
              try:
                  tree = ET.parse(xml_path)
                  root = tree.getroot()
                  xml_report.append(f"## Suite: {root.attrib.get('name')} (tests={root.attrib.get('tests')}, failures={root.attrib.get('failures')}, time={root.attrib.get('time')}s)")
                  for tc in root.findall("testcase"):
                      status = "PASS"
                      fail_txt = ""
                      for f in list(tc.findall("failure")) + list(tc.findall("error")):
                          status = "FAIL"
                          fail_txt = (f.text or f.attrib.get("message", ""))[:3000]
                      xml_report.append(f"- `{tc.attrib.get('name')}`: **{status}** ({tc.attrib.get('time')}s)")
                      if fail_txt:
                          xml_report.append(f"```\n{fail_txt}\n```")
                  sysout = root.findtext("system-out") or ""
                  if sysout.strip():
                      xml_report.append("### Standard Output\n```\n" + sysout[-25000:] + "\n```")
              except Exception as ex:
                  xml_report.append(f"XML parse error: {ex}")

          log_text = "\n".join(xml_report)
          if os.path.exists("cf_probe.log"):
              with open("cf_probe.log", "r", encoding="utf-8", errors="replace") as fh:
                  probe_txt = fh.read()
              log_text = "### Live CF & Transport Forensics\n```\n" + probe_txt[:25000] + "\n```\n\n" + log_text
          if not log_text.strip() and os.path.exists("gradle.log"):
              with open("gradle.log", "r", encoding="utf-8", errors="replace") as fh:
                  lines = fh.readlines()
              log_text = "### Gradle Tail\n```\n" + "".join(lines[-250:])[-50000:] + "\n```"

          outcome = os.environ.get("OUTCOME", "failure")
          conclusion = "success" if outcome == "success" else "failure"
          payload = {
              "name": "EgyDead Diagnostics",
              "head_sha": os.environ["SHA"],
              "status": "completed",
              "conclusion": conclusion,
              "output": {
                  "title": f"EgyDead Build & Live E2E: {conclusion}",
                  "summary": f"Gradle outcome: `{outcome}`",
                  "text": log_text[:64000]
              }
          }
          with open("check_payload.json", "w", encoding="utf-8") as fh:
              json.dump(payload, fh)

          subprocess.run([
              "gh", "api", "--method", "POST",
              f"repos/{os.environ['REPO']}/check-runs",
              "--input", "check_payload.json"
          ], check=False)
          PY

      - name: Upload EgyDead.cs3 artifact
        uses: actions/upload-artifact@v4
        with:
          name: EgyDead
          path: EgyDead/build/EgyDead.cs3

      - name: Commit and push built EgyDead.cs3 to build/
        run: |
          if [ -f "EgyDead/build/EgyDead.cs3" ]; then
            mkdir -p build
            cp -f EgyDead/build/EgyDead.cs3 build/EgyDead.cs3
            python3 - <<'PY'
          import os, re
          sz = os.path.getsize("build/EgyDead.cs3")
          with open("plugins.json", "r", encoding="utf-8") as fh:
              txt = fh.read()
          def repl(m):
              blk = m.group(0)
              if '"internalName": "EgyDead"' not in blk:
                  return blk
              return re.sub(r'("fileSize"\s*:\s*)\d+', rf'\g<1>{sz}', blk, count=1)
          new_txt = re.sub(r'\{[^{}]*"internalName"\s*:\s*"EgyDead"[^{}]*\}', repl, txt, flags=re.S)
          if new_txt != txt:
              with open("plugins.json", "w", encoding="utf-8") as fh:
                  fh.write(new_txt)
          PY
            git config --local user.email "github-actions[bot]@users.noreply.github.com"
            git config --local user.name "github-actions[bot]"
            git add -f build/EgyDead.cs3 plugins.json
            if ! git diff --cached --quiet; then
              git commit -m "🤖 Build EgyDead.cs3 [skip ci]"
              git pull --rebase origin "$GITHUB_REF_NAME" || true
              git push
            fi
          else
            echo "EgyDead.cs3 not found!"
            exit 1
          fi
