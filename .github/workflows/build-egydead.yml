name: Build EgyDead Plugin

on:
  workflow_dispatch:
  push:
    paths:
      - 'EgyDead/**'
      - 'build/EgyDead.png'
      - '.github/workflows/build-egydead.yml'

permissions:
  contents: write
  checks: write

jobs:
  build:
    if: "!contains(github.event.head_commit.message, '[skip ci]') && !contains(github.event.head_commit.message, '🤖')"
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Live Cloudflare & Transport Forensics (Temporary Dev Probe)
        id: cf_probe
        continue-on-error: true
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq xdotool imagemagick >/dev/null 2>&1 || true
          python3 -m pip install --quiet pillow curl_cffi 2>/dev/null || true

          echo "=== 1. CHECK ALL EGYDEAD SUBDOMAINS / MIRRORS ===" | tee cf_probe.log
          python3 - <<'PY' | tee -a cf_probe.log
          from curl_cffi import requests as creq
          import concurrent.futures
          hosts = [
              f"https://tv{i}.egydead.live/h3/" for i in range(1, 16)
          ] + [
              "https://egydead.live/", "https://w.egydead.live/", "https://a.egydead.live/",
              "https://m.egydead.live/", "https://egydead.fyi/", "https://egydead.skin/",
              "https://egydead.cam/", "https://egydead.ink/", "https://egydead.sbs/"
          ]
          def chk(u):
              try:
                  r = creq.get(u, impersonate="chrome131_android", timeout=5, allow_redirects=True)
                  return f"{u} -> {r.status_code} final={r.url} len={len(r.text)} movieItem={'movieItem' in r.text}"
              except Exception as e:
                  return f"{u} -> ERR {type(e).__name__}"
          with concurrent.futures.ThreadPoolExecutor(max_workers=12) as ex:
              for line in ex.map(chk, hosts):
                  if "ERR" not in line:
                      print(" ", line)
          PY

          echo "=== 2. GENUINE UN-INSTRUMENTED CHROME + XDOTOOL TURNSTILE SOLVE ON tv10.egydead.live/h3/ ===" | tee -a cf_probe.log
          mkdir -p /tmp/ed_ext /tmp/ed_prof
          cat > /tmp/ed_ext/manifest.json <<'EOF'
          {
            "manifest_version": 3,
            "name": "EDProbe",
            "version": "1.0",
            "content_scripts": [{
              "matches": ["https://*.egydead.live/*"],
              "js": ["probe.js"],
              "run_at": "document_idle"
            }]
          }
          EOF
          cat > /tmp/ed_ext/probe.js <<'EOF'
          (function() {
            function report(tag) {
              const inp = document.querySelector('input[name="cf-turnstile-response"], input[id^="cf-chl-widget-"]');
              const hostParent = inp ? inp.parentElement : null;
              let box = null;
              if (hostParent) {
                const r = hostParent.getBoundingClientRect();
                box = {via: 'inputParent', x: Math.round(r.left), y: Math.round(r.top), w: Math.round(r.width), h: Math.round(r.height)};
              } else {
                const divs = document.querySelectorAll('div');
                for (let i = 0; i < divs.length; i++) {
                  const d = divs[i];
                  if (d.closest('.footer, footer, [role="contentinfo"]')) continue;
                  const r = d.getBoundingClientRect();
                  if (d.children.length === 0 && r.width >= 240 && r.width <= 420 && r.height >= 50 && r.height <= 95 && r.top > 0) {
                    box = {via: 'leafDiv', x: Math.round(r.left), y: Math.round(r.top), w: Math.round(r.width), h: Math.round(r.height)};
                    break;
                  }
                }
              }
              const cards = document.querySelectorAll('li.movieItem').length;
              let extra = '';
              if (cards > 0 && !window.__edFetched) {
                window.__edFetched = true;
                fetch('/movies/', {credentials: 'include'}).then(async r => {
                  const t = await r.text();
                  window.__edMovies = r.status + ':' + t.length + ':' + t.includes('movieItem');
                }).catch(e => { window.__edMovies = 'err'; });
              }
              if (window.__edMovies) extra = ':mov=' + window.__edMovies;
              document.title = '[ED:' + cards + ':' + (box ? (box.via + '@' + box.x + ',' + box.y + ',' + box.w + 'x' + box.h) : 'nobox') + extra + '] ' + document.title.replace(/^\[ED:[^\]]+\]\s*/, '');
            }
            setInterval(report, 500);
            report();
          })();
          EOF

          xvfb-run -a --server-args="-screen 0 412x915x24" bash -c '
            google-chrome \
              --no-sandbox \
              --no-first-run \
              --no-default-browser-check \
              --user-data-dir=/tmp/ed_prof \
              --window-position=0,0 \
              --window-size=412,915 \
              --kiosk \
              --user-agent="Mozilla/5.0 (Linux; Android 14; K) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/131.0.0.0 Mobile Safari/537.36" \
              --load-extension=/tmp/ed_ext \
              "https://tv10.egydead.live/h3/" >/dev/null 2>&1 &
            CPID=$!
            for s in 1 2 3 4 5 6; do
              sleep 1
              WTITLE=$(xdotool search --onlyvisible --name "ED:" getwindowname 2>/dev/null | head -n 1 || true)
              echo "[T+${s}s] window=$WTITLE"
            done
            # Capture screenshot of the whole X11 screen to inspect exact Turnstile checkbox pixel position!
            import -window root /tmp/screen_before.png 2>/dev/null || true
            python3 - <<PY2
          from PIL import Image
          import os, re, subprocess
          # Get Chrome content offset (toolbar height) and find Turnstile border/checkbox in screenshot!
          if os.path.exists("/tmp/screen_before.png"):
              im = Image.open("/tmp/screen_before.png").convert("RGB")
              w, h = im.size
              print(f"Screenshot size: {w}x{h}")
              # Scan rows y=300..620 for the ~65px tall Turnstile widget box & checkbox square!
              for y in range(300, min(650, h), 10):
                  row_sample = [im.getpixel((x, y)) for x in range(10, min(410, w), 20)]
                  non_white = sum(1 for r,g,b in row_sample if (r,g,b) != (255,255,255) and (r,g,b) != (34,34,34))
                  if non_white > 0:
                      # Find dark/gray pixels horizontally on this row
                      xs = [x for x in range(0, min(420, w)) if im.getpixel((x, y)) not in ((255,255,255), (249,249,249), (34,34,34))]
                      if xs:
                          print(f"  y={y}: active x range [{min(xs)}..{max(xs)}] count={len(xs)} leftPx={im.getpixel((44,y))} rightPx={im.getpixel((368,y))}")
          PY2
            # Parse box y from window title [ED:0:...@x,y,wxh] + Chrome UI top bar (~85px in desktop Chrome; 0px in Android WebView!)
            WTITLE=$(xdotool search --onlyvisible --name "ED:" getwindowname 2>/dev/null | head -n 1 || true)
            echo "Before click title: $WTITLE"
            # Also find exact checkbox square (~24x24 border) in /tmp/screen_before.png!
            CLICK_XY=$(python3 - <<PY3
          from PIL import Image
          im = Image.open("/tmp/screen_before.png").convert("RGB")
          # In Turnstile widget (y between 380 and 580 on X11 including Chrome address bar), find checkbox square or widget center
          # Wait: Turnstile widget background is #fafafa (250,250,250) or #ffffff with border #e0e0e0 (224,224,224) / #dadada
          best_y = None
          rows = []
          for y in range(350, 600):
              # Count pixels matching Turnstile light card bg (250,250,250) or border (224,224,224)
              cnt = sum(1 for x in range(15, 400) if 215 <= im.getpixel((x,y))[0] <= 252 and im.getpixel((x,y))[0] == im.getpixel((x,y))[1] == im.getpixel((x,y))[2] and im.getpixel((x,y)) != (255,255,255))
              if cnt > 150:
                  rows.append(y)
          if rows:
              top_y, bot_y = min(rows), max(rows)
              mid_y = (top_y + bot_y) // 2
              # Check left (x=25..75) vs right (x=335..390) around mid_y for checkbox border pixels (< 200)
              left_dark = sum(1 for x in range(25, 80) for y in range(mid_y-15, mid_y+15) if im.getpixel((x,y))[0] < 200)
              right_dark = sum(1 for x in range(335, 392) for y in range(mid_y-15, mid_y+15) if im.getpixel((x,y))[0] < 200)
              cx = 368 if right_dark > left_dark else 44
              print(f"{cx} {mid_y} top={top_y} bot={bot_y} leftDark={left_dark} rightDark={right_dark}")
          else:
              print("44 495 none")
          PY3
            )
            echo "Detected Turnstile screen coords: $CLICK_XY"
            CX=$(echo "$CLICK_XY" | awk "{print \$1}")
            CY=$(echo "$CLICK_XY" | awk "{print \$2}")
            xdotool mousemove "$CX" "$CY" sleep 0.1 click 1
            for s in 1 2 3 4 5 6 7 8; do
              sleep 1
              WTITLE=$(xdotool search --onlyvisible --name "" getwindowname 2>/dev/null | grep -E "ED:|ايجي|EgyDead|لحظة|Just" | head -n 1 || true)
              echo "[AFTER CLICK +${s}s] window=$WTITLE"
              if echo "$WTITLE" | grep -q -E "ED:[1-9]"; then
                echo ">>> CLOUDFLARE TURNSTILE SOLVED LIVE IN REAL CHROME!! <<<"
                break
              fi
            done
            kill $CPID 2>/dev/null || true
          ' 2>&1 | tee -a cf_probe.log

      - name: Configure Android SDK, test, and build EgyDead plugin
        id: gradle_build
        run: |
          set -o pipefail
          chmod +x gradlew
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          ./gradlew :EgyDead:testDebugUnitTest :EgyDead:make --info --stacktrace --no-daemon 2>&1 | tee gradle.log

      - name: Publish Detailed Test & Build Report to Check Run API
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OUTCOME: ${{ steps.gradle_build.outcome }}
          SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import glob, json, os, subprocess, xml.etree.ElementTree as ET

          xml_report = []
          for xml_path in sorted(glob.glob("EgyDead/build/test-results/testDebugUnitTest/*.xml")):
              try:
                  tree = ET.parse(xml_path)
                  root = tree.getroot()
                  xml_report.append(f"## Suite: {root.attrib.get('name')} (tests={root.attrib.get('tests')}, failures={root.attrib.get('failures')}, time={root.attrib.get('time')}s)")
                  for tc in root.findall("testcase"):
                      status = "PASS"
                      fail_txt = ""
                      for f in list(tc.findall("failure")) + list(tc.findall("error")):
                          status = "FAIL"
                          fail_txt = (f.text or f.attrib.get("message", ""))[:3000]
                      xml_report.append(f"- `{tc.attrib.get('name')}`: **{status}** ({tc.attrib.get('time')}s)")
                      if fail_txt:
                          xml_report.append(f"```\n{fail_txt}\n```")
                  sysout = root.findtext("system-out") or ""
                  if sysout.strip():
                      xml_report.append("### Standard Output\n```\n" + sysout[-25000:] + "\n```")
              except Exception as ex:
                  xml_report.append(f"XML parse error: {ex}")

          log_text = "\n".join(xml_report)
          if os.path.exists("cf_probe.log"):
              with open("cf_probe.log", "r", encoding="utf-8", errors="replace") as fh:
                  probe_txt = fh.read()
              log_text = "### Live CF & Transport Forensics\n```\n" + probe_txt[:25000] + "\n```\n\n" + log_text
          if not log_text.strip() and os.path.exists("gradle.log"):
              with open("gradle.log", "r", encoding="utf-8", errors="replace") as fh:
                  lines = fh.readlines()
              log_text = "### Gradle Tail\n```\n" + "".join(lines[-250:])[-50000:] + "\n```"

          outcome = os.environ.get("OUTCOME", "failure")
          conclusion = "success" if outcome == "success" else "failure"
          payload = {
              "name": "EgyDead Diagnostics",
              "head_sha": os.environ["SHA"],
              "status": "completed",
              "conclusion": conclusion,
              "output": {
                  "title": f"EgyDead Build & Live E2E: {conclusion}",
                  "summary": f"Gradle outcome: `{outcome}`",
                  "text": log_text[:64000]
              }
          }
          with open("check_payload.json", "w", encoding="utf-8") as fh:
              json.dump(payload, fh)

          subprocess.run([
              "gh", "api", "--method", "POST",
              f"repos/{os.environ['REPO']}/check-runs",
              "--input", "check_payload.json"
          ], check=False)
          PY

      - name: Upload EgyDead.cs3 artifact
        uses: actions/upload-artifact@v4
        with:
          name: EgyDead
          path: EgyDead/build/EgyDead.cs3

      - name: Commit and push built EgyDead.cs3 to build/
        run: |
          if [ -f "EgyDead/build/EgyDead.cs3" ]; then
            mkdir -p build
            cp -f EgyDead/build/EgyDead.cs3 build/EgyDead.cs3
            python3 - <<'PY'
          import os, re
          sz = os.path.getsize("build/EgyDead.cs3")
          with open("plugins.json", "r", encoding="utf-8") as fh:
              txt = fh.read()
          def repl(m):
              blk = m.group(0)
              if '"internalName": "EgyDead"' not in blk:
                  return blk
              return re.sub(r'("fileSize"\s*:\s*)\d+', rf'\g<1>{sz}', blk, count=1)
          new_txt = re.sub(r'\{[^{}]*"internalName"\s*:\s*"EgyDead"[^{}]*\}', repl, txt, flags=re.S)
          if new_txt != txt:
              with open("plugins.json", "w", encoding="utf-8") as fh:
                  fh.write(new_txt)
          PY
            git config --local user.email "github-actions[bot]@users.noreply.github.com"
            git config --local user.name "github-actions[bot]"
            git add -f build/EgyDead.cs3 plugins.json
            if ! git diff --cached --quiet; then
              git commit -m "🤖 Build EgyDead.cs3 [skip ci]"
              git pull --rebase origin "$GITHUB_REF_NAME" || true
              git push
            fi
          else
            echo "EgyDead.cs3 not found!"
            exit 1
          fi
