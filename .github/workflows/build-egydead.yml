name: Build EgyDead Plugin

on:
  workflow_dispatch:
  push:
    paths:
      - 'EgyDead/**'
      - 'build/EgyDead.png'
      - '.github/workflows/build-egydead.yml'

permissions:
  contents: write
  checks: write

jobs:
  build:
    if: "!contains(github.event.head_commit.message, '[skip ci]') && !contains(github.event.head_commit.message, '🤖')"
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Start Live Cloudflare Turnstile Bypass Bridge, Run E2E Tests & Build EgyDead.cs3
        id: gradle_build
        run: |
          set -euo pipefail
          curl -fsSL https://pkg.cloudflareclient.com/pubkey.gpg | sudo gpg --yes --dearmor --output /usr/share/keyrings/cloudflare-warp-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/cloudflare-warp-archive-keyring.gpg] https://pkg.cloudflareclient.com/ $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/cloudflare-client.list >/dev/null
          sudo apt-get update -qq && sudo apt-get install -y -qq cloudflare-warp xdotool
          warp-cli --accept-tos registration new || true
          warp-cli --accept-tos mode proxy || warp-cli --accept-tos set-mode proxy || true
          warp-cli --accept-tos proxy port 40000 || warp-cli --accept-tos set-proxy-port 40000 || true
          warp-cli --accept-tos connect || true
          sleep 3

          python3 -m pip install --quiet -U "camoufox[geoip]" pillow
          python3 -m camoufox fetch

          rm -f /tmp/cf_bridge_ready /tmp/cf_bridge_failed /tmp/cf_bridge_stop
          cat > /tmp/run_cf_bridge.py <<'PY'
          import json, os, queue, subprocess, threading, time, urllib.parse
          from http.server import BaseHTTPRequestHandler, HTTPServer
          from PIL import Image
          from camoufox.sync_api import Camoufox

          req_q = queue.Queue()

          class BridgeHandler(BaseHTTPRequestHandler):
              def log_message(self, fmt, *args):
                  pass

              def do_POST(self):
                  if self.path != "/fetch":
                      self.send_response(404)
                      self.end_headers()
                      return
                  length = int(self.headers.get("Content-Length", "0"))
                  raw = self.rfile.read(length).decode("utf-8", errors="replace")
                  payload = json.loads(raw)
                  resp_q = queue.Queue(maxsize=1)
                  req_q.put((payload, resp_q))
                  try:
                      result = resp_q.get(timeout=40.0)
                  except queue.Empty:
                      result = {"status": 504, "body": ""}
                  out = json.dumps(result, ensure_ascii=False).encode("utf-8")
                  self.send_response(200)
                  self.send_header("Content-Type", "application/json; charset=utf-8")
                  self.send_header("Content-Length", str(len(out)))
                  self.end_headers()
                  self.wfile.write(out)

          srv = HTTPServer(("127.0.0.1", 18799), BridgeHandler)
          threading.Thread(target=srv.serve_forever, daemon=True).start()

          print("=== STARTING LIVE TURNSTILE SOLVER + BROWSER BRIDGE ON 127.0.0.1:18799 ===", flush=True)
          with Camoufox(
              headless=False,
              humanize=True,
              geoip=True,
              proxy={"server": "socks5://127.0.0.1:40000"}
          ) as browser:
              page = browser.new_page()
              t0 = time.time()
              resp = page.goto("https://tv10.egydead.live/h3/", wait_until="domcontentloaded", timeout=25000)
              print(f"[BRIDGE] Initial goto ({int((time.time()-t0)*1000)}ms) -> status={resp.status if resp else None}, title={page.title()!r}", flush=True)

              solved = False
              for attempt in range(1, 11):
                  time.sleep(2.8)
                  cards = page.locator("li.movieItem").count()
                  if cards > 0:
                      cookies_now = [(c["name"], c["domain"], len(c["value"])) for c in page.context.cookies()]
                      print(f"[BRIDGE] LIVE TURNSTILE SOLVED AT POLL #{attempt} ({int((time.time()-t0)*1000)}ms)! cards={cards}, title={page.title()!r}, cookies={cookies_now}", flush=True)
                      solved = True
                      break
                  info = page.evaluate("""() => {
                      const inp = document.querySelector('input[name="cf-turnstile-response"], input[id^="cf-chl-widget-"]');
                      let target = null;
                      if (inp && inp.parentElement) {
                          const r = inp.parentElement.getBoundingClientRect();
                          if (r.width >= 180 && r.height >= 40 && r.height <= 120) {
                              target = {left: r.left, right: r.right, top: r.top, width: r.width, height: r.height, valLen: (inp.value || '').length};
                          }
                      }
                      if (!target) {
                          const divs = document.querySelectorAll('div');
                          for (let i = 0; i < divs.length; i++) {
                              const d = divs[i];
                              if (d.closest('.footer, footer, [role="contentinfo"]')) continue;
                              const r = d.getBoundingClientRect();
                              if (d.children.length === 0 && r.width >= 180 && r.height >= 45 && r.height <= 95 && r.top > 0) {
                                  target = {left: r.left, right: r.right, top: r.top, width: r.width, height: r.height, valLen: 0};
                                  break;
                              }
                          }
                      }
                      return {
                          dir: document.documentElement.dir || '',
                          screenX: window.mozInnerScreenX || window.screenX || 0,
                          screenY: window.mozInnerScreenY || (window.screenY + (window.outerHeight - window.innerHeight)) || 0,
                          target
                      };
                  }""")
                  t = info.get("target")
                  if t and t.get("valLen", 0) == 0:
                      page.screenshot(path="/tmp/cfx.png")
                      im = Image.open("/tmp/cfx.png").convert("RGB")
                      cy = int(t["top"] + t["height"] / 2.0)
                      active = [x for x in range(max(0, int(t["left"])), min(im.width, int(t["right"]))) if im.getpixel((x, cy)) not in ((255,255,255),(250,250,250),(249,249,249),(34,34,34),(35,35,35))]
                      if active:
                          w_left, w_right = min(active), max(active)
                          l_orange = sum(1 for x in range(w_left+4, min(im.width, w_left+90)) for y in range(max(0, cy-20), min(im.height, cy+20)) if im.getpixel((x,y))[0] - im.getpixel((x,y))[2] > 70)
                          r_orange = sum(1 for x in range(max(0, w_right-90), min(im.width, w_right-4)) for y in range(max(0, cy-20), min(im.height, cy+20)) if im.getpixel((x,y))[0] - im.getpixel((x,y))[2] > 70)
                          client_x = (w_left + 28) if r_orange >= l_orange else (w_right - 28)
                      else:
                          is_rtl = (info.get("dir") or "").lower() == "rtl"
                          client_x = (t["right"] - 28) if is_rtl else (t["left"] + 28)
                      abs_x = int(round(info["screenX"] + client_x))
                      abs_y = int(round(info["screenY"] + cy))
                      print(f"[BRIDGE] Click #{attempt} -> X11=({abs_x}, {abs_y})", flush=True)
                      subprocess.run(["xdotool", "mousemove", str(max(20, abs_x - 80)), str(max(20, abs_y - 50))], check=False)
                      time.sleep(0.08)
                      subprocess.run(["xdotool", "mousemove", str(abs_x), str(abs_y)], check=False)
                      time.sleep(0.08)
                      subprocess.run(["xdotool", "click", "1"], check=False)

              if not solved:
                  with open("/tmp/cf_bridge_failed", "w") as fh:
                      fh.write("failed")
                  raise SystemExit("Failed to solve live Turnstile before timeout")

              with open("/tmp/cf_bridge_ready", "w") as fh:
                  fh.write("ready")

              while not os.path.exists("/tmp/cf_bridge_stop"):
                  try:
                      payload, resp_q = req_q.get(timeout=0.25)
                  except queue.Empty:
                      continue
                  url = payload.get("url", "")
                  method = (payload.get("method") or "GET").upper()
                  form = payload.get("form")
                  encoded_body = urllib.parse.urlencode(form) if (form and method == "POST") else None
                  t_req = time.time()
                  try:
                      res = page.evaluate("""async (args) => {
                          const init = {
                              method: args.method,
                              credentials: 'include',
                              redirect: 'follow'
                          };
                          if (args.body !== null && args.method === 'POST') {
                              init.headers = {'Content-Type': 'application/x-www-form-urlencoded; charset=UTF-8'};
                              init.body = args.body;
                          }
                          const r = await fetch(args.url, init);
                          const txt = await r.text();
                          return {status: r.status, url: r.url, body: txt};
                      }""", {"url": url, "method": method, "body": encoded_body})
                      print(f"[BRIDGE-FETCH] {method} {url} ({int((time.time()-t_req)*1000)}ms) -> HTTP {res['status']} ({len(res['body'])} bytes)", flush=True)
                      resp_q.put(res)
                  except Exception as ex:
                      print(f"[BRIDGE-ERR] {method} {url} -> {ex}", flush=True)
                      resp_q.put({"status": 500, "body": ""})
          PY

          xvfb-run -a --server-args="-screen 0 1280x960x24" python3 /tmp/run_cf_bridge.py > cf_probe.log 2>&1 &
          BRIDGE_PID=$!
          cleanup_bridge() {
            touch /tmp/cf_bridge_stop
            kill "$BRIDGE_PID" 2>/dev/null || true
          }
          trap cleanup_bridge EXIT

          for i in $(seq 1 90); do
            if [ -f /tmp/cf_bridge_ready ]; then
              echo "Live Turnstile bridge is READY!"
              break
            fi
            if [ -f /tmp/cf_bridge_failed ] || ! kill -0 "$BRIDGE_PID" 2>/dev/null; then
              echo "Live Turnstile bridge failed to initialize:"
              cat cf_probe.log || true
              exit 1
            fi
            sleep 1
          done

          chmod +x gradlew
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          export EGYDEAD_LIVE_BRIDGE_URL="http://127.0.0.1:18799/fetch"
          export EGYDEAD_REQUIRE_LIVE_CF="1"
          export EGYDEAD_LIVE_TESTS="1"
          ./gradlew :EgyDead:testDebugUnitTest :EgyDead:make --no-daemon 2>&1 | tee gradle.log
          touch /tmp/cf_bridge_stop
          wait "$BRIDGE_PID" || true

      - name: Publish Detailed Test & Build Report to Check Run API
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OUTCOME: ${{ steps.gradle_build.outcome }}
          SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import glob, json, os, subprocess, xml.etree.ElementTree as ET

          xml_report = []
          for xml_path in sorted(glob.glob("EgyDead/build/test-results/testDebugUnitTest/*.xml")):
              try:
                  tree = ET.parse(xml_path)
                  root = tree.getroot()
                  xml_report.append(f"## Suite: {root.attrib.get('name')} (tests={root.attrib.get('tests')}, failures={root.attrib.get('failures')}, time={root.attrib.get('time')}s)")
                  for tc in root.findall("testcase"):
                      status = "PASS"
                      fail_txt = ""
                      for f in list(tc.findall("failure")) + list(tc.findall("error")):
                          status = "FAIL"
                          fail_txt = (f.text or f.attrib.get("message", ""))[:3000]
                      xml_report.append(f"- `{tc.attrib.get('name')}`: **{status}** ({tc.attrib.get('time')}s)")
                      if fail_txt:
                          xml_report.append(f"```\n{fail_txt}\n```")
                  sysout = root.findtext("system-out") or ""
                  if sysout.strip():
                      xml_report.append("### Standard Output\n```\n" + sysout[-25000:] + "\n```")
              except Exception as ex:
                  xml_report.append(f"XML parse error: {ex}")

          log_text = "\n".join(xml_report)
          if os.path.exists("cf_probe.log"):
              with open("cf_probe.log", "r", encoding="utf-8", errors="replace") as fh:
                  probe_txt = fh.read()
              log_text = "### Live CF Turnstile Bridge Telemetry\n```\n" + probe_txt[:22000] + "\n```\n\n" + log_text

          if not xml_report and os.path.exists("gradle.log"):
              with open("gradle.log", "r", encoding="utf-8", errors="replace") as fh:
                  lines = fh.readlines()
              log_text += "\n\n### Gradle Tail\n```\n" + "".join(lines[-250:])[-35000:] + "\n```"

          outcome = os.environ.get("OUTCOME", "failure")
          conclusion = "success" if outcome == "success" else "failure"
          payload = {
              "name": "EgyDead Diagnostics",
              "head_sha": os.environ["SHA"],
              "status": "completed",
              "conclusion": conclusion,
              "output": {
                  "title": f"EgyDead Build & Live E2E: {conclusion}",
                  "summary": f"Gradle outcome: `{outcome}`",
                  "text": log_text[:64000]
              }
          }
          with open("check_payload.json", "w", encoding="utf-8") as fh:
              json.dump(payload, fh)

          subprocess.run([
              "gh", "api", "--method", "POST",
              f"repos/{os.environ['REPO']}/check-runs",
              "--input", "check_payload.json"
          ], check=False)
          PY

      - name: Upload EgyDead.cs3 artifact
        uses: actions/upload-artifact@v4
        with:
          name: EgyDead
          path: EgyDead/build/EgyDead.cs3

      - name: Commit and push built EgyDead.cs3 to build/
        if: github.ref == 'refs/heads/main'
        run: |
          if [ -f "EgyDead/build/EgyDead.cs3" ]; then
            mkdir -p build
            cp -f EgyDead/build/EgyDead.cs3 build/EgyDead.cs3
            python3 - <<'PY'
          import os, re
          sz = os.path.getsize("build/EgyDead.cs3")
          with open("plugins.json", "r", encoding="utf-8") as fh:
              txt = fh.read()
          def repl(m):
              blk = m.group(0)
              if '"internalName": "EgyDead"' not in blk:
                  return blk
              return re.sub(r'("fileSize"\s*:\s*)\d+', rf'\g<1>{sz}', blk, count=1)
          new_txt = re.sub(r'\{[^{}]*"internalName"\s*:\s*"EgyDead"[^{}]*\}', repl, txt, flags=re.S)
          if new_txt != txt:
              with open("plugins.json", "w", encoding="utf-8") as fh:
                  fh.write(new_txt)
          PY
            git config --local user.email "github-actions[bot]@users.noreply.github.com"
            git config --local user.name "github-actions[bot]"
            git add -f build/EgyDead.cs3 plugins.json
            if ! git diff --cached --quiet; then
              git commit -m "🤖 Build EgyDead.cs3 [skip ci]"
              git pull --rebase origin "$GITHUB_REF_NAME" || true
              git push
            fi
          else
            echo "EgyDead.cs3 not found!"
            exit 1
          fi
