name: Build EgyDead Plugin

on:
  workflow_dispatch:
  push:
    paths:
      - 'EgyDead/**'
      - 'build/EgyDead.png'
      - '.github/workflows/build-egydead.yml'

jobs:
  build:
    if: "!contains(github.event.head_commit.message, '[skip ci]') && !contains(github.event.head_commit.message, '🤖')"
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Configure Android SDK, test, and build EgyDead plugin
        run: |
          chmod +x gradlew
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          ./gradlew :EgyDead:testDebugUnitTest :EgyDead:make --info --stacktrace --no-daemon

      - name: Upload EgyDead test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: EgyDead-test-reports
          path: EgyDead/build/reports/tests/

      - name: Upload EgyDead.cs3 artifact
        uses: actions/upload-artifact@v4
        with:
          name: EgyDead
          path: EgyDead/build/EgyDead.cs3
