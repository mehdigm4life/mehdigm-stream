name: Build Animhq Plugin

on:
  workflow_dispatch:
  push:
    paths:
      - 'Animhq/**'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Animhq plugin
        run: ./gradlew :Animhq:make

      - name: Upload Animhq.cs3 artifact
        uses: actions/upload-artifact@v4
        with:
          name: Animhq
          path: Animhq/build/Animhq.cs3

      - name: Commit and push built cs3 to build/
        run: |
          if [ -f "Animhq/build/Animhq.cs3" ]; then
            cp Animhq/build/Animhq.cs3 build/Animhq.cs3
            git config --local user.email "github-actions[bot]@users.noreply.github.com"
            git config --local user.name "github-actions[bot]"
            git add -f build/Animhq.cs3
            if ! git diff --staged --quiet; then
              git commit -m "🤖 Build Animhq.cs3"
              git push
            fi
          fi