name: Temp Inspect WitAnime

on:
  push:
    branches:
      - arena/74b8c0fa-mehdigm-stream

permissions:
  contents: write

jobs:
  inspect:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Inspect WitAnime Watch/Download Sources & Sub-Hosts
        run: |
          pip install -q "curl_cffi" beautifulsoup4
          mkdir -p .tmp_wit/hosts
          python3 - <<'PY'
          import concurrent.futures, json, os, random, re, time, traceback, urllib.parse
          from bs4 import BeautifulSoup
          from curl_cffi import requests as creq

          BASE = "https://witanime.site"

          direct = creq.Session(impersonate="chrome124")
          feeds = [
              ("socks5h", "https://raw.githubusercontent.com/TheSpeedX/SOCKS-List/master/socks5.txt"),
              ("socks5h", "https://raw.githubusercontent.com/monosans/proxy-list/main/proxies/socks5.txt"),
              ("socks4", "https://raw.githubusercontent.com/TheSpeedX/SOCKS-List/master/socks4.txt"),
          ]
          cands = []
          for sch, fu in feeds:
              try:
                  for ln in direct.get(fu, timeout=8).text.splitlines():
                      ln = ln.strip()
                      if re.match(r"^\d+\.\d+\.\d+\.\d+:\d+$", ln):
                          cands.append(f"{sch}://{ln}")
              except Exception:
                  pass
          random.shuffle(cands)

          def is_valid_wit(r):
              if not r or r.status_code != 200 or len(r.text) < 2000:
                  return False
              low = r.text[:6000].lower()
              if "just a moment" in low or "_cf_chl_opt" in low:
                  return False
              return "witanime" in low

          def test_px(px):
              try:
                  s = creq.Session(impersonate="chrome124", proxies={"http": px, "https": px})
                  r = s.get(BASE + "/", timeout=8)
                  if is_valid_wit(r):
                      return px
              except Exception:
                  pass
              return None

          good_proxies = []
          with concurrent.futures.ThreadPoolExecutor(max_workers=40) as ex:
              for res in ex.map(test_px, cands[:220]):
                  if res:
                      good_proxies.append(res)
                      if len(good_proxies) >= 12:
                          break
          print("Good proxies:", len(good_proxies), flush=True)
          assert good_proxies

          # Also test /new-episodes?page=2 JSON endpoint!
          ne_s = creq.Session(impersonate="chrome124", proxies={"http": good_proxies[0], "https": good_proxies[0]})
          ne_r = ne_s.get(f"{BASE}/new-episodes?page=2", headers={"Accept": "application/json", "Referer": BASE + "/"}, timeout=12)

          seen_labels = set()

          def resolve_all_on_watch(watch_url, tag, start_p):
              last_diag = "init"
              for off in range(len(good_proxies)):
                  p_i = (start_p + off) % len(good_proxies)
                  px = good_proxies[p_i]
                  ws = creq.Session(impersonate="chrome124", proxies={"http": px, "https": px})
                  try:
                      r1 = ws.get(watch_url, timeout=14)
                      if not is_valid_wit(r1):
                          last_diag = f"bad_page:{r1.status_code}"
                          continue
                      soup = BeautifulSoup(r1.text, "html.parser")
                      csrf_el = soup.select_one("meta[name='csrf-token']")
                      csrf = csrf_el["content"] if csrf_el and csrf_el.has_attr("content") else ""
                      m_src = re.search(r"sourcesUrl\s*:\s*['\"]([^'\"]+)['\"]", r1.text)
                      src_url = urllib.parse.urljoin(BASE + "/", m_src.group(1).replace("\\/", "/")) if m_src else watch_url.rstrip("/") + "/sources"
                      time.sleep(0.4)
                      r_src = ws.post(
                          src_url,
                          data=b"",
                          headers={
                              "Accept": "application/json",
                              "X-CSRF-TOKEN": csrf,
                              "Origin": BASE,
                              "Referer": watch_url,
                              "Sec-Fetch-Site": "same-origin",
                              "Sec-Fetch-Mode": "cors",
                              "Sec-Fetch-Dest": "empty",
                          },
                          timeout=14,
                      )
                      if r_src.status_code != 200 or not r_src.text.strip().startswith("{"):
                          last_diag = f"src_fail:{r_src.status_code}:{r_src.text[:250]}"
                          print("src_fail on", px, last_diag, flush=True)
                          continue
                      sjson = r_src.json()
                      out = {
                          "watch_url": watch_url,
                          "csrf_len": len(csrf),
                          "sources_url": src_url,
                          "sources_status": r_src.status_code,
                          "sources_json": sjson,
                      }
                      resolved = []
                      items = []
                      for q, arr in (sjson.get("players") or {}).items():
                          for obj in (arr or []):
                              items.append(("stream", q, obj.get("label", ""), obj.get("token", ""), obj))
                      for q, arr in (sjson.get("downloads") or {}).items():
                          for obj in (arr or []):
                              items.append(("download", q, obj.get("label", ""), obj.get("token", ""), obj))

                      for idx, (kind, q, label, tok, raw_obj) in enumerate(items):
                          norm_lbl = f"{kind}:{label.lower()}"
                          if tag != "tr4" and norm_lbl in seen_labels:
                              continue
                          seen_labels.add(norm_lbl)
                          ep1 = "stream-source" if kind == "stream" else "download-source"
                          ep2 = "stream-gate" if kind == "stream" else "download-gate"
                          u1 = f"{BASE}/watch/{ep1}/{tok}"
                          u2 = f"{BASE}/watch/{ep2}/{tok}"
                          time.sleep(0.35)
                          rs1 = ws.post(
                              u1,
                              data=b"",
                              headers={
                                  "Accept": "application/json",
                                  "X-CSRF-TOKEN": csrf,
                                  "Origin": BASE,
                                  "Referer": watch_url,
                                  "Sec-Fetch-Site": "same-origin",
                                  "Sec-Fetch-Mode": "cors",
                                  "Sec-Fetch-Dest": "empty",
                              },
                              timeout=12,
                          )
                          rg1 = ws.get(
                              u2,
                              headers={
                                  "Referer": watch_url,
                                  "Sec-Fetch-Site": "same-origin",
                                  "Sec-Fetch-Mode": "navigate",
                                  "Sec-Fetch-Dest": "iframe" if kind == "stream" else "document",
                              },
                              allow_redirects=False,
                              timeout=12,
                          )
                          loc = rg1.headers.get("location", "")
                          resolved.append({
                              "kind": kind,
                              "quality": q,
                              "label": label,
                              "version": raw_obj.get("version"),
                              "lang": raw_obj.get("lang"),
                              "source_status": rs1.status_code,
                              "source_body": rs1.text[:350],
                              "gate_status": rg1.status_code,
                              "gate_location": loc,
                              "gate_body": rg1.text[:450] if not loc else "",
                          })
                      out["resolved"] = resolved
                      return out, (p_i + 1) % len(good_proxies)
                  except Exception as e:
                      last_diag = f"exc:{e}"
              return {"watch_url": watch_url, "err": last_diag}, start_p

          report = {
              "new_episodes_p2": {
                  "status": ne_r.status_code,
                  "body_snip": ne_r.text[:600],
              },
              "watch_probes": {},
          }
          p_idx = 0
          for t_tag, t_url in [
              ("tr4", f"{BASE}/watch/tokyo-revengers-santen-sensou-hen/4"),
              ("bc3", f"{BASE}/watch/black-clover-2nd-season/3"),
              ("bl9", f"{BASE}/watch/bleach-sennen-kessen-hen-kashin-tan/9"),
              ("mov", f"{BASE}/watch/movie/boku-no-kokoro-no-yabai-yatsu-movie"),
          ]:
              res_w, p_idx = resolve_all_on_watch(t_url, t_tag, p_idx)
              report["watch_probes"][t_tag] = res_w

          seen_ext_hosts = set()
          ext_probes = {}
          for t_tag, pdata in report["watch_probes"].items():
              for item in pdata.get("resolved", []):
                  eu = item.get("gate_location") or ""
                  if not eu.startswith("http"):
                      m = re.search(r'https?://[^\s"\'<>]+', item.get("source_body", "") + " " + item.get("gate_body", ""))
                      eu = m.group(0) if m else ""
                  if not eu.startswith("http"):
                      continue
                  dom = urllib.parse.urlparse(eu).netloc.lower().removeprefix("www.")
                  key = f"{item['kind']}_{item['label']}_{dom}"
                  if key in seen_ext_hosts:
                      continue
                  seen_ext_hosts.add(key)
                  safe_k = re.sub(r"[^a-zA-Z0-9_.-]+", "_", key)[:60]
                  try:
                      sub_s = creq.Session(impersonate="chrome124")
                      rext = sub_s.get(eu, headers={"Referer": BASE + "/"}, timeout=15)
                      if rext.status_code in (403, 503) and good_proxies:
                          ps = creq.Session(impersonate="chrome124", proxies={"http": good_proxies[0], "https": good_proxies[0]})
                          rext2 = ps.get(eu, headers={"Referer": BASE + "/"}, timeout=15)
                          if rext2.status_code == 200:
                              rext = rext2
                      open(f".tmp_wit/hosts/{safe_k}.html", "w", encoding="utf-8").write(rext.text[:250000])
                      ext_probes[safe_k] = {"input": eu, "final": rext.url, "status": rext.status_code, "ct": rext.headers.get("content-type", ""), "len": len(rext.text)}
                  except Exception as e:
                      ext_probes[safe_k] = {"input": eu, "err": str(e)}
          report["ext_probes"] = ext_probes

          with open(".tmp_wit/report.json", "w", encoding="utf-8") as fh:
              json.dump(report, fh, ensure_ascii=False, indent=2)
          print("DONE! Probed hosts:", list(ext_probes.keys()), flush=True)
          PY

      - name: Commit inspection dump
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A .tmp_wit
          git commit -m "chore: save WitAnime sources & hosts dump [skip ci]" || true
          git pull --rebase origin arena/74b8c0fa-mehdigm-stream || true
          git push origin arena/74b8c0fa-mehdigm-stream || true
