name: Temp Inspect WitAnime

on:
  push:
    branches:
      - arena/74b8c0fa-mehdigm-stream

permissions:
  contents: write

jobs:
  inspect:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Dump Dotplay via proxy
        run: |
          pip install -q "curl_cffi"
          python3 -u - <<'PY' > .tmp_wit/dotplay.log 2>&1
          import random, re
          from curl_cffi import requests as creq

          vs = creq.Session(impersonate="chrome124")
          cands = []
          for fu in [
              "https://raw.githubusercontent.com/TheSpeedX/SOCKS-List/master/socks5.txt",
              "https://raw.githubusercontent.com/monosans/proxy-list/main/proxies/socks5.txt",
          ]:
              try:
                  for ln in vs.get(fu, timeout=8).text.splitlines():
                      if re.match(r"^\d+\.\d+\.\d+\.\d+:\d+$", ln.strip()):
                          cands.append("socks5h://" + ln.strip())
              except Exception:
                  pass
          random.shuffle(cands)

          for px in cands[:90]:
              try:
                  ps = creq.Session(impersonate="chrome124", proxies={"http": px, "https": px})
                  rd = ps.get("https://dotplay.net/embed/b15b9b7ce5fc55b2eef9a6242db9106f", headers={"Referer": "https://mid.yonaplay.net/", "Sec-Fetch-Dest": "iframe", "Sec-Fetch-Mode": "navigate", "Sec-Fetch-Site": "cross-site"}, timeout=8)
                  if rd.status_code == 200 and "just a moment" not in rd.text[:2500].lower() and "Page Not Found" not in rd.text[:2500]:
                      print("Dotplay 200 via proxy! len=", len(rd.text))
                      print(rd.text[:8000])
                      for m in re.finditer(r'src=["\']([^"\']+\.js[^"\']*)["\']', rd.text):
                          jsu = m.group(1)
                          if not jsu.startswith("http"):
                              jsu = "https://dotplay.net/" + jsu.lstrip("/")
                          if "dotplay" in jsu or "/assets/" in jsu:
                              rjs = ps.get(jsu, headers={"Referer": rd.url}, timeout=8)
                              print(f"=== JS {jsu} ({rjs.status_code}, len={len(rjs.text)}) ===")
                              print(rjs.text[:10000])
                      break
              except Exception:
                  pass
          PY

      - name: Commit inspection dump
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A .tmp_wit
          git commit -m "chore: save dotplay proxy dump [skip ci]" || true
          git pull --rebase origin arena/74b8c0fa-mehdigm-stream || true
          git push origin arena/74b8c0fa-mehdigm-stream || true
