name: Temp Inspect WitAnime

on:
  push:
    branches:
      - arena/74b8c0fa-mehdigm-stream

permissions:
  contents: write

jobs:
  inspect:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Dump Dotplay HTML/JS with Referer mid.yonaplay.net
        run: |
          pip install -q "curl_cffi"
          python3 -u - <<'PY' > .tmp_wit/dotplay.log 2>&1
          import re
          from curl_cffi import requests as creq

          vs = creq.Session(impersonate="chrome124")
          rd = vs.get("https://dotplay.net/embed/b15b9b7ce5fc55b2eef9a6242db9106f", headers={"Referer": "https://mid.yonaplay.net/", "Sec-Fetch-Dest": "iframe", "Sec-Fetch-Mode": "navigate", "Sec-Fetch-Site": "cross-site"}, timeout=12)
          print("Dotplay direct:", rd.status_code, rd.url, len(rd.text))
          print(rd.text[:6000])
          for m in re.finditer(r'src=["\']([^"\']+\.js[^"\']*)["\']', rd.text):
              jsu = m.group(1)
              if not jsu.startswith("http"):
                  jsu = "https://dotplay.net/" + jsu.lstrip("/")
              if "dotplay" in jsu:
                  rjs = vs.get(jsu, headers={"Referer": rd.url}, timeout=10)
                  print(f"=== JS {jsu} ({rjs.status_code}, len={len(rjs.text)}) ===")
                  print(rjs.text[:8000])
          PY

      - name: Commit inspection dump
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A .tmp_wit
          git commit -m "chore: save dotplay dump [skip ci]" || true
          git pull --rebase origin arena/74b8c0fa-mehdigm-stream || true
          git push origin arena/74b8c0fa-mehdigm-stream || true
