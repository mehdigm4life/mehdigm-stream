name: Temp Inspect WitAnime

on:
  push:
    branches:
      - arena/74b8c0fa-mehdigm-stream

permissions:
  contents: write

jobs:
  inspect:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Final Verify Videas + WorkUpload + GoFile + MediaFire + YonaPlay
        run: |
          pip install -q "curl_cffi" beautifulsoup4
          python3 -u - <<'PY' > .tmp_wit/probe4.log 2>&1
          import base64, concurrent.futures, hashlib, json, random, re, struct, uuid
          from bs4 import BeautifulSoup
          from curl_cffi import requests as creq

          BASE = "https://witanime.site"
          vs = creq.Session(impersonate="chrome124")

          # 1. Verify Videas 2-step API!
          rvp = vs.get("https://app.videas.com/embed/01a169f7-c949-72e2-9f8b-4b83609cd57e/", headers={"Referer": BASE + "/"}, timeout=12)
          cfg = json.loads(re.search(r'<script id="videas-embed-config"[^>]*>([\s\S]*?)</script>', rvp.text).group(1))
          vid = str(uuid.uuid4())
          r_emb = vs.get(
              f"https://app.videas.com/api/visitor/embed/{cfg['embedId']}/?viewer_id={vid}",
              headers={"Accept": "application/json", "X-Embed-Opening": cfg["opening"], "Referer": "https://app.videas.com/embed/" + cfg["embedId"] + "/"},
              timeout=12,
          )
          print("Videas step1:", r_emb.status_code, r_emb.text[:500])
          ej = r_emb.json()
          aid = ej["items"][0]["asset"]["uid"]
          r_pb = vs.post(
              "https://app.videas.com/api/visitor/playback/info/",
              json={"asset_id": aid, "playback_token": ej["playback_token"], "session_id": ej.get("session_id")},
              headers={"Accept": "application/json", "Referer": "https://app.videas.com/embed/" + cfg["embedId"] + "/"},
              timeout=12,
          )
          print("Videas step2:", r_pb.status_code, r_pb.text[:800])
          pbj = r_pb.json()
          hls_u = (pbj.get("hls_url") or {}).get("url", "")
          if hls_u:
              rhls = vs.get(hls_u, headers={"Referer": "https://app.videas.com/"}, timeout=12)
              print("Videas HLS:", rhls.status_code, rhls.text[:400])

          # 2. Check MediaFire direct link + first 128 bytes!
          mf_html = open(".tmp_wit/hosts/dl_mediafire.html", encoding="utf-8").read()
          m_scr = re.search(r'data-scrambled-url="([^"]+)"', mf_html)
          mf_direct = base64.b64decode(m_scr.group(1)).decode() if m_scr else (re.search(r'https?://download\d*\.mediafire\.com/[^"\'\s<>]+', mf_html).group(0))
          print("MediaFire direct:", mf_direct)
          rmf = vs.get(mf_direct, headers={"Range": "bytes=0-127"}, timeout=12)
          b_mf = rmf.content
          print("MediaFire status:", rmf.status_code, "CR:", rmf.headers.get("content-range"), "head:", b_mf[:64])
          if b_mf[:4] == b"PK\x03\x04":
              ver, flags, comp, mtime, mdate, crc, csize, usize, fnlen, exlen = struct.unpack("<HHHHHIIIHH", b_mf[4:30])
              fname = b_mf[30:30+fnlen]
              data_off = 30 + fnlen + exlen
              print(f"  ZIP! comp={comp} (0=STORE, 8=DEFLATE) csize={csize} usize={usize} fname={fname} data_off={data_off} inner_magic={b_mf[data_off:data_off+24]}")

          # 3. Check GoFile direct link + first 128 bytes!
          r_acc = vs.post("https://api.gofile.io/accounts", timeout=10).json()
          gf_tok = r_acc["data"]["token"]
          gcfg = vs.get("https://gofile.io/dist/js/config.js", timeout=10).text
          wt = re.search(r'appdata\.wt\s*=\s*["\']([^"\']+)["\']', gcfg)
          wt_val = wt.group(1) if wt else "4fd6sg89d7s6"
          rgf = vs.get(f"https://api.gofile.io/contents/BzonTbGE?wt={wt_val}", headers={"Authorization": f"Bearer {gf_tok}"}, timeout=12).json()
          print("GoFile API:", json.dumps(rgf)[:500])
          for cid, ch in (rgf.get("data", {}).get("children") or {}).items():
              glink = ch.get("link", "")
              print("GoFile file:", ch.get("name"), glink)
              rgfb = vs.get(glink, headers={"Cookie": f"accountToken={gf_tok}", "Referer": "https://gofile.io/", "Range": "bytes=0-127"}, timeout=12)
              print("  GoFile bytes:", rgfb.status_code, rgfb.headers.get("content-range"), rgfb.content[:48])

          # 4. Check WorkUpload SHA-256 PoW + download API + first 128 bytes!
          wus = creq.Session(impersonate="chrome124")
          rw0 = wus.get("https://workupload.com/file/fpY5D2qyqhV", timeout=12)
          if "solvePuzzle" in rw0.text:
              rpuz = wus.get("https://workupload.com/puzzle", headers={"Accept": "application/json", "X-Requested-With": "XMLHttpRequest", "Referer": "https://workupload.com/file/fpY5D2qyqhV"}, timeout=10).json()
              print("WorkUpload puzzle:", rpuz)
              puz_str = rpuz["data"]["puzzle"]
              find_set = set(rpuz["data"]["find"])
              rng = rpuz["data"]["range"]
              sols = []
              for i in range(rng):
                  h = hashlib.sha256((puz_str + str(i)).encode()).hexdigest()
                  if h in find_set:
                      sols.append(str(i))
                      if len(sols) == len(find_set):
                          break
              cap_val = " ".join(sols) + " "
              rcap = wus.post("https://workupload.com/captcha", data={"captcha": cap_val}, headers={"X-Requested-With": "XMLHttpRequest", "Referer": "https://workupload.com/file/fpY5D2qyqhV"}, timeout=10)
              print("WorkUpload captcha:", rcap.status_code, rcap.text[:200])
              rw1 = wus.get("https://workupload.com/file/fpY5D2qyqhV", timeout=12)
              print("WorkUpload after captcha len:", len(rw1.text))
              for m in re.finditer(r'(/api/file/[^"\'\s<>]+|start/fpY5D2qyqhV|getDownloadServer[^"\'\s<>]*)', rw1.text):
                  print("  wu match:", m.group(0))
              rstart = wus.get("https://workupload.com/start/fpY5D2qyqhV", headers={"Referer": "https://workupload.com/file/fpY5D2qyqhV"}, timeout=12)
              rapi = wus.get("https://workupload.com/api/file/getDownloadServer/fpY5D2qyqhV", headers={"X-Requested-With": "XMLHttpRequest", "Referer": "https://workupload.com/start/fpY5D2qyqhV"}, timeout=12)
              print("WorkUpload getDownloadServer:", rapi.status_code, rapi.text[:300])
              if rapi.status_code == 200 and rapi.text.strip().startswith("{"):
                  wu_dl = rapi.json().get("data", {}).get("url", "")
                  if wu_dl:
                      rwub = wus.get(wu_dl, headers={"Range": "bytes=0-127"}, timeout=12)
                      print("  WorkUpload bytes:", rwub.status_code, rwub.headers.get("content-range"), rwub.content[:48])

          # 5. Check mid.yonaplay.net via non-CF proxy!
          feeds = [
              ("socks5h", "https://raw.githubusercontent.com/TheSpeedX/SOCKS-List/master/socks5.txt"),
              ("socks5h", "https://raw.githubusercontent.com/monosans/proxy-list/main/proxies/socks5.txt"),
          ]
          cands = []
          for sch, fu in feeds:
              try:
                  for ln in vs.get(fu, timeout=8).text.splitlines():
                      if re.match(r"^\d+\.\d+\.\d+\.\d+:\d+$", ln.strip()):
                          cands.append(f"{sch}://{ln.strip()}")
              except Exception:
                  pass
          random.shuffle(cands)
          for px in cands[:60]:
              try:
                  ps = creq.Session(impersonate="chrome124", proxies={"http": px, "https": px})
                  ry = ps.get("https://mid.yonaplay.net/embed/7b80c24b3fb699b0/", headers={"Referer": BASE + "/"}, timeout=8)
                  if ry.status_code == 200 and "just a moment" not in ry.text[:3000].lower():
                      print("YonaPlay 200 via proxy! len=", len(ry.text))
                      print(ry.text[:2500])
                      break
              except Exception:
                  pass
          PY

      - name: Commit inspection dump
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A .tmp_wit
          git commit -m "chore: save probe4 [skip ci]" || true
          git pull --rebase origin arena/74b8c0fa-mehdigm-stream || true
          git push origin arena/74b8c0fa-mehdigm-stream || true
