name: Verify AnimeDay E2E

on:
  push:
    branches:
      - 'arena/d5505930-mehdigm-stream'

permissions:
  contents: write

jobs:
  verify:
    if: "!contains(github.event.head_commit.message, '[skip ci]') && !contains(github.event.head_commit.message, '🤖')"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build AnimeDay & CimaCloud with full warning check
        run: |
          chmod +x gradlew
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          ./gradlew :AnimeDay:clean :AnimeDay:compileDebugKotlin :AnimeDay:make :CimaCloud:make --no-daemon --warning-mode=all 2>&1 | tee animeday_gradle.log
          mkdir -p build
          cp -f AnimeDay/build/AnimeDay.cs3 build/AnimeDay.cs3
          cp -f CimaCloud/build/CimaCloud.cs3 build/CimaCloud.cs3
          unzip -l build/AnimeDay.cs3 >> animeday_gradle.log

      - name: Run Live AnimeDay API & Extractor E2E Suite
        run: |
          node scripts_verify_animeday.mjs 2>&1 | tee -a animeday_gradle.log

      - name: Sync plugins.json fileSize and push report
        run: |
          python3 - <<'PY'
          import os, re
          with open("plugins.json", "r", encoding="utf-8") as fh:
              txt = fh.read()
          new_txt = txt
          for mod in ("CimaCloud", "AnimeDay"):
              p = f"build/{mod}.cs3"
              if not os.path.exists(p):
                  continue
              sz = os.path.getsize(p)
              def repl(m, mod=mod, sz=sz):
                  blk = m.group(0)
                  if f'"internalName": "{mod}"' not in blk:
                      return blk
                  return re.sub(r'("fileSize"\s*:\s*)\d+', rf'\g<1>{sz}', blk, count=1)
              new_txt = re.sub(rf'\{{[^{{}}]*"internalName"\s*:\s*"{mod}"[^{{}}]*\}}', repl, new_txt, flags=re.S)
          with open("plugins.json", "w", encoding="utf-8") as fh:
              fh.write(new_txt)
          PY
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git pull --rebase origin "$GITHUB_REF_NAME" || true
          git add -f build/AnimeDay.cs3 build/CimaCloud.cs3 plugins.json animeday_e2e_report.json animeday_gradle.log
          if ! git diff --cached --quiet; then
            git commit -m "🤖 Verify AnimeDay v29 build & E2E [skip ci]"
            git pull --rebase origin "$GITHUB_REF_NAME" || true
            git push
          fi
