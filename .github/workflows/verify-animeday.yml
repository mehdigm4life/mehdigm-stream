name: Verify AnimeDay E2E

on:
  push:
    branches:
      - 'arena/d5505930-mehdigm-stream'

permissions:
  contents: write

jobs:
  verify:
    if: "!contains(github.event.head_commit.message, '[skip ci]') && !contains(github.event.head_commit.message, 'Build plugins')"
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Build AnimeDay & CimaCloud with full warning check
        run: |
          chmod +x gradlew
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          ./gradlew :AnimeDay:clean :AnimeDay:compileDebugKotlin :AnimeDay:make :CimaCloud:make --no-daemon --warning-mode=all > animeday_gradle.log 2>&1
          mkdir -p build
          cp -f AnimeDay/build/AnimeDay.cs3 build/AnimeDay.cs3
          cp -f CimaCloud/build/CimaCloud.cs3 build/CimaCloud.cs3
          unzip -l build/AnimeDay.cs3 >> animeday_gradle.log

      - name: Run Live AnimeDay API & Extractor E2E Suite
        run: |
          node scripts_verify_animeday.mjs >> animeday_gradle.log 2>&1

      - name: Sync plugins.json fileSize and push report
        if: always()
        run: |
          python3 - <<'PY'
          import json, os, re
          for mod in ("CimaCloud", "AnimeDay"):
              p = f"build/{mod}.cs3"
              if os.path.exists(p):
                  print(f"::notice title={mod}.cs3::size={os.path.getsize(p)}")
          with open("plugins.json", "r", encoding="utf-8") as fh:
              txt = fh.read()
          new_txt = txt
          for mod in ("CimaCloud", "AnimeDay"):
              p = f"build/{mod}.cs3"
              if not os.path.exists(p):
                  continue
              sz = os.path.getsize(p)
              def repl(m, mod=mod, sz=sz):
                  blk = m.group(0)
                  if f'"internalName": "{mod}"' not in blk:
                      return blk
                  return re.sub(r'("fileSize"\s*:\s*)\d+', rf'\g<1>{sz}', blk, count=1)
              new_txt = re.sub(rf'\{{[^{{}}]*"internalName"\s*:\s*"{mod}"[^{{}}]*\}}', repl, new_txt, flags=re.S)
          with open("plugins.json", "w", encoding="utf-8") as fh:
              fh.write(new_txt)
          if os.path.exists("animeday_e2e_report.json"):
              with open("animeday_e2e_report.json", "r", encoding="utf-8") as rf:
                  rep = json.load(rf)
              compact = json.dumps({
                  "catalog": rep.get("catalog"),
                  "search": {k: v.get("count") for k, v in (rep.get("search") or {}).items()},
                  "hosts": rep.get("hostHistogram"),
                  "titles": [
                      {
                          "id": t.get("id"),
                          "name": t.get("name"),
                          "detailOk": t.get("detailOk"),
                          "eps": t.get("totalEpisodes"),
                          "srv": t.get("serverCount"),
                          "probed": [
                              {"h": p.get("host"), "s": p.get("status"), "q": p.get("qualities"), "f": p.get("flags")}
                              for p in (t.get("probedServers") or [])
                          ],
                      }
                      for t in (rep.get("titles") or [])
                  ],
              }, ensure_ascii=False)
              for idx in range(0, len(compact), 3500):
                  chunk = compact[idx:idx+3500].replace("%", "%25").replace("\n", "%0A").replace("\r", "")
                  print(f"::notice title=e2e_{idx//3500}::{chunk}")
          PY
          set +e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin "${GITHUB_REF_NAME}" > git_push.log 2>&1
          git reset --soft "origin/${GITHUB_REF_NAME}" >> git_push.log 2>&1
          git add -f build/AnimeDay.cs3 build/CimaCloud.cs3 plugins.json animeday_e2e_report.json animeday_gradle.log >> git_push.log 2>&1
          git commit -m "chore: animeday v29 build + live e2e results [skip ci]" >> git_push.log 2>&1
          git push origin "HEAD:${GITHUB_REF_NAME}" >> git_push.log 2>&1
          rc=$?
          if [ $rc -ne 0 ]; then
            msg=$(tr '\n\r' '  ' < git_push.log)
            echo "::warning title=git_push_rc_${rc}::${msg}"
          fi
          exit 0
