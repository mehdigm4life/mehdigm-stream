name: Professional Web Scraper & Cloner

permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: 'أدخل رابط الموقع المستهدف (e.g., https://example.com)'
        required: true
        type: string
      scrape_mode:
        description: 'وضع السحب'
        required: true
        type: choice
        options:
          - 'Single Page (صفحة واحدة فقط)'
          - 'Full Website (الموقع بالكامل)'
        default: 'Single Page (صفحة واحدة فقط)'
      max_pages:
        description: 'حد أقصى للصفحات (0 = غير محدود)'
        required: true
        type: number
        default: 0

jobs:
  scrape_and_commit:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        persist-credentials: true

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install beautifulsoup4 cloudscraper lxml playwright httpx brotli
        python -m playwright install chromium
        python -m playwright install-deps chromium

    - name: Run Legendary Scraper
      env:
        TARGET_URL: ${{ github.event.inputs.target_url }}
        SCRAPE_MODE: ${{ github.event.inputs.scrape_mode }}
        MAX_PAGES: ${{ github.event.inputs.max_pages }}
      run: |
        python3 - << 'PYEOF'
        import asyncio, os, sys, time, random, re, json
        from urllib.parse import urlparse, urljoin, urlunparse
        from pathlib import Path
        from bs4 import BeautifulSoup
        import cloudscraper
        import brotli
        from playwright.async_api import async_playwright

        TARGET_URL = os.environ["TARGET_URL"].strip()
        SCRAPE_MODE = os.environ.get("SCRAPE_MODE", "")
        MAX_PAGES = int(os.environ.get("MAX_PAGES", "0")) or 999999

        parsed = urlparse(TARGET_URL)
        BASE_DOMAIN = parsed.netloc
        if not BASE_DOMAIN:
            print("خطأ: رابط غير صحيح"); sys.exit(1)

        OUTPUT_DIR = Path("scraped_sites") / BASE_DOMAIN
        OUTPUT_DIR.mkdir(parents=True, exist_ok=True)

        USER_AGENTS = [
            "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/125.0.0.0 Safari/537.36",
            "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36",
            "Mozilla/5.0 (Macintosh; Intel Mac OS X 14_5) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/125.0.0.0 Safari/537.36",
            "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/125.0.0.0 Safari/537.36",
            "Mozilla/5.0 (Windows NT 10.0; Win64; x64; rv:127.0) Gecko/20100101 Firefox/127.0",
        ]

        tracked_domains = {BASE_DOMAIN}

        def is_valid_html(text: str) -> bool:
            return bool(re.search(r'<!DOCTYPE html|<html[\s>]|<head[\s>]|<body[\s>]', text[:2000], re.I))

        def is_binary(text: str) -> bool:
            if not text: return True
            nulls = sum(1 for c in text[:2000] if ord(c) == 0)
            return nulls > 50

        def is_cf_challenge(text: str) -> bool:
            return bool(re.search(r'Just a moment|checking your browser|cf-browser-verification|challenges\.cloudflare\.com', text, re.I))

        def make_cloudscraper():
            ua = random.choice(USER_AGENTS)
            sess = cloudscraper.create_scraper(
                browser={"browser": "chrome", "platform": "windows", "desktop": True},
                delay=random.randint(1, 5),
            )
            sess.headers.update({
                "User-Agent": ua,
                "Accept": "text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8",
                "Accept-Language": "ar,en;q=0.9",
                "Accept-Encoding": "gzip, deflate, br",
                "Upgrade-Insecure-Requests": "1",
            })
            return sess

        def try_cloudscraper(scraper, url: str, retries: int = 3):
            for attempt in range(retries):
                try:
                    scraper.headers.update({"User-Agent": random.choice(USER_AGENTS)})
                    time.sleep(random.uniform(2.0, 5.0))
                    resp = scraper.get(url, timeout=45, allow_redirects=True)
                    final_url = resp.url

                    raw = resp.content
                    content_type = resp.headers.get('Content-Type', '').lower()

                    text = raw.decode("utf-8", errors="replace")

                    if raw[:1] == b"\x0b" and is_binary(text):
                        try:
                            raw = brotli.decompress(raw)
                            text = raw.decode("utf-8", errors="replace")
                            print(f"  ✅ فك Brotli (تلقائي - magic byte)")
                        except Exception:
                            pass

                    if resp.status_code == 403 and is_cf_challenge(text):
                        print(f"  ⚠️ Cloudflare تعطيل (محاولة {attempt+1}/{retries})")
                        time.sleep(3 * (attempt + 1))
                        continue
                    if resp.status_code == 429:
                        wait = 10 * (attempt + 1)
                        print(f"  ⚠️ 429 Rate limited, انتظار {wait}ث")
                        time.sleep(wait)
                        continue

                    if resp.status_code == 200:
                        if not ('text/html' in content_type or 'application/xhtml+xml' in content_type):
                            print(f"  ⚠️ نوع المحتوى ليس HTML: {content_type}")
                        if is_binary(text):
                            print(f"  ❌ محتوى ثنائي غير صالح - تخطي")
                            return (None, None, None, None)
                        return (resp.status_code, text, dict(resp.headers), final_url)
                    if resp.status_code == 404:
                        return (404, text, dict(resp.headers), final_url)

                    print(f"  ⚠️ HTTP {resp.status_code} (محاولة {attempt+1})")
                except Exception as e:
                    print(f"  ❌ خطأ: {e} (محاولة {attempt+1})")
                    time.sleep(3 * (attempt + 1))
            return (None, None, None, None)

        async def try_playwright(url: str, retries: int = 3):
            for attempt in range(retries):
                browser = None
                try:
                    p = await async_playwright().start()
                    ua = random.choice(USER_AGENTS)
                    browser = await p.chromium.launch(
                        headless=True,
                        args=[
                            "--disable-blink-features=AutomationControlled",
                            "--no-sandbox", "--disable-dev-shm-usage", "--disable-gpu",
                            "--disable-web-security", "--disable-features=IsolateOrigins,site-per-process",
                        ],
                    )
                    ctx = await browser.new_context(
                        user_agent=ua,
                        viewport={"width": 1920, "height": 1080},
                        locale="ar", timezone_id="Asia/Riyadh",
                        device_scale_factor=1,
                        java_script_enabled=True, ignore_https_errors=True,
                        extra_http_headers={
                            "Accept-Language": "ar,en;q=0.9",
                            "Accept": "text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8",
                            "Sec-Fetch-Dest": "document",
                            "Sec-Fetch-Mode": "navigate",
                            "Sec-Fetch-Site": "none",
                        },
                    )
                    await ctx.add_init_script("""
                        Object.defineProperty(navigator, 'webdriver', {get: () => undefined});
                        Object.defineProperty(navigator, 'plugins', {get: () => [1,2,3,4,5]});
                        Object.defineProperty(navigator, 'languages', {get: () => ['ar','en']});
                        Object.defineProperty(navigator, 'hardwareConcurrency', {get: () => 8});
                        window.chrome = {runtime: {}};
                        delete navigator.__proto__.webdriver;
                        // Cloudflare evasion: override permission
                        const origQuery = window.navigator.permissions.query;
                        window.navigator.permissions.query = (params) => (
                            params.name === 'notifications' ? Promise.resolve({state: 'denied'}) : origQuery(params)
                        );
                    """)
                    page = await ctx.new_page()
                    page.set_default_timeout(90000)

                    print(f"  🚀 Playwright → {url}")
                    await page.goto(url, wait_until="domcontentloaded", timeout=90000)

                    # انتظار أطول لتجاوز Cloudflare
                    wait_time = 0
                    while wait_time < 30:
                        title = await page.title()
                        html_preview = await page.evaluate("document.body?.innerText?.substring(0,200) || ''")
                        if not is_cf_challenge(title + " " + html_preview):
                            break
                        await asyncio.sleep(2)
                        wait_time += 2
                        if wait_time % 10 == 0:
                            print(f"  ⏳ انتظار Cloudflare... {wait_time}ث")

                    # انتظار إضافي لتحميل JS
                    await asyncio.sleep(2)

                    html = await page.content()
                    final_url = page.url
                    cookies = await ctx.cookies()

                    await browser.close()
                    await p.stop()

                    if is_cf_challenge(html):
                        print(f"  ⚠️ Playwright فشل في تخطي Cloudflare (محاولة {attempt+1}/{retries})")
                        await asyncio.sleep(5 * (attempt + 1))
                        continue

                    return (200, html, final_url, cookies)

                except Exception as e:
                    print(f"  ❌ Playwright خطأ: {e}")
                    if browser:
                        try: await browser.close()
                        except Exception: pass
                    try: await p.stop()
                    except Exception: pass
                    await asyncio.sleep(5 * (attempt + 1))

            return (None, None, None, None)

        visited = set()
        queue = []
        cs = make_cloudscraper()
        pages_fetched = 0
        pages_pw = 0

        def clean_url(url: str) -> str:
            u = urlparse(url)
            return urlunparse((u.scheme, u.netloc, u.path.rstrip("/") or "/", "", "", ""))

        def is_same_site(url: str) -> bool:
            host = urlparse(url).netloc
            return any(host == d or host.endswith('.' + d) or d.endswith('.' + host) for d in tracked_domains)

        async def fetch_page(url: str):
            global pages_fetched, pages_pw

            url = clean_url(url)
            if url in visited: return
            visited.add(url)

            parsed_url = urlparse(url)
            if not is_same_site(url):
                print(f"  ⏭️ خارج النطاق: {parsed_url.netloc}")
                return

            print(f"\n📥 [{pages_fetched+1}] {url}")

            target_domain = parsed_url.netloc
            tracked_domains.add(target_domain)

            status, html_text, headers, final_url_cs = try_cloudscraper(cs, url)
            used_pw = False
            cookies = []
            final_url = final_url_cs or url

            if final_url_cs:
                redirect_domain = urlparse(final_url_cs).netloc
                if redirect_domain and redirect_domain != target_domain:
                    tracked_domains.add(redirect_domain)
                    print(f"  🔀 تمت إعادة التوجيه → {redirect_domain} (تمت الإضافة للمتابعة)")

            if (status is None or status == 403) and (html_text is None or is_cf_challenge(html_text or "")):
                print(f"  🔄 تحويل إلى Playwright...")
                status, html_text, final_url, cookies = await try_playwright(url)
                used_pw = True
                if used_pw:
                    pages_pw += 1
                    if cookies:
                        for c in cookies:
                            cs.cookies.set(c["name"], c["value"], domain=c.get("domain", target_domain))

            if status != 200 or not html_text:
                print(f"  ❌ فشل بعد جميع المحاولات")
                return

            if is_binary(html_text):
                print(f"  ❌ محتوى ثنائي - تخطي الحفظ")
                return

            if not is_valid_html(html_text):
                print(f"  ⚠️ تحذير: المحتوى لا يشبه HTML (قد يكون JSON أو غيره)")
                if 'Full Website' not in SCRAPE_MODE:
                    return

            local_path = parsed_url.path
            if local_path.endswith("/") or not local_path:
                local_path = "index.html"
            else:
                ext = os.path.splitext(local_path)[1].lower()
                if ext not in (".html", ".htm", ".php", ".asp", ".aspx", ".jsp"):
                    local_path += ".html"
            file_path = OUTPUT_DIR / local_path.lstrip("/")
            file_path.parent.mkdir(parents=True, exist_ok=True)
            with open(file_path, "w", encoding="utf-8") as f:
                f.write(html_text)

            mode_str = "🎭 PW" if used_pw else "⚡ CS"
            print(f"  💾 {mode_str} → {file_path}  ({len(html_text)} حرف)")
            pages_fetched += 1

            if "Full Website" in SCRAPE_MODE and pages_fetched < MAX_PAGES:
                soup = BeautifulSoup(html_text, "lxml")
                for a in soup.find_all("a", href=True):
                    href = a["href"]
                    full = urljoin(final_url, href)
                    full = clean_url(full)
                    if is_same_site(full) and full not in visited and full not in queue:
                        if full.startswith("mailto:") or full.startswith("tel:") or full.startswith("javascript:"):
                            continue
                        queue.append(full)

        async def main():
            global pages_fetched
            queue.append(clean_url(TARGET_URL))

            while queue and pages_fetched < MAX_PAGES:
                batch = []
                while queue and len(batch) < 5:
                    u = queue.pop(0)
                    if u not in visited:
                        batch.append(u)

                for u in batch:
                    if pages_fetched >= MAX_PAGES: break
                    await fetch_page(u)
                    await asyncio.sleep(random.uniform(1.5, 4.0))

            print("\n" + "=" * 60)
            print(f"✅ تم بنجاح!")
            print(f"📄 الصفحات: {pages_fetched}")
            print(f"🎭 عبر Playwright: {pages_pw}")
            print(f"⚡ عبر Cloudscraper: {pages_fetched - pages_pw}")
            print("=" * 60)

        asyncio.run(main())
        PYEOF

    - name: Commit and Push Scraped Data
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"

        git add scraped_sites/

        if git diff --staged --quiet; then
          echo "No changes to commit"
        else
          git commit -m "🤖 Scraped content from ${{ github.event.inputs.target_url }}"
          git push origin HEAD:${{ github.ref }}
        fi
