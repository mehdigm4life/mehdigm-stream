name: Professional Web Scraper & Cloner

permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: 'أدخل رابط الموقع المستهدف (e.g., https://example.com)'
        required: true
        type: string
      scrape_mode:
        description: 'وضع السحب (اختر صفحة واحدة أو الموقع بالكامل)'
        required: true
        type: choice
        options:
          - 'Single Page (صفحة واحدة فقط)'
          - 'Full Website (الموقع بالكامل)'
        default: 'Single Page (صفحة واحدة فقط)'

jobs:
  scrape_and_commit:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        persist-credentials: true

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    # تثبيت الأدوات والمكتبات المتطورة لتخطي الحظر وحل شفرات التشفير الحديثة
    - name: Install Advanced Anti-Bot Bypass Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install beautifulsoup4 cloudscraper dynamic-yaml

    - name: Run Anti-Bot Scraper Script
      env:
        TARGET_URL: ${{ github.event.inputs.target_url }}
        SCRAPE_MODE: ${{ github.event.inputs.scrape_mode }}
      run: |
        python - << 'EOF'
        import os
        import sys
        import time
        import cloudscraper
        from bs4 import BeautifulSoup
        from urllib.parse import urlparse, urljoin

        target_url = os.environ.get("TARGET_URL").strip()
        scrape_mode = os.environ.get("SCRAPE_MODE")
        
        parsed_url = urlparse(target_url)
        domain = parsed_url.netloc
        if not domain:
            print("❌ الرابط غير صحيح")
            sys.exit(1)
            
        output_dir = os.path.join("scraped_sites", domain)
        os.makedirs(output_dir, exist_ok=True)
        
        # إنشاء مفسر وجامع كود متطور يحاكي متصفح متكامل (Chrome على ويندوز)
        # هذا المحرك يقوم بفك شفرات Cloudflare تلقائياً في الخلفية
        scraper = cloudscraper.create_scraper(
            browser={
                'browser': 'chrome',
                'platform': 'windows',
                'desktop': True
            }
        )

        visited_urls = set()

        def download_page(url):
            if url in visited_urls:
                return
            if urlparse(url).netloc != domain:
                return

            print(f"📥 [Anti-Bot Mode] جاري محاولة سحب: {url}")
            visited_urls.add(url)
            
            # تأخير ذكي عشوائي لتجنب كشف النمط التكراري
            time.sleep(2)
            
            try:
                response = scraper.get(url, timeout=30)
                
                if response.status_code == 403:
                    print(f"⚠️ خطأ 403: الحماية قوية جداً على هذا المسار المحدد.")
                    # طباعة جزء من المحتوى لمعاينته في الـ Logs وفهم الحظر
                    print(response.text[:500])
                    return
                elif response.status_code != 200:
                    print(f"⚠️ فشل تحميل الصفحة، رمز الحالة: {response.status_code}")
                    return
                
                local_path = urlparse(url).path
                if local_path.endswith('/') or not local_path:
                    local_path += "index.html"
                elif not os.path.splitext(local_path)[1]:
                    local_path += ".html"
                    
                file_path = os.path.join(output_dir, local_path.lstrip('/'))
                os.makedirs(os.path.dirname(file_path), exist_ok=True)
                
                with open(file_path, "w", encoding="utf-8") as f:
                    f.write(response.text)
                print(f"💾 تم بنجاح وتجاوز الحظر! الحفظ في: {file_path}")

                if "Full Website" in scrape_mode:
                    soup = BeautifulSoup(response.text, 'html.parser')
                    for anchor in soup.find_all('a', href=True):
                        href = anchor['href']
                        full_url = urljoin(url, href)
                        full_url = urlparse(full_url)._replace(fragment='', query='').geturl()
                        if domain in full_url:
                            download_page(full_url)
                            
            except Exception as e:
                print(f"❌ خطأ أثناء معالجة {url}: {e}")

        download_page(target_url)
        print("✅ انتهت العملية!")
        EOF

    - name: Commit and Push Scraped Data
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        
        git add scraped_sites/
        
        if git diff --staged --quiet; then
          echo "No changes to commit"
        else
          git commit -m "🤖 Auto Bypass: Scraped content from ${{ github.event.inputs.target_url }}"
          git push origin HEAD:${{ github.ref }}
        fi
