name: Professional Web Scraper & Cloner

permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: 'أدخل رابط الموقع المستهدف (e.g., https://example.com)'
        required: true
        type: string
      scrape_mode:
        description: 'وضع السحب (اختر صفحة واحدة أو الموقع بالكامل)'
        required: true
        type: choice
        options:
          - 'Single Page (صفحة واحدة فقط)'
          - 'Full Website (الموقع بالكامل)'
        default: 'Single Page (صفحة واحدة فقط)'

jobs:
  scrape_and_commit:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        persist-credentials: true

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests beautifulsoup4

    - name: Run Intelligent Scraper Script
      env:
        TARGET_URL: ${{ github.event.inputs.target_url }}
        SCRAPE_MODE: ${{ github.event.inputs.scrape_mode }}
      run: |
        python - << 'EOF'
        import os
        import sys
        import requests
        import time
        from bs4 import BeautifulSoup
        from urllib.parse import urlparse, urljoin

        target_url = os.environ.get("TARGET_URL").strip()
        scrape_mode = os.environ.get("SCRAPE_MODE")
        
        parsed_url = urlparse(target_url)
        domain = parsed_url.netloc
        if not domain:
            print("❌ الرابط غير صحيح")
            sys.exit(1)
            
        output_dir = os.path.join("scraped_sites", domain)
        os.makedirs(output_dir, exist_ok=True)
        
        # إنشاء جلسة للحفاظ على الكوكيز ومحاكاة متصفح Chrome حقيقي بدقة عالية
        session = requests.Session()
        session.headers.update({
            'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36',
            'Accept': 'text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,image/apng,*/*;q=0.8,application/signed-exchange;v=b3;q=0.7',
            'Accept-Language': 'en-US,en;q=0.9,ar;q=0.8',
            'Accept-Encoding': 'gzip, deflate, br',
            'Connection': 'keep-alive',
            'Upgrade-Insecure-Requests': '1',
            'Sec-Ch-Ua': '"Chromium";v="124", "Google Chrome";v="124", "Not-A.Brand";v="99"',
            'Sec-Ch-Ua-Mobile': '?0',
            'Sec-Ch-Ua-Platform': '"Windows"',
            'Sec-Fetch-Dest': 'document',
            'Sec-Fetch-Mode': 'navigate',
            'Sec-Fetch-Site': 'none',
            'Sec-Fetch-User': '?1'
        })

        visited_urls = set()

        def download_page(url):
            if url in visited_urls:
                return
            if urlparse(url).netloc != domain:
                return

            print(f"📥 جاري سحب: {url}")
            visited_urls.add(url)
            
            # إضافة تأخير زمني بسيط (1 إلى 2 ثانية) حتى لا تكتشف الحماية التدفق السريع
            time.sleep(1.5)
            
            try:
                # تحديث الـ Referer ديناميكياً ليبدو التنقل طبيعياً داخل الموقع
                session.headers.update({'Referer': target_url})
                
                response = session.get(url, timeout=20)
                
                if response.status_code == 403:
                    print(f"⚠️ فشل تحميل الصفحة، رمز الحالة: 403 (الموقع محمي بقفل قوي ضد الروبوتات)")
                    return
                elif response.status_code != 200:
                    print(f"⚠️ فشل تحميل الصفحة، رمز الحالة: {response.status_code}")
                    return
                
                local_path = urlparse(url).path
                if local_path.endswith('/') or not local_path:
                    local_path += "index.html"
                elif not os.path.splitext(local_path)[1]:
                    local_path += ".html"
                    
                file_path = os.path.join(output_dir, local_path.lstrip('/'))
                os.makedirs(os.path.dirname(file_path), exist_ok=True)
                
                with open(file_path, "w", encoding="utf-8") as f:
                    f.write(response.text)
                print(f"💾 تم الحفظ في: {file_path}")

                if "Full Website" in scrape_mode:
                    soup = BeautifulSoup(response.text, 'html.parser')
                    for anchor in soup.find_all('a', href=True):
                        href = anchor['href']
                        full_url = urljoin(url, href)
                        full_url = urlparse(full_url)._replace(fragment='', query='').geturl()
                        if domain in full_url:
                            download_page(full_url)
                            
            except Exception as e:
                print(f"❌ خطأ أثناء معالجة {url}: {e}")

        download_page(target_url)
        print("✅ انتهت عملية السحب بنجاح!")
        EOF

    - name: Commit and Push Scraped Data
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        
        git add scraped_sites/
        
        if git diff --staged --quiet; then
          echo "No changes to commit"
        else
          git commit -m "🤖 Auto: Scraped content from ${{ github.event.inputs.target_url }}"
          git push origin HEAD:${{ github.ref }}
        fi
