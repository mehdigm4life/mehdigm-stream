name: 🤖 OpenCode AI Cloud — Memory Vault (Secure Login)

# 📦 نسخة مطوّرة (clone) من opencode.yml مع:
#  1) 🔐 خزنة ذاكرة دائمة ومشفّرة: جميع المحادثات والذاكرة تُحفظ في
#     .opencode-vault/vault.bin داخل الـ repo (مشفّر AES-256 بـ Secrets)
#     فلا يمكن قراءة أي شيء حتى لو نُشر الملف. تُستعاد تلقائياً عند كل تشغيل.
#  2) 👤 صفحة تسجيل دخول (username + password عبر HTTP Basic Auth)
#     متفعلة بشكل أصلي داخل سيرفر opencode من Secrets الـ repo.
#  3) ♻️ حتى لو عطّلت الـ workflow ثم شغّلته من جديد، تجد كل المحادثات
#     والذاكرة والـ conversations محفوظة بالكامل.
# المسار المطلوب: .github/workflows/opencode-memory.yml

on:
  workflow_dispatch:
    inputs:
      duration_minutes:
        description: "كم دقيقة يبقى السيرفر شغّال (الحد الأقصى لـ GitHub Actions = 350 دقيقة ≈ 6 ساعات)"
        required: true
        default: "350"
        type: string
      auto_commit:
        description: "هل تريد commit + push تلقائي لأي تعديلات يقوم بها opencode على الملفات؟"
        required: true
        default: true
        type: boolean
      commit_interval_seconds:
        description: "كل كم ثانية يتم فحص التغييرات وعمل commit (افتراضي 60 ثانية)"
        required: true
        default: "60"
        type: string
      enable_vault:
        description: "تفعيل حفظ الذاكرة المشفّرة (vault)؟ موصى به: true"
        required: false
        default: true
        type: boolean

# نحتاج صلاحية الكتابة على المحتوى لعمل push
permissions:
  contents: write

jobs:
  opencode-web:
    name: 🚀 Run OpenCode Web + Cloudflare Tunnel
    runs-on: ubuntu-latest
    # الحد الأقصى لـ job في GitHub Actions = 360 دقيقة
    timeout-minutes: 355

    env:
      # ===== 🔐 خزنة الذاكرة + تسجيل الدخول (كلها من Secrets الـ repo) =====
      OPENCODE_VAULT_KEY:     ${{ secrets.OPENCODE_VAULT_KEY }}
      OPENCODE_WEB_USERNAME:  ${{ secrets.OPENCODE_WEB_USERNAME }}
      OPENCODE_WEB_PASSWORD:  ${{ secrets.OPENCODE_WEB_PASSWORD }}
      # ===== مزودات النماذج الشائعة (كلها اختيارية) =====
      OPENCODE_API_KEY:    ${{ secrets.OPENCODE_API_KEY }}
      ANTHROPIC_API_KEY:   ${{ secrets.ANTHROPIC_API_KEY }}
      OPENAI_API_KEY:      ${{ secrets.OPENAI_API_KEY }}
      GEMINI_API_KEY:      ${{ secrets.GEMINI_API_KEY }}
      GOOGLE_GENERATIVE_AI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      OPENROUTER_API_KEY:  ${{ secrets.OPENROUTER_API_KEY }}
      GROQ_API_KEY:        ${{ secrets.GROQ_API_KEY }}
      DEEPSEEK_API_KEY:    ${{ secrets.DEEPSEEK_API_KEY }}
      MISTRAL_API_KEY:     ${{ secrets.MISTRAL_API_KEY }}
      XAI_API_KEY:         ${{ secrets.XAI_API_KEY }}
      COHERE_API_KEY:      ${{ secrets.COHERE_API_KEY }}
      TOGETHER_API_KEY:    ${{ secrets.TOGETHER_API_KEY }}
      PERPLEXITY_API_KEY:  ${{ secrets.PERPLEXITY_API_KEY }}

    steps:
      # -----------------------------------------------------------------------
      # 1) جلب كود الـ repository الحالي
      # -----------------------------------------------------------------------
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      # -----------------------------------------------------------------------
      # 1.5) 🔐 خزنة الذاكرة المشفّرة — استعادة كل المحادثات والذاكرة
      # -----------------------------------------------------------------------
      - name: 🔐 Restore encrypted memory vault
        if: ${{ github.event.inputs.enable_vault == 'true' }}
        run: |
          set -euo pipefail

          # ⭐ ملف شامل بعمليات الخزنة (يُستدعى من خطوات لاحقة)
          cat > "$RUNNER_TEMP/vault.sh" <<'VAULTSH'
          #!/usr/bin/env bash
          VAULT_KEY="${OPENCODE_VAULT_KEY:-}"
          VAULT_DIR="${GITHUB_WORKSPACE}/.opencode-vault"
          VAULT_FILE="${VAULT_DIR}/vault.bin"
          DATA_HOME="${XDG_DATA_HOME}"
          CONF_HOME="${XDG_CONFIG_HOME}"

          # استعادة البيانات المشفّرة (إن وجدت) إلى بيئة التشغيل
          vault_restore() {
            mkdir -p "$DATA_HOME" "$CONF_HOME"
            if [ -z "$VAULT_KEY" ]; then
              echo "⚠️  OPENCODE_VAULT_KEY غير مضبوط — الذاكرة لن تُشفّر!"
            elif [ -f "$VAULT_FILE" ]; then
              if ( openssl enc -d -aes-256-cbc -pbkdf2 -iter 100000 -pass pass:"$VAULT_KEY" -in "$VAULT_FILE" 2>/dev/null \
                   | tar -xzf - -C "${RUNNER_TEMP}" 2>/dev/null ); then
                echo "🔓 تمت استعادة كل المحادثات والذاكرة من الخزنة."
              else
                echo "⚠️  فشل فك تشفير الخزنة — بدء ذاكرة جديدة فارغة."
              fi
            else
              echo "🆕 لا توجد خزنة بعد → سيتم إنشاء ملف تخزين مشفّر تلقائياً عند أول حفظ."
            fi
            mkdir -p "$DATA_HOME/opencode" "$CONF_HOME/opencode"
          }

          # حفظ كل شيء (conversations + ذاكرة الوكيل + snapshots + ...) مشفّراً
          vault_save() {
            [ -n "$VAULT_KEY" ] || { echo "⚠️  VAULT_KEY مفقود — لم يُحفظ."; return 0; }
            mkdir -p "$DATA_HOME" "$CONF_HOME" "$VAULT_DIR"
            # فرق أننا لا نعيد الكتابة إلا إذا تغيّرت البيانات فعلاً
            # (نتجنب بطاقة endless commits من الـ openssl salt)
            local plain="${RUNNER_TEMP}/vault.plain.tar.gz"
            local tmp="${RUNNER_TEMP}/vault.bin.tmp"
            ( cd "${RUNNER_TEMP}" && tar -czf "$plain" occonfig ocdata 2>/dev/null ) || return 0
            local fp; fp=$(sha256sum "$plain" | cut -d' ' -f1)
            local prev; prev=$(cat "${VAULT_DIR}/vault.sha256" 2>/dev/null || echo "")
            if [ "$fp" = "$prev" ] && [ -f "$VAULT_FILE" ]; then
              echo "🧊 لا تغيير في الذاكرة — vault.bin ثابت."
              rm -f "$plain"
              return 0
            fi
            if ( openssl enc -aes-256-cbc -pbkdf2 -iter 100000 -salt -pass pass:"$VAULT_KEY" -in "$plain" -out "$tmp" 2>/dev/null ); then
              mv -f "$tmp" "$VAULT_FILE"
              echo "$fp" > "${VAULT_DIR}/vault.sha256"
              local size; size=$(stat -c%s "$VAULT_FILE" 2>/dev/null || echo 0)
              echo "🔒 ذاكرة الحفظ: vault.bin ($size bytes) — كل المحادثات محفوظة ومشفّرة."
            else
              echo "⚠️  فشل التشفير."
            fi
            rm -f "$plain"
          }
          VAULTSH
          chmod +x "$RUNNER_TEMP/vault.sh"

          # ⭐ توجيه opencode لنفس الدوال (خارج الـ repo حتى لا تتسرّب أي بيانات خام)
          echo "XDG_DATA_HOME=$RUNNER_TEMP/ocdata"   >> "$GITHUB_ENV"
          echo "XDG_CONFIG_HOME=$RUNNER_TEMP/occonfig" >> "$GITHUB_ENV"

          XDG_DATA_HOME="$RUNNER_TEMP/ocdata"
          XDG_CONFIG_HOME="$RUNNER_TEMP/occonfig"
          source "$RUNNER_TEMP/vault.sh"
          vault_restore

      # -----------------------------------------------------------------------
      # 2) إعداد Node.js (يحتاجه opencode-ai من npm)
      # -----------------------------------------------------------------------
      - name: ⚙️ Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # -----------------------------------------------------------------------
      # 3) تثبيت الأدوات المساعدة
      # -----------------------------------------------------------------------
      - name: 🛠️ Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq curl unzip jq git ca-certificates procps

      # -----------------------------------------------------------------------
      # 4) تثبيت OpenCode عبر الطريقة الرسمية
      # -----------------------------------------------------------------------
      - name: 🤖 Install OpenCode AI (official installer)
        run: |
          set -e
          echo "::group::Installing opencode via official installer"
          curl -fsSL https://opencode.ai/install | bash
          echo "::endgroup::"

          # إضافة المسار إلى PATH للـ steps اللاحقة
          echo "$HOME/.opencode/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.opencode/bin:$PATH"

          # تثبيت احتياطي عبر npm
          echo "::group::Installing opencode-ai via npm (fallback)"
          npm install -g opencode-ai || true
          echo "::endgroup::"

          which opencode || true
          opencode --version || true

      # -----------------------------------------------------------------------
      # 5) تثبيت cloudflared
      # -----------------------------------------------------------------------
      - name: ☁️ Install cloudflared
        uses: AnimMouse/setup-cloudflared@v2

      - name: ✅ Verify cloudflared
        run: cloudflared --version

      # -----------------------------------------------------------------------
      # 6) إنشاء ملف إعدادات opencode.json
      # -----------------------------------------------------------------------
      - name: 📝 Prepare opencode config
        run: |
          if [ ! -f "opencode.json" ] && [ ! -f ".opencode/opencode.json" ]; then
            cat > opencode.json <<'JSON'
          {
            "$schema": "https://opencode.ai/config.json",
            "theme": "opencode",
            "autoshare": false,
            "autoupdate": false
          }
          JSON
            echo "Created default opencode.json"
          else
            echo "Using existing opencode config"
          fi

      # -----------------------------------------------------------------------
      # 7) ⭐ تشغيل opencode serve في الخلفية — مع الإصلاح النهائي
      #
      # سبب التعليق سابقاً: nohup … & وحده لا يفصل العملية في GitHub Actions،
      # فالـ step لا يخرج أبداً. الحل: setsid + إعادة توجيه stdin/stdout/stderr
      # + disown، وفحص /global/health (endpoint الصحيح).
      # -----------------------------------------------------------------------
      - name: 🚀 Start OpenCode web server (background)
        timeout-minutes: 5    # ⭐ ضمان عدم تعليق الخطوة أبداً
        run: |
          set -euo pipefail
          export PATH="$HOME/.opencode/bin:$PATH"

          mkdir -p "$RUNNER_TEMP/opencode-logs"
          LOG_FILE="$RUNNER_TEMP/opencode-logs/server.log"
          : > "$LOG_FILE"

          echo "Starting opencode serve on 0.0.0.0:4096 ..."

          # ⭐ تفعيل صفحة تسجيل الدخول (HTTP Basic Auth) من Secrets الـ repo
          #  — username/password من أسرار الريبو، بدونها يرفض الدخول نهائياً
          export OPENCODE_SERVER_USERNAME="${OPENCODE_WEB_USERNAME:-opencode}"
          export OPENCODE_SERVER_PASSWORD="${OPENCODE_WEB_PASSWORD:-}"
          if [ -z "$OPENCODE_WEB_PASSWORD" ]; then
            echo "⚠️  تحذير: OPENCODE_WEB_PASSWORD غير مضبوط — التسجيل غير آمن. يرجى ضبطه في Secrets."
          fi

          # ⭐⭐ الإصلاح الجوهري ⭐⭐
          # setsid  : ينشئ process group جديد ويفصل العملية تماماً عن الـ runner
          # </dev/null : يغلق stdin حتى لا ينتظر input
          # >LOG 2>&1 : يعيد توجيه stdout/stderr إلى ملف فقط (لا pipe للـ runner)
          # &        : خلفية
          # disown   : إزالة الـ job من قائمة jobs الخاصة بـ bash
          setsid bash -c "opencode serve --hostname 0.0.0.0 --port 4096 --cors '*' </dev/null >>'$LOG_FILE' 2>&1" &
          OPENCODE_PID=$!
          disown || true

          echo "$OPENCODE_PID" > "$RUNNER_TEMP/opencode.pid"
          echo "OpenCode PID = $OPENCODE_PID"

          # بيانات الدخول لفحوصات curl القادمة
          AUTH_CURL=()
          if [ -n "$OPENCODE_SERVER_USERNAME" ] && [ -n "$OPENCODE_SERVER_PASSWORD" ]; then
            AUTH_CURL=(-u "$OPENCODE_SERVER_USERNAME:$OPENCODE_SERVER_PASSWORD")
          fi

          # ننتظر حتى يستجيب على المنفذ
          # نستخدم /global/health (Endpoint الرسمي للفحص حسب توثيق opencode)
          # ومعه fallback: فحص TCP فقط في حال غيّروا الـ API
          UP=0
          for i in $(seq 1 120); do
            # المحاولة 1: health endpoint الرسمي
            if curl -fsS --max-time 2 "${AUTH_CURL[@]}" http://127.0.0.1:4096/global/health >/dev/null 2>&1; then
              UP=1; echo "✅ /global/health responded after ${i}s"; break
            fi
            # المحاولة 2: TCP فقط (المنفذ مفتوح يعني العملية حية)
            if (echo > /dev/tcp/127.0.0.1/4096) >/dev/null 2>&1; then
              # نتأكد أن السيرفر يستجيب لـ HTTP بأي status
              CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 2 "${AUTH_CURL[@]}" http://127.0.0.1:4096/ || echo "000")
              if [ "$CODE" != "000" ]; then
                UP=1; echo "✅ opencode listening on :4096 (HTTP $CODE) after ${i}s"; break
              fi
            fi
            # تحقق أن العملية ما زالت حية أصلاً
            if ! kill -0 "$OPENCODE_PID" 2>/dev/null; then
              echo "❌ opencode process exited prematurely. Logs:"
              cat "$LOG_FILE" || true
              exit 1
            fi
            sleep 1
          done

          if [ "$UP" -ne 1 ]; then
            echo "❌ opencode failed to become reachable in 120s. Logs:"
            tail -n 200 "$LOG_FILE" || true
            # نقتل العملية الفاشلة قبل الخروج
            kill -TERM "$OPENCODE_PID" 2>/dev/null || true
            exit 1
          fi

          echo "----- last 30 lines of opencode log -----"
          tail -n 30 "$LOG_FILE" || true

      # -----------------------------------------------------------------------
      # 8) فتح Cloudflare Quick Tunnel — نفس نمط الفصل الآمن
      # -----------------------------------------------------------------------
      - name: 🌐 Start Cloudflare Quick Tunnel
        id: tunnel
        timeout-minutes: 3
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/cloudflared-logs"
          TUN_LOG="$RUNNER_TEMP/cloudflared-logs/tunnel.log"
          : > "$TUN_LOG"

          # نفس نمط setsid لضمان عدم تعليق الخطوة
          setsid bash -c "cloudflared tunnel --no-autoupdate --url http://127.0.0.1:4096 </dev/null >>'$TUN_LOG' 2>&1" &
          TUN_PID=$!
          disown || true
          echo "$TUN_PID" > "$RUNNER_TEMP/cloudflared.pid"
          echo "cloudflared PID = $TUN_PID"

          # استخراج الرابط https://*.trycloudflare.com من اللوج
          PUBLIC_URL=""
          for i in $(seq 1 90); do
            if grep -Eo 'https://[a-zA-Z0-9.-]+\.trycloudflare\.com' "$TUN_LOG" | head -n1 > /tmp/url.txt 2>/dev/null; then
              PUBLIC_URL=$(cat /tmp/url.txt || true)
              if [ -n "$PUBLIC_URL" ]; then break; fi
            fi
            if ! kill -0 "$TUN_PID" 2>/dev/null; then
              echo "❌ cloudflared exited prematurely. Logs:"
              cat "$TUN_LOG" || true
              exit 1
            fi
            sleep 1
          done

          if [ -z "$PUBLIC_URL" ]; then
            echo "❌ Failed to get tunnel URL in 90s. Tunnel log:"
            cat "$TUN_LOG"
            exit 1
          fi

          echo "PUBLIC_URL=$PUBLIC_URL" >> "$GITHUB_ENV"
          echo "public_url=$PUBLIC_URL" >> "$GITHUB_OUTPUT"

          echo ""
          echo "╔════════════════════════════════════════════════════════════════╗"
          echo "║              🎉 OpenCode AI is LIVE on the Web 🎉              ║"
          echo "╠════════════════════════════════════════════════════════════════╣"
          printf  "║  URL:  %-55s ║\n" "$PUBLIC_URL"
          printf  "║  Health: %-53s ║\n" "$PUBLIC_URL/global/health"
          echo "╚════════════════════════════════════════════════════════════════╝"
          echo ""

      # -----------------------------------------------------------------------
      # 9) كتابة الرابط في Summary
      # -----------------------------------------------------------------------
      - name: 📌 Publish URL to Job Summary
        run: |
          {
            echo "# 🤖 OpenCode AI — Live Session (Secure)"
            echo ""
            echo "## 🌐 الرابط العام"
            echo ""
            echo "### 👉 [${PUBLIC_URL}](${PUBLIC_URL})"
            echo ""
            echo "> 🔐 **تسجيل الدخول مطلوب** عند فتح الرابط — username + password"
            echo "> تأتي من Secrets الخاصة بالـ repository (``OPENCODE_WEB_USERNAME`` / ``OPENCODE_WEB_PASSWORD``)."
            echo "> بدون البيانات الصحيحة لا يمكن الدخول أبداً."
            echo ""
            echo "- Health check: \`${PUBLIC_URL}/global/health\`"
            echo "- API docs:     \`${PUBLIC_URL}/doc\`"
            echo ""
            echo "| الحقل | القيمة |"
            echo "|------|--------|"
            echo "| **Repository** | \`${GITHUB_REPOSITORY}\` |"
            echo "| **Branch** | \`${GITHUB_REF_NAME}\` |"
            echo "| **مدة التشغيل** | ${{ github.event.inputs.duration_minutes }} دقيقة |"
            echo "| **Auto commit** | ${{ github.event.inputs.auto_commit }} |"
            echo "| **Memory Vault** | ${{ github.event.inputs.enable_vault }} (مشفّر بـ AES-256) |"
            echo ""
            echo "## 🧠 الذاكرة"
            echo "جميع المحادثات والذاكرة تُحفظ بشكل مشفّر في \`.opencode-vault/vault.bin\`"
            echo "وترجع تلقائياً عند أي تشغيل لاحق — حتى لو عطّلت الـ workflow ثم شغّلته."
            echo ""
            echo "## ✏️ التعديلات"
            echo "أي تعديل تقوم به على الملفات سيتم رفعه تلقائياً (commit + push)"
            echo "إلى branch: \`${GITHUB_REF_NAME}\` كل ${{ github.event.inputs.commit_interval_seconds }} ثانية."
            echo ""
            echo "## 🛑 لإيقاف الجلسة"
            echo "اضغط على زر **Cancel workflow** في صفحة الـ Actions."
          } >> "$GITHUB_STEP_SUMMARY"

      # -----------------------------------------------------------------------
      # 10) Auto-commit loop في الخلفية — مع setsid
      # -----------------------------------------------------------------------
      - name: 🔁 Start auto-commit loop (background)
        if: ${{ github.event.inputs.auto_commit == 'true' }}
        timeout-minutes: 1
        run: |
          set -euo pipefail
          git config --global user.email "opencode-bot@users.noreply.github.com"
          git config --global user.name  "opencode-bot"

          INTERVAL="${{ github.event.inputs.commit_interval_seconds }}"
          BRANCH="${GITHUB_REF_NAME}"
          LOG="$RUNNER_TEMP/autocommit.log"
          : > "$LOG"

          cat > "$RUNNER_TEMP/autocommit.sh" <<EOF
          #!/usr/bin/env bash
          cd "$GITHUB_WORKSPACE"
          source "\$RUNNER_TEMP/vault.sh" 2>/dev/null || true
          while true; do
            sleep $INTERVAL
            # ⭐ حفظ الخزنة المشفّرة (كل المحادثات والذاكرة) قبل الفحص
            vault_save >> "$LOG" 2>&1 || true
            if [ -n "\$(git status --porcelain)" ]; then
              git add -A
              MSG="🤖 opencode: auto-commit \$(date -u +'%Y-%m-%d %H:%M:%SZ')"
              git commit -m "\$MSG" >> "$LOG" 2>&1 || true
              git push origin "$BRANCH" >> "$LOG" 2>&1 || true
              echo "[\$(date -u)] pushed: \$MSG" >> "$LOG"
            fi
          done
          EOF
          chmod +x "$RUNNER_TEMP/autocommit.sh"

          # ⭐ نفس نمط setsid + disown لمنع التعليق
          setsid bash -c "bash '$RUNNER_TEMP/autocommit.sh' </dev/null >>'$LOG' 2>&1" &
          AC_PID=$!
          disown || true
          echo "$AC_PID" > "$RUNNER_TEMP/autocommit.pid"
          echo "✅ Auto-commit loop started (PID=$AC_PID, every ${INTERVAL}s) on branch ${BRANCH}"

      # -----------------------------------------------------------------------
      # 11) إبقاء الـ job حياً للمدة المطلوبة
      # -----------------------------------------------------------------------
      - name: ⏳ Keep session alive
        run: |
          DURATION_MIN="${{ github.event.inputs.duration_minutes }}"
          DURATION_SEC=$(( DURATION_MIN * 60 ))
          echo "Session will run for ${DURATION_MIN} minutes (${DURATION_SEC}s)."
          echo "Public URL: ${PUBLIC_URL}"
          echo ""

          ELAPSED=0
          STEP=300   # 5 minutes
          source "$RUNNER_TEMP/vault.sh" 2>/dev/null || true
          while [ "$ELAPSED" -lt "$DURATION_SEC" ]; do
            sleep "$STEP"
            ELAPSED=$(( ELAPSED + STEP ))
            REMAIN_MIN=$(( (DURATION_SEC - ELAPSED) / 60 ))
            echo "⏱️ Heartbeat — elapsed=$((ELAPSED/60))min  remaining=${REMAIN_MIN}min"
            echo "🌐 ${PUBLIC_URL}"

            # ⭐ حفظ متواصل للخزنة المشفّرة (حتى مع إيقاف الـ workflow تبقى محفوظة)
            vault_save || true

            if [ -f "$RUNNER_TEMP/opencode.pid" ] && ! kill -0 "$(cat $RUNNER_TEMP/opencode.pid)" 2>/dev/null; then
              echo "⚠️ opencode process died — exiting."
              exit 1
            fi
            if [ -f "$RUNNER_TEMP/cloudflared.pid" ] && ! kill -0 "$(cat $RUNNER_TEMP/cloudflared.pid)" 2>/dev/null; then
              echo "⚠️ cloudflared process died — exiting."
              exit 1
            fi
          done

          echo "✅ Session duration reached. Shutting down."

      # -----------------------------------------------------------------------
      # 12) commit أخير (يحفظ الخزنة دائماً حتى لو عطّلت auto_commit)
      # -----------------------------------------------------------------------
      - name: 💾 Final commit & push
        if: ${{ always() }}
        run: |
          cd "$GITHUB_WORKSPACE"
          git config --global user.email "opencode-bot@users.noreply.github.com"
          git config --global user.name  "opencode-bot"
          source "$RUNNER_TEMP/vault.sh" 2>/dev/null || true
          vault_save || true
          if [ -n "$(git status --porcelain)" ]; then
            git add -A
            git commit -m "🤖 opencode: final commit + memory vault $(date -u +'%Y-%m-%d %H:%M:%SZ')" || true
            git push origin "${GITHUB_REF_NAME}" || true
          else
            echo "No pending changes to commit."
          fi

      # -----------------------------------------------------------------------
      # 13) عرض اللوجات
      # -----------------------------------------------------------------------
      - name: 📜 Show logs (debug)
        if: ${{ always() }}
        run: |
          echo "===== opencode server log (tail 100) ====="
          tail -n 100 "$RUNNER_TEMP/opencode-logs/server.log" 2>/dev/null || true
          echo ""
          echo "===== cloudflared tunnel log (tail 60) ====="
          tail -n 60  "$RUNNER_TEMP/cloudflared-logs/tunnel.log" 2>/dev/null || true
          echo ""
          echo "===== autocommit log (tail 60) ====="
          tail -n 60  "$RUNNER_TEMP/autocommit.log" 2>/dev/null || true

      # -----------------------------------------------------------------------
      # 14) إغلاق نظيف
      # -----------------------------------------------------------------------
      - name: 🧹 Shutdown cloudflared
        if: ${{ always() }}
        continue-on-error: true
        uses: AnimMouse/setup-cloudflared/shutdown@v2
