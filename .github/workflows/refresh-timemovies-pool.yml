name: Auto-Refresh TimeMovies Session Pool

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 */3 * *'

permissions:
  contents: write

concurrency:
  group: refresh-timemovies-pool-${{ github.ref }}
  cancel-in-progress: false

jobs:
  refresh-pool:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Renew encrypted session pool and rebuild TimeMovies.cs3
        run: |
          set -euo pipefail
          chmod +x gradlew
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          ./gradlew :TimeMovies:testDebugUnitTest --tests "com.timemovies.TimeMoviesUnitTest.testAutoRenewPoolEncWhenRequested" -PtmRenewPool=true --no-daemon
          ./gradlew :TimeMovies:generateEmbeddedPool :TimeMovies:make --rerun-tasks --no-daemon

      - name: Commit renewed pool.enc and TimeMovies.cs3
        run: |
          if [ -f "TimeMovies/build/TimeMovies.cs3" ]; then
            mkdir -p build
            cp -f TimeMovies/build/TimeMovies.cs3 build/TimeMovies.cs3
            python3 - <<'PY'
          import os, re
          sz = os.path.getsize("build/TimeMovies.cs3")
          with open("plugins.json", "r", encoding="utf-8") as fh:
              txt = fh.read()
          def repl(m):
              blk = m.group(0)
              if '"internalName": "TimeMovies"' not in blk:
                  return blk
              return re.sub(r'("fileSize"\s*:\s*)\d+', rf'\g<1>{sz}', blk, count=1)
          new_txt = re.sub(r'\{[^{}]*"internalName"\s*:\s*"TimeMovies"[^{}]*\}', repl, txt, flags=re.S)
          if new_txt != txt:
              with open("plugins.json", "w", encoding="utf-8") as fh:
                  fh.write(new_txt)
          PY
            git config --local user.email "github-actions[bot]@users.noreply.github.com"
            git config --local user.name "github-actions[bot]"
            git add -f TimeMovies/pool.enc build/TimeMovies.cs3 plugins.json
            if ! git diff --cached --quiet; then
              git commit -m "🤖 Auto-refresh TimeMovies session pool [skip ci]"
              git pull --rebase origin "$GITHUB_REF_NAME" || true
              git push
            fi
          fi
