name: Build TukTukcima Plugin

on:
  workflow_dispatch:
  push:
    paths:
      - 'TukTukcima/**'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build TukTukcima plugin
        run: ./gradlew :TukTukcima:make

      - name: Upload TukTukcima.cs3 artifact
        uses: actions/upload-artifact@v4
        with:
          name: TukTukcima
          path: TukTukcima/build/TukTukcima.cs3

      - name: Commit and push built cs3 to build/
        run: |
          if [ -f "TukTukcima/build/TukTukcima.cs3" ]; then
            cp TukTukcima/build/TukTukcima.cs3 build/TukTukcima.cs3
            git config --local user.email "github-actions[bot]@users.noreply.github.com"
            git config --local user.name "github-actions[bot]"
            git add -f build/TukTukcima.cs3
            git commit --allow-empty -m "🤖 Build TukTukcima.cs3"
            git pull --rebase origin "$GITHUB_REF_NAME" || true
            git push
          else
            echo "TukTukcima.cs3 not found!"
          fi