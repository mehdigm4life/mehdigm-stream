name: Build Plugins

on:
  workflow_dispatch:
  push:
    paths:
      - 'CimaCloud/**'
      - 'AnimeDay/**'
      - '.github/workflows/build-plugins.yml'

permissions:
  contents: write

jobs:
  build:
    if: "!contains(github.event.head_commit.message, '[skip ci]') && !contains(github.event.head_commit.message, '🤖')"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Configure Android SDK and build plugins
        run: |
          chmod +x gradlew
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          ./gradlew :CimaCloud:clean :CimaCloud:make --no-daemon
          ./gradlew :AnimeDay:clean :AnimeDay:make --no-daemon

      - name: Copy artifacts and sync plugins.json fileSize
        run: |
          mkdir -p build
          for module in CimaCloud AnimeDay; do
            if [ -f "$module/build/$module.cs3" ]; then
              cp -f "$module/build/$module.cs3" "build/$module.cs3"
            else
              echo "$module.cs3 not found!"
              exit 1
            fi
          done
          python3 - <<'PY'
          import os, re
          with open("plugins.json", "r", encoding="utf-8") as fh:
              txt = fh.read()
          new_txt = txt
          for mod in ("CimaCloud", "AnimeDay"):
              p = f"build/{mod}.cs3"
              if not os.path.exists(p):
                  continue
              sz = os.path.getsize(p)
              def repl(m, mod=mod, sz=sz):
                  blk = m.group(0)
                  if f'"internalName": "{mod}"' not in blk:
                      return blk
                  return re.sub(r'("fileSize"\s*:\s*)\d+', rf'\g<1>{sz}', blk, count=1)
              new_txt = re.sub(rf'\{{[^{{}}]*"internalName"\s*:\s*"{mod}"[^{{}}]*\}}', repl, new_txt, flags=re.S)
          if new_txt != txt:
              with open("plugins.json", "w", encoding="utf-8") as fh:
                  fh.write(new_txt)
          PY

      - name: Commit and push built cs3 to build/
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add -f build/CimaCloud.cs3 build/AnimeDay.cs3 plugins.json
          if ! git diff --cached --quiet; then
            git commit -m "🤖 Build plugins (CimaCloud, AnimeDay) [skip ci]"
            git pull --rebase origin "$GITHUB_REF_NAME" || true
            git push
          fi
