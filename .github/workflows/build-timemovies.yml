name: Build TimeMovies Plugin

on:
  workflow_dispatch:
  push:
    paths:
      - 'TimeMovies/**'
      - 'build/TimeMovies.png'
      - '.github/workflows/build-timemovies.yml'

permissions:
  contents: write
  checks: write

jobs:
  build:
    if: "!contains(github.event.head_commit.message, '[skip ci]') && !contains(github.event.head_commit.message, '🤖')"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Configure Android SDK, test, and build TimeMovies plugin
        run: |
          set -o pipefail
          chmod +x gradlew
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          ./gradlew :TimeMovies:testDebugUnitTest :TimeMovies:make --no-daemon --stacktrace 2>&1 | tee /tmp/gradle.log

      - name: Publish Gradle & JUnit diagnostics to Check Run
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PY'
          import glob, json, os, subprocess
          log = ""
          if os.path.exists("/tmp/gradle.log"):
              with open("/tmp/gradle.log", "r", encoding="utf-8", errors="replace") as f:
                  log = f.read()
          xmls = []
          for p in sorted(glob.glob("TimeMovies/build/test-results/testDebugUnitTest/*.xml")):
              with open(p, "r", encoding="utf-8", errors="replace") as f:
                  xmls.append(f.read()[:20000])
          body = ("### XML\n```xml\n" + "\n".join(xmls) + "\n```\n### Gradle Tail\n```\n" + log[-38000:] + "\n```")[:64000]
          payload = {
              "name": "TimeMovies Diagnostics",
              "head_sha": os.environ["GITHUB_SHA"],
              "status": "completed",
              "conclusion": "neutral",
              "output": {
                  "title": "Gradle & JUnit Output",
                  "summary": body,
              },
          }
          with open("/tmp/cr.json", "w", encoding="utf-8") as f:
              json.dump(payload, f)
          subprocess.run([
              "gh", "api", "--method", "POST",
              f"repos/{os.environ['GITHUB_REPOSITORY']}/check-runs",
              "--input", "/tmp/cr.json",
          ], check=False)
          PY

      - name: Upload TimeMovies.cs3 artifact
        uses: actions/upload-artifact@v4
        with:
          name: TimeMovies
          path: TimeMovies/build/TimeMovies.cs3

      - name: Commit and push built cs3 to build/
        run: |
          if [ -f "TimeMovies/build/TimeMovies.cs3" ]; then
            mkdir -p build
            cp -f TimeMovies/build/TimeMovies.cs3 build/TimeMovies.cs3
            python3 - <<'PY'
          import os, re
          sz = os.path.getsize("build/TimeMovies.cs3")
          with open("plugins.json", "r", encoding="utf-8") as fh:
              txt = fh.read()
          def repl(m):
              blk = m.group(0)
              if '"internalName": "TimeMovies"' not in blk:
                  return blk
              return re.sub(r'("fileSize"\s*:\s*)\d+', rf'\g<1>{sz}', blk, count=1)
          new_txt = re.sub(r'\{[^{}]*"internalName"\s*:\s*"TimeMovies"[^{}]*\}', repl, txt, flags=re.S)
          if new_txt != txt:
              with open("plugins.json", "w", encoding="utf-8") as fh:
                  fh.write(new_txt)
          PY
            git config --local user.email "github-actions[bot]@users.noreply.github.com"
            git config --local user.name "github-actions[bot]"
            git add -f build/TimeMovies.cs3 plugins.json
            if ! git diff --cached --quiet; then
              git commit -m "🤖 Build TimeMovies.cs3 [skip ci]"
              git pull --rebase origin "$GITHUB_REF_NAME" || true
              git push
            fi
          else
            echo "TimeMovies.cs3 not found!"
            exit 1
          fi
