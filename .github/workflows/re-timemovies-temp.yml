name: Inspect TimeMovies Temp

on:
  push:
    branches:
      - "arena/**"

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      checks: write
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17 & Python tools
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install jadx, pillow, androguard & download TimeMovies 1092 APK
        run: |
          pip3 install -q pillow androguard
          mkdir -p /tmp/re/apks /tmp/re/report/icons
          curl -fsSL "https://github.com/skylot/jadx/releases/download/v1.5.1/jadx-1.5.1.zip" -o /tmp/re/jadx.zip
          unzip -q /tmp/re/jadx.zip -d /tmp/re/jadx
          chmod +x /tmp/re/jadx/bin/jadx
          curl -fL "https://github.com/magicsol255/timefiles/releases/download/mobile/TimeMovies.v1.0.6.5.1092-p1.apk" -o /tmp/re/apks/TimeMovies_1092.apk

          python3 - <<'PY'
          import zipfile
          z = zipfile.ZipFile("/tmp/re/apks/TimeMovies_1092.apk")
          for name in ["res/sK.webp", "res/mB.png", "classes.dex"]:
              if name in z.namelist():
                  with open("/tmp/re/report/icons/" + name.replace("/", "_"), "wb") as f:
                      f.write(z.read(name))
          PY

      - name: Compile NDK memory DEX dumper and prepare emulator script
        run: |
          cat << 'EOF' > /tmp/re/dexdump_mem.c
          #define _GNU_SOURCE
          #include <stdio.h>
          #include <stdlib.h>
          #include <stdint.h>
          #include <string.h>
          #include <fcntl.h>
          #include <unistd.h>

          static int is_dex_magic(const uint8_t *p) {
              if (memcmp(p, "dex\n0", 5) != 0 && memcmp(p, "cdex0", 5) != 0) return 0;
              if (p[7] != 0) return 0;
              return (p[5] >= '0' && p[5] <= '9' && p[6] >= '0' && p[6] <= '9');
          }

          int main(int argc, char **argv) {
              if (argc < 3) return 1;
              int pid = atoi(argv[1]);
              const char *outdir = argv[2];
              char maps_path[256], mem_path[256];
              snprintf(maps_path, sizeof(maps_path), "/proc/%d/maps", pid);
              snprintf(mem_path, sizeof(mem_path), "/proc/%d/mem", pid);
              FILE *maps = fopen(maps_path, "r");
              int memfd = open(mem_path, O_RDONLY);
              if (!maps || memfd < 0) return 1;
              char line[1024];
              int found = 0;
              while (fgets(line, sizeof(line), maps)) {
                  unsigned long start = 0, end = 0;
                  char perms[8] = {0};
                  char path[512] = {0};
                  int n = sscanf(line, "%lx-%lx %4s %*s %*s %*s %511[^\n]", &start, &end, perms, path);
                  if (n < 3) continue;
                  if (perms[0] != 'r' || perms[1] != '-') continue;
                  size_t region_sz = end - start;
                  if (region_sz < 1024 || region_sz > (256UL * 1024 * 1024)) continue;
                  if (strstr(path, "/system/framework/") || strstr(path, "/apex/")) continue;

                  uint8_t *buf = malloc(region_sz);
                  if (!buf) continue;
                  ssize_t rd = pread(memfd, buf, region_sz, (off_t)start);
                  if (rd > 112) {
                      for (size_t off = 0; off + 112 <= (size_t)rd; off += 4) {
                          const uint8_t *p = buf + off;
                          uint32_t fsize = *(const uint32_t *)(p + 32);
                          uint32_t hsize = *(const uint32_t *)(p + 36);
                          uint32_t endian = *(const uint32_t *)(p + 40);
                          if (is_dex_magic(p) && (hsize == 0x70 || hsize == 0x78) && endian == 0x12345678 && fsize > 1000 && fsize <= 64*1024*1024) {
                              size_t avail = (size_t)rd - off;
                              size_t to_write = fsize <= avail ? fsize : avail;
                              char outpath[512];
                              snprintf(outpath, sizeof(outpath), "%s/dump_%03d_%lx_%u.dex", outdir, found++, start + off, fsize);
                              FILE *out = fopen(outpath, "wb");
                              if (out) {
                                  fwrite(p, 1, to_write, out);
                                  fclose(out);
                                  printf("Dumped %s (%zu/%u)\n", outpath, to_write, fsize);
                              }
                              if (fsize >= 0x70) off += ((fsize - 4) & ~3UL);
                          }
                      }
                  }
                  free(buf);
              }
              fclose(maps);
              close(memfd);
              return 0;
          }
          EOF
          NDK_CLANG=$(find "$ANDROID_HOME/ndk" -name "x86_64-linux-android24-clang" | sort | tail -n 1)
          "$NDK_CLANG" -O2 -static /tmp/re/dexdump_mem.c -o /tmp/re/dexdump_mem

          cat << 'EMUSCRIPT' > /tmp/re/run_emu.sh
          #!/usr/bin/env bash
          set -x
          exec > /tmp/re/report/emu_trace.txt 2>&1
          mkdir -p /tmp/re/dumped_1092 /tmp/re/appdata_1092
          adb root || true
          sleep 1
          adb remount || true
          adb shell "mv /system/xbin/su /system/xbin/su.bak 2>/dev/null || true; mv /system/bin/su /system/bin/su.bak 2>/dev/null || true" || true
          adb push /tmp/re/dexdump_mem /data/local/tmp/dexdump_mem
          adb shell "chmod 755 /data/local/tmp/dexdump_mem && mkdir -p /data/local/tmp/tm1092"
          adb install -r /tmp/re/apks/TimeMovies_1092.apk
          adb logcat -c || true
          adb shell am start -n com.extremeqr.proapps/.ui.screens.activity.MainActivity || true
          sleep 15
          PID92=$(adb shell pidof com.extremeqr.proapps | tr -d '\r')
          echo "1092 PID=$PID92"
          adb shell "/data/local/tmp/dexdump_mem $PID92 /data/local/tmp/tm1092" || true
          adb pull /data/local/tmp/tm1092 /tmp/re/dumped_1092/ || true
          adb pull /data/data/com.extremeqr.proapps /tmp/re/appdata_1092/ || true
          adb logcat -d > /tmp/re/report/logcat_1092.txt 2>&1 || true
          echo "done"
          EMUSCRIPT
          chmod +x /tmp/re/run_emu.sh
          bash -n /tmp/re/run_emu.sh

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Android Emulator (API 30 default x86_64)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: default
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -writable-system
          script: bash /tmp/re/run_emu.sh

      - name: Decompile with --show-bad-code, dump critical bytecode + appdata, publish check-runs
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PY' > /tmp/re/report/small_dex_and_appdata.txt
          import glob, os, re, sqlite3
          try:
              from loguru import logger
              logger.disable("androguard")
          except Exception:
              pass
          from androguard.core.dex import DEX

          # 1. Inspect small dumped DEXes + stub classes.dex completely
          small_dexes = sorted(glob.glob("/tmp/re/dumped_1092/**/dump_00[4-9]_*.dex", recursive=True))
          if os.path.exists("/tmp/re/report/icons/classes.dex"):
              small_dexes.append("/tmp/re/report/icons/classes.dex")
          for df in small_dexes:
              print(f"\n================ SMALL DEX: {df} ({os.path.getsize(df)} B) ================")
              d = DEX(open(df, "rb").read())
              print("Strings:", d.get_strings()[:250])
              for c in d.get_classes():
                  print("  CLASS:", c.get_name(), "super=", c.get_superclassname())
                  for m in c.get_methods():
                      print("    METHOD:", m.get_name(), m.get_descriptor(), "flags=", hex(m.get_access_flags()))
                      code = m.get_code()
                      if code:
                          bc = code.get_bc()
                          insns = list(bc.get_instructions())
                          for ins in insns[:120]:
                              print("      ", ins.get_name(), ins.get_output())

          # 2. Inspect /tmp/re/appdata_1092
          print("\n================ APPDATA FILES ================")
          for root, dirs, files in os.walk("/tmp/re/appdata_1092"):
              if "code_cache" in root or "cache/image_cache" in root:
                  continue
              for fn in sorted(files):
                  fp = os.path.join(root, fn)
                  sz = os.path.getsize(fp)
                  print(f"FILE: {fp} ({sz} B)")
                  if sz < 250000 and any(k in fp.lower() for k in ("datastore", "shared_prefs", "device_key", "rasplab", "protector", "json", "xml", ".pb", "secret")):
                      raw = open(fp, "rb").read()
                      strs = re.findall(b"[ -~]{4,}", raw)
                      print("  ASCII:", [s.decode("ascii", "ignore")[:300] for s in strs[:60]])
                  if fn.endswith(".db") or "database" in root.lower():
                      try:
                          con = sqlite3.connect(fp)
                          cur = con.cursor()
                          tabs = [r[0] for r in cur.execute("SELECT name FROM sqlite_master WHERE type='table'").fetchall()]
                          print("  SQLITE TABLES:", tabs)
                          for tb in tabs:
                              cnt = cur.execute(f"SELECT count(*) FROM `{tb}`").fetchone()[0]
                              print(f"    {tb}: {cnt} rows")
                              if cnt > 0 and tb not in ("android_metadata", "room_master_table"):
                                  rows = cur.execute(f"SELECT * FROM `{tb}` LIMIT 3").fetchall()
                                  print("    sample:", repr(rows)[:600])
                          con.close()
                      except Exception as e:
                          print("  sqlite err:", e)
          PY

          # Filter relevant lines from logcat
          grep -iE "extremeqr|okhttp|retrofit|apks\.lol|protector|firebase|Exception|Error " /tmp/re/report/logcat_1092.txt | tail -n 250 > /tmp/re/report/logcat_filtered.txt || true
          rm -f /tmp/re/report/logcat_1092.txt /tmp/re/report/icons/classes.dex

          # Run jadx WITH --show-bad-code on ALL dumped DEXes + stub APK classes.dex
          mkdir -p /tmp/re/jadx_bad /tmp/re/jadx_stub /tmp/re/r5_src
          ALL_DEXS=$(find /tmp/re/dumped_1092 -name "dump_*.dex" | sort)
          /tmp/re/jadx/bin/jadx -j 4 --show-bad-code -d /tmp/re/jadx_bad $ALL_DEXS || true
          /tmp/re/jadx/bin/jadx -j 4 --show-bad-code --no-res -d /tmp/re/jadx_stub /tmp/re/apks/TimeMovies_1092.apk || true

          python3 - <<'PY'
          import glob, os, re, shutil
          try:
              from loguru import logger
              logger.disable("androguard")
          except Exception:
              pass
          from androguard.core.dex import DEX

          # Copy all stub/protector/tm classes
          for root_base in ["/tmp/re/jadx_stub/sources", "/tmp/re/jadx_bad/sources"]:
              for sub in ["com/protector", "tm", "com/extremeqr/proapps/security", "com/extremeqr/proapps/utils"]:
                  p = os.path.join(root_base, sub)
                  if os.path.isdir(p):
                      dst = os.path.join("/tmp/re/r5_src", sub)
                      os.makedirs(dst, exist_ok=True)
                      for fn in os.listdir(p):
                          if fn.endswith(".java"):
                              shutil.copy2(os.path.join(p, fn), os.path.join(dst, fn))

          # Target defpackage classes (all crypto/interceptors/UUID callers/auth/media/subtitles)
          explicit = {
              "q86", "r86", "s86", "t86", "u86", "uu1", "tu1", "vu1", "u04", "v04", "w04",
              "pe3", "q52", "y52", "hq7", "j18", "wc7", "ro", "to", "dk2", "ek2", "f18",
              "de9", "q00", "jw9", "zy1", "pr4", "c33", "mx", "ow1", "cw9", "dw9",
              "fx", "ex", "bb8", "kv", "at5", "bt5", "ct5", "dt5", "et5",
              "kd", "od", "rca", "cca", "k0", "f81", "fv3", "yb3", "nv", "mv",
              "xv", "fw", "qv", "lv", "jw", "rv", "hw", "ax", "zu9", "tu9", "vu9",
              "tba", "qca", "uba", "vba", "wba", "d24", "hx6", "ax6", "jw6", "l41",
              "u6", "v6", "r6", "e41", "f41", "g41"
          }

          re_hex32 = re.compile(r'"[0-9a-f]{32}"')
          must_terms = (
              "AES/GCM", "AES/CBC", "HmacSHA", "SecretKeySpec", "GCMParameterSpec",
              "X-Media-Grant", "\"x-t\"", "\"x-t.v2\"", "\"x-p\"", "\"m-a\"", "\"x-b\"",
              "60129f949ea4ea03d6598c06", "6a3e1c72b864f954c0ef8d54",
              "VidStream", "FreeDownloadPrepareResponse", "FreeDownloadConfirmRequest",
              "WKC", "EDWI", "ExternalExecutionDto", "SubtitleTrack", "subtools",
              "signInAnonymously", "getIdToken", "prepare_token", "watch_token",
              "timesnizz", "timesdizz", "resolve-play", "resolve-download",
              "tm.Protector", "com.protector"
          )

          defpkg_dir = "/tmp/re/jadx_bad/sources/defpackage"
          out_defpkg = "/tmp/re/r5_src/defpackage"
          os.makedirs(out_defpkg, exist_ok=True)

          selected = set()
          if os.path.isdir(defpkg_dir):
              for fn in os.listdir(defpkg_dir):
                  if not fn.endswith(".java"):
                      continue
                  cls = fn[:-5]
                  fp = os.path.join(defpkg_dir, fn)
                  txt = open(fp, "r", encoding="utf-8", errors="ignore").read()
                  if cls in explicit or re_hex32.search(txt) or any(t in txt for t in must_terms):
                      selected.add(cls)
                      shutil.copy2(fp, os.path.join(out_defpkg, fn))

          # Also include any immediate helper classes referenced inside q86, uu1, ex, at5, kd, rca, bb8
          re_imp = re.compile(r"\b([a-z][a-z0-9]{1,4})\b")
          pivots = ["q86", "uu1", "t86", "ex", "at5", "kd", "rca", "bb8", "xv", "fw", "qv", "lv", "mv", "jw", "k0"]
          for pv in pivots:
              pf = os.path.join(out_defpkg, pv + ".java")
              if os.path.exists(pf):
                  txt = open(pf).read()
                  for tok in set(re_imp.findall(txt)):
                      cand = os.path.join(defpkg_dir, tok + ".java")
                      if tok not in selected and os.path.exists(cand) and os.path.getsize(cand) < 80000:
                          ct = open(cand, "r", encoding="utf-8", errors="ignore").read()
                          if "androidx.compose." not in ct and "androidx.fragment." not in ct:
                              selected.add(tok)
                              shutil.copy2(cand, os.path.join(out_defpkg, tok + ".java"))

          print(f"Copied {len(selected)} defpackage classes to r5_src/defpackage")

          # Dalvik bytecode fallback for any method in critical classes so ZERO instructions can be lost!
          bytecode_targets = {
              f"L{c};" for c in [
                  "q86", "r86", "s86", "t86", "uu1", "u04", "v04", "w04",
                  "ex", "at5", "kd", "rca", "od", "bb8", "pe3",
                  "xv", "fw", "qv", "lv", "mv", "jw", "rv", "hw", "ax", "k0"
              ]
          }
          with open("/tmp/re/report/bytecode_critical.txt", "w") as out_bc:
              for df in sorted(glob.glob("/tmp/re/dumped_1092/**/dump_00[0-3]_*.dex", recursive=True)):
                  d = DEX(open(df, "rb").read())
                  for c in d.get_classes():
                      cname = c.get_name()
                      if cname in bytecode_targets or cname.startswith("Ltm/") or cname.startswith("Lcom/protector/"):
                          out_bc.write(f"\n================ {cname} ({os.path.basename(df)}) ================\n")
                          for f in c.get_fields():
                              out_bc.write(f"  FIELD: {f.get_name()}:{f.get_descriptor()} init={f.get_init_value()}\n")
                          for m in c.get_methods():
                              out_bc.write(f"  METHOD: {m.get_name()}{m.get_descriptor()} flags={hex(m.get_access_flags())}\n")
                              code = m.get_code()
                              if code:
                                  for ins in code.get_bc().get_instructions():
                                      out_bc.write(f"    {ins.get_name():20s} {ins.get_output()}\n")
          PY

          tar -czf /tmp/re/r5_bundle.tar.gz -C /tmp/re report r5_src
          ls -lh /tmp/re/r5_bundle.tar.gz

          python3 - <<'PY'
          import os, base64, json, subprocess

          repo = os.environ["GITHUB_REPOSITORY"]
          sha = os.environ["GITHUB_SHA"]

          def upload_tar(path, prefix):
              if not os.path.exists(path):
                  return
              with open(path, "rb") as f:
                  b64 = base64.b64encode(f.read()).decode("ascii")
              chunk_sz = 60000
              chunks = [b64[i:i+chunk_sz] for i in range(0, len(b64), chunk_sz)]
              print(f"Uploading {prefix}: {len(b64)} b64 chars in {len(chunks)} chunks")
              for idx, ch in enumerate(chunks[:60]):
                  payload = {
                      "name": f"{prefix}-{idx:02d}",
                      "head_sha": sha,
                      "status": "completed",
                      "conclusion": "success",
                      "output": {
                          "title": f"{prefix} part {idx+1}/{len(chunks)}",
                          "summary": f"total={len(chunks)} size={len(b64)}",
                          "text": ch
                      }
                  }
                  p = subprocess.run(
                      ["gh", "api", f"repos/{repo}/check-runs", "--method", "POST", "--input", "-"],
                      input=json.dumps(payload).encode("utf-8"),
                      capture_output=True
                  )
                  if p.returncode != 0:
                      print("ERR:", p.stderr.decode("utf-8", "ignore")[:300])

          upload_tar("/tmp/re/r5_bundle.tar.gz", "r5-tm")
          PY
