name: Verify TimeMovies Gradle Build

on:
  push:
    branches:
      - 'arena/**'

permissions:
  contents: read
  checks: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Run Gradle Unit Tests & Make CS3
        id: gradle_run
        continue-on-error: true
        run: |
          chmod +x gradlew
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          ./gradlew :TimeMovies:testDebugUnitTest :TimeMovies:make --no-daemon --stacktrace > /tmp/gradle_out.txt 2>&1
          echo "EXIT_CODE=$?" >> /tmp/gradle_status.txt
          if [ -f "TimeMovies/build/TimeMovies.cs3" ]; then
            ls -lh TimeMovies/build/TimeMovies.cs3 >> /tmp/gradle_out.txt
            unzip -l TimeMovies/build/TimeMovies.cs3 >> /tmp/gradle_out.txt
            unzip -p TimeMovies/build/TimeMovies.cs3 manifest.json >> /tmp/gradle_out.txt
            echo "" >> /tmp/gradle_out.txt
          fi

      - name: Publish Check Run Report
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PY'
          import json, os, subprocess
          out = open("/tmp/gradle_out.txt", "r", encoding="utf-8", errors="replace").read()
          status_txt = open("/tmp/gradle_status.txt").read() if os.path.exists("/tmp/gradle_status.txt") else "EXIT_CODE=1"
          ok = "EXIT_CODE=0" in status_txt and os.path.exists("TimeMovies/build/TimeMovies.cs3")
          tail = out[-60000:] if len(out) > 60000 else out
          payload = {
              "name": "timemovies-gradle-report",
              "head_sha": os.environ["GITHUB_SHA"],
              "status": "completed",
              "conclusion": "success" if ok else "failure",
              "output": {
                  "title": "TimeMovies Build OK" if ok else "TimeMovies Build Failed",
                  "summary": f"Status: {status_txt.strip()}",
                  "text": "```\n" + tail + "\n```"
              }
          }
          with open("/tmp/check.json", "w") as fh:
              json.dump(payload, fh)
          repo = os.environ["GITHUB_REPOSITORY"]
          subprocess.run(["gh", "api", "--method", "POST", f"/repos/{repo}/check-runs", "--input", "/tmp/check.json"], check=True)
          if not ok:
              raise SystemExit(1)
          PY
