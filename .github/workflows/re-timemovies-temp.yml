name: Inspect TimeMovies Temp

on:
  push:
    branches:
      - "arena/**"

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      checks: write
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17 & Python tools
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install jadx, pillow, androguard & download TimeMovies 1092 APK
        run: |
          pip3 install -q pillow androguard
          mkdir -p /tmp/re/apks /tmp/re/report/icons
          curl -fsSL "https://github.com/skylot/jadx/releases/download/v1.5.1/jadx-1.5.1.zip" -o /tmp/re/jadx.zip
          unzip -q /tmp/re/jadx.zip -d /tmp/re/jadx
          chmod +x /tmp/re/jadx/bin/jadx
          curl -fL "https://github.com/magicsol255/timefiles/releases/download/mobile/TimeMovies.v1.0.6.5.1092-p1.apk" -o /tmp/re/apks/TimeMovies_1092.apk

          python3 - <<'PY' > /tmp/re/report/icon_arsc.txt
          import zipfile
          try:
              from loguru import logger
              logger.disable("androguard")
          except Exception:
              pass
          from androguard.core.axml import ARSCParser, AXMLPrinter

          z = zipfile.ZipFile("/tmp/re/apks/TimeMovies_1092.apk")
          arsc = ARSCParser(z.read("resources.arsc"))
          pkg = arsc.get_packages_names()[0]
          for rid in [0x7f110000, 0x7f110001, 0x7f110002]:
              print(f"=== {hex(rid)} ===")
              try:
                  print(arsc.get_resolved_res_configs(rid))
              except Exception as e:
                  print("err:", e)
          for name in ["res/FG.png", "res/5c.webp", "res/iE.webp"]:
              if name in z.namelist():
                  with open("/tmp/re/report/icons/" + name.replace("/", "_"), "wb") as f:
                      f.write(z.read(name))
          for name in z.namelist():
              if name.startswith("res/") and name.endswith(".xml"):
                  raw = z.read(name)
                  try:
                      xml = AXMLPrinter(raw).get_xml().decode("utf-8", "ignore")
                      if "adaptive-icon" in xml or "mB" in xml or "ic_launcher" in xml:
                          print(f"=== XML {name} ===\n{xml}")
                  except Exception:
                      pass
          PY

      - name: Compile NDK memory DEX dumper and prepare emulator script
        run: |
          cat << 'EOF' > /tmp/re/dexdump_mem.c
          #define _GNU_SOURCE
          #include <stdio.h>
          #include <stdlib.h>
          #include <stdint.h>
          #include <string.h>
          #include <fcntl.h>
          #include <unistd.h>

          static int is_dex_magic(const uint8_t *p) {
              if (memcmp(p, "dex\n0", 5) != 0 && memcmp(p, "cdex0", 5) != 0) return 0;
              if (p[7] != 0) return 0;
              return (p[5] >= '0' && p[5] <= '9' && p[6] >= '0' && p[6] <= '9');
          }

          int main(int argc, char **argv) {
              if (argc < 3) return 1;
              int pid = atoi(argv[1]);
              const char *outdir = argv[2];
              char maps_path[256], mem_path[256];
              snprintf(maps_path, sizeof(maps_path), "/proc/%d/maps", pid);
              snprintf(mem_path, sizeof(mem_path), "/proc/%d/mem", pid);
              FILE *maps = fopen(maps_path, "r");
              int memfd = open(mem_path, O_RDONLY);
              if (!maps || memfd < 0) return 1;
              char line[1024];
              int found = 0;
              while (fgets(line, sizeof(line), maps)) {
                  unsigned long start = 0, end = 0;
                  char perms[8] = {0};
                  char path[512] = {0};
                  int n = sscanf(line, "%lx-%lx %4s %*s %*s %*s %511[^\n]", &start, &end, perms, path);
                  if (n < 3) continue;
                  if (perms[0] != 'r' || perms[1] != '-') continue;
                  size_t region_sz = end - start;
                  if (region_sz < 1024 || region_sz > (256UL * 1024 * 1024)) continue;
                  if (strstr(path, "/system/framework/") || strstr(path, "/apex/")) continue;

                  uint8_t *buf = malloc(region_sz);
                  if (!buf) continue;
                  ssize_t rd = pread(memfd, buf, region_sz, (off_t)start);
                  if (rd > 112) {
                      for (size_t off = 0; off + 112 <= (size_t)rd; off += 4) {
                          const uint8_t *p = buf + off;
                          uint32_t fsize = *(const uint32_t *)(p + 32);
                          uint32_t hsize = *(const uint32_t *)(p + 36);
                          uint32_t endian = *(const uint32_t *)(p + 40);
                          if (is_dex_magic(p) && (hsize == 0x70 || hsize == 0x78) && endian == 0x12345678 && fsize > 1000 && fsize <= 64*1024*1024) {
                              size_t avail = (size_t)rd - off;
                              size_t to_write = fsize <= avail ? fsize : avail;
                              char outpath[512];
                              snprintf(outpath, sizeof(outpath), "%s/dump_%03d_%lx_%u.dex", outdir, found++, start + off, fsize);
                              FILE *out = fopen(outpath, "wb");
                              if (out) {
                                  fwrite(p, 1, to_write, out);
                                  fclose(out);
                                  printf("Dumped %s (%zu/%u)\n", outpath, to_write, fsize);
                              }
                              if (fsize >= 0x70) off += ((fsize - 4) & ~3UL);
                          }
                      }
                  }
                  free(buf);
              }
              fclose(maps);
              close(memfd);
              return 0;
          }
          EOF
          NDK_CLANG=$(find "$ANDROID_HOME/ndk" -name "x86_64-linux-android24-clang" | sort | tail -n 1)
          "$NDK_CLANG" -O2 -static /tmp/re/dexdump_mem.c -o /tmp/re/dexdump_mem

          cat << 'EMUSCRIPT' > /tmp/re/run_emu.sh
          #!/usr/bin/env bash
          set -x
          exec > /tmp/re/report/emu_trace.txt 2>&1
          mkdir -p /tmp/re/dumped_1092
          adb root || true
          sleep 1
          adb remount || true
          adb shell "mv /system/xbin/su /system/xbin/su.bak 2>/dev/null || true; mv /system/bin/su /system/bin/su.bak 2>/dev/null || true" || true
          adb push /tmp/re/dexdump_mem /data/local/tmp/dexdump_mem
          adb shell "chmod 755 /data/local/tmp/dexdump_mem && mkdir -p /data/local/tmp/tm1092"
          adb install -r /tmp/re/apks/TimeMovies_1092.apk
          adb shell am start -n com.extremeqr.proapps/.ui.screens.activity.MainActivity || true
          sleep 7
          PID92=$(adb shell pidof com.extremeqr.proapps | tr -d '\r')
          echo "1092 PID=$PID92"
          adb shell "/data/local/tmp/dexdump_mem $PID92 /data/local/tmp/tm1092"
          adb pull /data/local/tmp/tm1092 /tmp/re/dumped_1092/ || true
          echo "done"
          EMUSCRIPT
          chmod +x /tmp/re/run_emu.sh
          bash -n /tmp/re/run_emu.sh

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Android Emulator (API 30 default x86_64)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: default
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -writable-system
          script: bash /tmp/re/run_emu.sh

      - name: Extract DEX strings, decompile app defpackage classes, and publish check-runs
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PY' > /tmp/re/report/dex_intel.txt
          import glob, re
          try:
              from loguru import logger
              logger.disable("androguard")
          except Exception:
              pass
          from androguard.core.dex import DEX

          dex_files = sorted(glob.glob("/tmp/re/dumped_1092/**/dump_*.dex", recursive=True))
          print("DEX files:", dex_files)
          re_hex32 = re.compile(r"^[0-9a-f]{32}$")
          re_hex24 = re.compile(r"^[0-9a-f]{24}$")
          keywords = (
              "http://", "https://", "://", "apks.lol", "devmagics", "tmovies", "subtools",
              "doomplayer", "doomvideo", "vplayer", "timesn", "timesd", "resolve-play", "resolve-download",
              "HmacSHA", "AES/GCM", "AES/CBC", "ECDSA", "SecretKeySpec", "PBKDF2",
              "/api/v", "/api/player", "x-t", "x-b", "x-p", "m-a", "watch_token", "prepare_token"
          )

          for df in dex_files:
              if "_23436.dex" in df or "_12840.dex" in df:
                  continue
              print(f"\n================ {df} ================")
              d = DEX(open(df, "rb").read())
              strs = d.get_strings()
              print(f"Total strings: {len(strs)}")
              hex32 = [s for s in strs if re_hex32.match(s)]
              hex24 = [s for s in strs if re_hex24.match(s)]
              print(f"HEX32 ({len(hex32)}):", hex32)
              print(f"HEX24 ({len(hex24)}):", hex24)
              hits = [s for s in strs if any(k in s for k in keywords) and len(s) < 300]
              print(f"Keyword hits ({len(hits)}):")
              for h in sorted(set(hits)):
                  print("  STR:", repr(h))
          PY

          mkdir -p /tmp/re/jadx_tm1092 /tmp/re/r4_defpkg
          DEXS=$(find /tmp/re/dumped_1092 -name "dump_00[0-3]_*.dex" | sort)
          /tmp/re/jadx/bin/jadx -j 4 -d /tmp/re/jadx_tm1092 $DEXS || true

          python3 - <<'PY'
          import os, re, shutil

          src_dir = "/tmp/re/jadx_tm1092/sources/defpackage"
          out_dir = "/tmp/re/r4_defpkg"
          os.makedirs(out_dir, exist_ok=True)

          explicit = {
              "fx", "y52", "lb9", "bb8", "q00", "de9", "ek2", "ro", "dk2", "f18",
              "kv", "jw6", "hx6", "cw9", "dw9", "jy8", "uc1", "tc1", "g92",
              "bj2", "dj2", "ej2", "fj2", "gj2", "hj2", "ij2", "jj2", "kj2", "lj2",
              "mj2", "nj2", "oj2", "pj2", "qj2", "rj2", "wj2"
          }

          high_value_terms = (
              "retrofit2.", "okhttp3.Interceptor", "CertificatePinner", "X509TrustManager",
              "HostnameVerifier", "javax.crypto", "HmacSHA", "AES/GCM", "GCMParameterSpec",
              "SecretKeySpec", "KeyPairGenerator", "AndroidKeyStore", "ECDSA",
              "apks.lol", "devmagics", "tmovies", "subtools", "timesn", "timesd",
              "doomplayer", "doomvideo", "vplayer", "resolve-play", "resolve-download",
              "60129f", "6a5216", "hm25", "1.0.6.5", "PBKDF2", "Mac.getInstance", "Cipher.getInstance",
              "com.protector", "VidStream", "MediaV2", "MediaGrant", "MediaQualit",
              "FreeDownload", "WKI", "WKC", "AHMRS", "HMRS", "CategoryPageWorkList",
              "GenrePageWorkList", "SearchTripleResponse", "ApiPageResult", "ApiWorkResult",
              "ApiSearchPageResult", "DeviceKey", "AppData", "AST", "DWI", "EDWI", "SubtitleTrack"
          )

          selected = set()
          core_seeds = set()
          re_imp = re.compile(r"import defpackage\.([A-Za-z0-9_$]+);")

          all_files = {}
          if os.path.isdir(src_dir):
              for fn in os.listdir(src_dir):
                  if not fn.endswith(".java"):
                      continue
                  cls = fn[:-5]
                  p = os.path.join(src_dir, fn)
                  with open(p, "r", encoding="utf-8", errors="ignore") as f:
                      txt = f.read()
                  all_files[cls] = txt

                  if cls in explicit:
                      selected.add(cls)
                      core_seeds.add(cls)
                      continue

                  if any(t in txt for t in high_value_terms):
                      # Skip pure Compose UI lambdas unless they touch player/intents/ViewModel/repo
                      if "androidx.compose." in txt and not any(k in txt for k in (
                          "Intent", "Uri", "times", "doom", "vplayer", "Base64", "fx", "bb8",
                          "Interceptor", "Cipher", "Mac", "SecretKey", "HttpUrl", "Request"
                      )):
                          continue
                      selected.add(cls)
                      if any(t in txt for t in (
                          "retrofit2.", "okhttp3.Interceptor", "javax.crypto", "HmacSHA",
                          "AES/GCM", "GCMParameterSpec", "SecretKeySpec", "apks.lol",
                          "devmagics", "timesn", "timesd", "doomplayer", "doomvideo", "vplayer"
                      )):
                          core_seeds.add(cls)
                  elif "com.extremeqr.proapps" in txt and "androidx.compose." not in txt:
                      selected.add(cls)

          # Expand 2 hops from core_seeds (fx, bb8, q00, interceptors, crypto, network modules)
          frontier = set(core_seeds)
          for hop in range(2):
              nxt = set()
              for cls in frontier:
                  txt = all_files.get(cls, "")
                  for m in re_imp.finditer(txt):
                      dep = m.group(1)
                      if dep in all_files and dep not in selected:
                          dtxt = all_files[dep]
                          if "androidx.compose." not in dtxt and len(dtxt) < 120000:
                              selected.add(dep)
                              nxt.add(dep)
              frontier = nxt

          print(f"Selected {len(selected)} defpackage classes out of {len(all_files)}")
          with open("/tmp/re/report/selected_defpkg.txt", "w") as f:
              for cls in sorted(selected):
                  f.write(cls + "\n")
                  shutil.copy2(os.path.join(src_dir, cls + ".java"), os.path.join(out_dir, cls + ".java"))
          PY

          tar -czf /tmp/re/r4_bundle.tar.gz -C /tmp/re report r4_defpkg
          ls -lh /tmp/re/r4_bundle.tar.gz

          python3 - <<'PY'
          import os, base64, json, subprocess

          repo = os.environ["GITHUB_REPOSITORY"]
          sha = os.environ["GITHUB_SHA"]

          def upload_tar(path, prefix):
              if not os.path.exists(path):
                  return
              with open(path, "rb") as f:
                  b64 = base64.b64encode(f.read()).decode("ascii")
              chunk_sz = 60000
              chunks = [b64[i:i+chunk_sz] for i in range(0, len(b64), chunk_sz)]
              print(f"Uploading {prefix}: {len(b64)} b64 chars in {len(chunks)} chunks")
              for idx, ch in enumerate(chunks[:55]):
                  payload = {
                      "name": f"{prefix}-{idx:02d}",
                      "head_sha": sha,
                      "status": "completed",
                      "conclusion": "success",
                      "output": {
                          "title": f"{prefix} part {idx+1}/{len(chunks)}",
                          "summary": f"total={len(chunks)} size={len(b64)}",
                          "text": ch
                      }
                  }
                  p = subprocess.run(
                      ["gh", "api", f"repos/{repo}/check-runs", "--method", "POST", "--input", "-"],
                      input=json.dumps(payload).encode("utf-8"),
                      capture_output=True
                  )
                  if p.returncode != 0:
                      print("ERR:", p.stderr.decode("utf-8", "ignore")[:300])

          upload_tar("/tmp/re/r4_bundle.tar.gz", "r4-tm")
          PY
