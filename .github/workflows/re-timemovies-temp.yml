name: Inspect TimeMovies Temp

on:
  push:
    branches:
      - 'arena/5a5a9059-mehdigm-stream'
    paths:
      - '.github/workflows/re-timemovies-temp.yml'

permissions:
  contents: read
  checks: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17 & Python tools
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install jadx, pillow, pyelftools, capstone, and download APKs
        run: |
          set -e
          pip install -q pillow pyelftools capstone androguard cryptography
          mkdir -p /tmp/re/jadx /tmp/re/out /tmp/re/report
          curl -sSL https://github.com/skylot/jadx/releases/download/v1.5.1/jadx-1.5.1.zip -o /tmp/re/jadx.zip
          unzip -q /tmp/re/jadx.zip -d /tmp/re/jadx
          chmod +x /tmp/re/jadx/bin/jadx

          curl -sSL "https://github.com/magicsol255/timefiles/releases/download/mobile/TimeMovies.v1.0.6.5.1092-p1.apk" -o /tmp/re/TimeMovies_1092.apk
          curl -sSL "https://github.com/magicsol255/timefiles/releases/download/mobile/TimeMovies.1.0.6.5.1091-p.apk" -o /tmp/re/TimeMovies_1091.apk
          curl -sSL "https://github.com/magicsol255/timefiles/releases/download/player/DoomVideoPlayer.v1.0.6.7.build.1126.apk" -o /tmp/re/DoomPlayer_1126.apk
          curl -sSL "https://codeload.github.com/magicsol255/timefiles/zip/refs/heads/main" -o /tmp/re/timefiles_main.zip
          unzip -q /tmp/re/timefiles_main.zip -d /tmp/re/main_repo
          cp /tmp/re/main_repo/timefiles-main/TimeMovies.v1.0.6.3.build.1083-p1.apk /tmp/re/TimeMovies_1083.apk
          ls -lh /tmp/re/*.apk

      - name: Static analysis of 1092, 1091, & Protector + Icon extraction
        run: |
          python3 - <<'PY' > /tmp/re/report/protector_static.txt 2>&1
          import zipfile, os, json, struct
          from PIL import Image
          import io
          from androguard.core.axml import AXMLPrinter

          for name, path in [("1092", "/tmp/re/TimeMovies_1092.apk"), ("1091", "/tmp/re/TimeMovies_1091.apk")]:
              print(f"================ {name} ================")
              z = zipfile.ZipFile(path)
              names = z.namelist()
              print("DEX:", [n for n in names if n.endswith(".dex")])
              print("SO:", [n for n in names if n.endswith(".so")])
              print("ASSETS:", [n for n in names if n.startswith("assets/")])
              try:
                  axml = AXMLPrinter(z.read("AndroidManifest.xml")).get_xml().decode("utf-8", "replace")
                  for line in axml.splitlines()[:45]:
                      print("  MAN:", line[:220])
              except Exception as e:
                  print("  MAN err:", e)
              if "assets/rasplab_protector_identity.json" in names:
                  print("IDENTITY JSON:", z.read("assets/rasplab_protector_identity.json").decode("utf-8", "replace"))
              if "assets/so_integrity.dat" in names:
                  d = z.read("assets/so_integrity.dat")
                  print("so_integrity.dat len=", len(d), "head=", d[:128].hex(), "ascii=", repr(d[:128]))
              if "assets/payload.dat" in names:
                  d = z.read("assets/payload.dat")
                  print("payload.dat len=", len(d), "head256=", d[:256].hex(), "ascii=", repr(d[:128]))
              if name == "1092":
                  # Extract launcher icons (.png or .webp)
                  icon_cands = [n for n in names if ("mipmap" in n or "launcher" in n or "logo" in n) and (n.endswith(".png") or n.endswith(".webp"))]
                  print("ICON CANDIDATES:", icon_cands)
                  best = None
                  best_px = 0
                  for ic in icon_cands:
                      if "foreground" in ic or "monochrome" in ic or "background" in ic:
                          continue
                      try:
                          im = Image.open(io.BytesIO(z.read(ic)))
                          px = im.size[0] * im.size[1]
                          print(f"  icon {ic}: {im.size} {im.mode}")
                          if px > best_px:
                              best_px = px
                              best = (ic, im)
                      except Exception:
                          pass
                  if best:
                      os.makedirs("/tmp/re/report/icons", exist_ok=True)
                      best[1].save("/tmp/re/report/icons/TimeMovies_icon.png", format="PNG")
                      print("Saved best icon from", best[0])
                  for ic in icon_cands:
                      if any(k in ic for k in ["xxxhdpi", "xxhdpi", "launcher", "logo"]):
                          try:
                              im = Image.open(io.BytesIO(z.read(ic)))
                              safe = ic.replace("/", "_") + ".png"
                              os.makedirs("/tmp/re/report/icons", exist_ok=True)
                              im.save("/tmp/re/report/icons/" + safe, format="PNG")
                          except Exception:
                              pass
                  if "lib/x86_64/libprotector.so" in names:
                      os.makedirs("/tmp/re/report/prot_bin", exist_ok=True)
                      os.makedirs("/tmp/re/so1092", exist_ok=True)
                      so_bytes = z.read("lib/x86_64/libprotector.so")
                      open("/tmp/re/so1092/libprotector.so", "wb").write(so_bytes)
                      if len(so_bytes) < 2_500_000:
                          open("/tmp/re/report/prot_bin/libprotector_x64.so", "wb").write(so_bytes)
                  if "assets/payload.dat" in names:
                      p_bytes = z.read("assets/payload.dat")
                      os.makedirs("/tmp/re/report/prot_bin", exist_ok=True)
                      open("/tmp/re/report/prot_bin/payload_head64k.bin", "wb").write(p_bytes[:65536])
                      open("/tmp/re/report/prot_bin/payload_tail4k.bin", "wb").write(p_bytes[-4096:])
          PY
          if [ -f /tmp/re/so1092/libprotector.so ]; then
            echo "=== libprotector.so dynamic symbols ===" >> /tmp/re/report/protector_static.txt
            nm -D /tmp/re/so1092/libprotector.so | head -n 120 >> /tmp/re/report/protector_static.txt || true
            echo "=== libprotector.so interesting strings ===" >> /tmp/re/report/protector_static.txt
            strings -n 5 /tmp/re/so1092/libprotector.so | grep -E -i "payload|dex|tm_|af5|af7|http|api|magic|time|rasp|emu|qemu|goldfish|sdk_gphone|key|gcm|hmac|secret" | head -n 200 >> /tmp/re/report/protector_static.txt || true
          fi
          head -n 120 /tmp/re/report/protector_static.txt

      - name: Decompile DoomPlayer_1126 full app code with jadx
        run: |
          mkdir -p /tmp/re/jadx_dp
          /tmp/re/jadx/bin/jadx -j 4 --show-bad-code -d /tmp/re/jadx_dp /tmp/re/DoomPlayer_1126.apk || true
          python3 - <<'PY'
          import os, shutil

          src_root = "/tmp/re/jadx_dp/sources/com/doomvideo/players"
          dst_root = "/tmp/re/dp_clean/com/doomvideo/players"
          skip_Substrings = [
              "/R.java", "DaggerDoomPlayerApp", "Hilt_", "_HiltModules", "_Factory.java",
              "_GeneratedInjector.java", "_MembersInjector.java", "_Impl.java",
              "ComposableSingletons$", "/ads/", "/data/local/", "/data/audio/",
              "/ui/screens/media/music/", "/ui/screens/videolist/", "/ui/screens/home/folder/",
              "/common/permission/", "/common/awesomeDialog/"
          ]
          count = 0
          total_bytes = 0
          for root, _, files in os.walk(src_root):
              for f in sorted(files):
                  if not f.endswith(".java"):
                      continue
                  full = os.path.join(root, f)
                  rel = os.path.relpath(full, "/tmp/re/jadx_dp/sources")
                  if any(s in full for s in skip_Substrings):
                      continue
                  out = os.path.join("/tmp/re/dp_clean", rel)
                  os.makedirs(os.path.dirname(out), exist_ok=True)
                  shutil.copyfile(full, out)
                  count += 1
                  total_bytes += os.path.getsize(full)
          print(f"Copied {count} clean DoomPlayer files ({total_bytes} bytes)")
          PY

      - name: Compile NDK memory DEX + TMSTRV1 dumper
        run: |
          NDK_CC=$(find $ANDROID_HOME/ndk -name "x86_64-linux-android30-clang" | sort | tail -n 1)
          echo "Using NDK CC: $NDK_CC"
          cat << 'EOF' > /tmp/re/dexdump_mem.c
          #define _LARGEFILE64_SOURCE
          #include <stdio.h>
          #include <stdlib.h>
          #include <stdint.h>
          #include <string.h>
          #include <fcntl.h>
          #include <unistd.h>

          static uint32_t ru32(const uint8_t *p) {
              return (uint32_t)p[0] | ((uint32_t)p[1]<<8) | ((uint32_t)p[2]<<16) | ((uint32_t)p[3]<<24);
          }

          int main(int argc, char **argv) {
              if (argc < 3) return 1;
              int pid = atoi(argv[1]);
              const char *outdir = argv[2];
              char maps_path[128], mem_path[128];
              snprintf(maps_path, sizeof(maps_path), "/proc/%d/maps", pid);
              snprintf(mem_path, sizeof(mem_path), "/proc/%d/mem", pid);
              FILE *maps = fopen(maps_path, "r");
              int mem = open(mem_path, O_RDONLY);
              if (!maps || mem < 0) { perror("open proc"); return 2; }
              char line[1024];
              int found = 0, strfound = 0;
              while (fgets(line, sizeof(line), maps)) {
                  unsigned long start, end;
                  char perms[8];
                  if (sscanf(line, "%lx-%lx %4s", &start, &end, perms) != 3) continue;
                  if (perms[0] != 'r') continue;
                  if (strstr(line, "/system/") || strstr(line, "/apex/") || strstr(line, "/vendor/") || strstr(line, "/dev/")) continue;
                  size_t region_size = end - start;
                  if (region_size < 0x70 || region_size > 256 * 1024 * 1024) continue;
                  uint8_t *buf = malloc(region_size);
                  if (!buf) continue;
                  ssize_t n = pread64(mem, buf, region_size, (off64_t)start);
                  if (n > 0x78) {
                      for (size_t off = 0; off + 0x78 <= (size_t)n; off += 4) {
                          if (memcmp(buf + off, "TMSTRV1\0", 8) == 0 && off + 116 <= (size_t)n) {
                              uint32_t ver = ru32(buf + off + 8);
                              uint32_t rcnt = ru32(buf + off + 112);
                              if (ver == 2 && rcnt > 0 && rcnt < 100000) {
                                  size_t cur = off + 116;
                                  int ok = 1;
                                  for (uint32_t r = 0; r < rcnt; r++) {
                                      if (cur + 76 > (size_t)n) { ok = 0; break; }
                                      uint32_t ctlen = ru32(buf + cur + 72);
                                      if (ctlen > 1024 * 1024 || cur + 76 + ctlen > (size_t)n) { ok = 0; break; }
                                      cur += 76 + ctlen;
                                  }
                                  if (ok) {
                                      char outpath[512];
                                      snprintf(outpath, sizeof(outpath), "%s/tm_strings_%d.dat", outdir, strfound++);
                                      FILE *out = fopen(outpath, "wb");
                                      if (out) {
                                          fwrite(buf + off, 1, cur - off, out);
                                          fclose(out);
                                          printf("Dumped TMSTRV1 %s (%zu bytes, %u records)\n", outpath, cur - off, rcnt);
                                      }
                                  }
                              }
                          }
                          uint32_t file_size = *(uint32_t *)(buf + off + 0x20);
                          uint32_t header_size = *(uint32_t *)(buf + off + 0x24);
                          uint32_t endian_tag = *(uint32_t *)(buf + off + 0x28);
                          uint32_t string_ids_size = *(uint32_t *)(buf + off + 0x38);
                          uint32_t class_defs_size = *(uint32_t *)(buf + off + 0x60);
                          int is_dex = 0;
                          if (memcmp(buf + off, "dex\n0", 5) == 0 && buf[off + 7] == 0 && (header_size == 0x70 || header_size == 0x78) && endian_tag == 0x12345678) {
                              is_dex = 1;
                          } else if ((header_size == 0x70 || header_size == 0x78) && endian_tag == 0x12345678 &&
                                     file_size > 0x1000 && file_size < 80 * 1024 * 1024 &&
                                     string_ids_size > 10 && string_ids_size < 2000000 &&
                                     class_defs_size > 0 && class_defs_size < 500000) {
                              is_dex = 2;
                          }
                          if (is_dex) {
                              uint32_t dump_sz = file_size;
                              if (header_size == 0x78) {
                                  uint32_t cont_sz = *(uint32_t *)(buf + off + 0x70);
                                  uint32_t hdr_off = *(uint32_t *)(buf + off + 0x74);
                                  if (hdr_off == 0 && cont_sz >= file_size && cont_sz < 120 * 1024 * 1024) {
                                      dump_sz = cont_sz;
                                  }
                              }
                              if (dump_sz > 0x70 && dump_sz < 120 * 1024 * 1024) {
                                  size_t avail = (size_t)n - off;
                                  size_t to_write = dump_sz <= avail ? dump_sz : avail;
                                  char outpath[512];
                                  snprintf(outpath, sizeof(outpath), "%s/dump_%03d_%lx_%u.dex", outdir, found++, start + off, dump_sz);
                                  FILE *out = fopen(outpath, "wb");
                                  if (out) {
                                      uint8_t hdr[8];
                                      memcpy(hdr, header_size == 0x78 ? "dex\n041\0" : "dex\n039\0", 8);
                                      if (is_dex == 2) {
                                          fwrite(hdr, 1, 8, out);
                                          fwrite(buf + off + 8, 1, to_write - 8, out);
                                      } else {
                                          fwrite(buf + off, 1, to_write, out);
                                      }
                                      fclose(out);
                                      printf("Dumped %s (mode=%d, size=%zu/%u) from %s", outpath, is_dex, to_write, dump_sz, line);
                                  }
                                  if (header_size == 0x78 && dump_sz > file_size) {
                                      off += ((dump_sz > 4 ? dump_sz : 4) - 4) & ~3UL;
                                  } else if (dump_sz > 0x1000) {
                                      off += ((file_size > 4 ? file_size : 4) - 4) & ~3UL;
                                  }
                              }
                          }
                      }
                  }
                  free(buf);
              }
              fclose(maps);
              close(mem);
              return 0;
          }
          EOF
          $NDK_CC -O2 -static /tmp/re/dexdump_mem.c -o /tmp/re/dexdump_mem

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Android Emulator (API 33 google_apis x86_64) to unpack 1092 & 1083
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          profile: pixel_5
          ram-size: 4096M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            set +e
            exec > /tmp/re/report/emu_trace.txt 2>&1
            echo "=== Emulator booted ==="
            adb root || true
            sleep 2
            adb push /tmp/re/dexdump_mem /data/local/tmp/dexdump_mem
            adb shell "chmod 755 /data/local/tmp/dexdump_mem && mkdir -p /data/local/tmp/tm1092 /data/local/tmp/tm1083"

            echo "=== Installing 1092 (com.extremeqr.proapps) ==="
            adb install -r /tmp/re/TimeMovies_1092.apk
            adb logcat -c || true
            adb shell "setprop debug.tm.af7.selftest 1" || true
            adb shell am start -n com.extremeqr.proapps/com.extremeqr.proapps.ui.screens.activity.MainActivity
            for delay in 0.2 0.5 1.5 4 6; do
              sleep $delay
              PID92=$(adb shell pidof com.extremeqr.proapps | tr -d '\r')
              echo "1092 check ($delay s): PID=$PID92"
              if [ -n "$PID92" ]; then
                adb shell "/data/local/tmp/dexdump_mem $PID92 /data/local/tmp/tm1092"
                adb shell "cat /proc/$PID92/maps" > /tmp/re/report/maps_1092.txt
                adb shell "ls -laR /data/data/com.extremeqr.proapps /data/user/0/com.extremeqr.proapps/code_cache" > /tmp/re/report/files_1092.txt
              fi
            done
            adb logcat -d > /tmp/re/report/logcat_1092.txt
            mkdir -p /tmp/re/dumped_1092
            adb pull /data/local/tmp/tm1092 /tmp/re/dumped_1092/ || true

            echo "=== Installing 1091 ==="
            adb install -r /tmp/re/TimeMovies_1091.apk
            PKG91=$(adb shell pm list packages -3 | tr -d '\r' | sed 's/package://g' | grep -v extremeqr || true)
            echo "Third-party packages after 1091: $PKG91"

            echo "=== Installing 1083 (com.funpainty.funtime) ==="
            adb install -r /tmp/re/TimeMovies_1083.apk
            adb logcat -c || true
            adb shell monkey -p com.funpainty.funtime -c android.intent.category.LAUNCHER 1
            sleep 10
            PID83=$(adb shell pidof com.funpainty.funtime | tr -d '\r')
            echo "1083 PID=$PID83"
            if [ -n "$PID83" ]; then
              adb shell "/data/local/tmp/dexdump_mem $PID83 /data/local/tmp/tm1083"
              adb shell "ls -laR /data/data/com.funpainty.funtime" > /tmp/re/report/files_1083.txt
            fi
            adb logcat -d > /tmp/re/report/logcat_1083.txt
            mkdir -p /tmp/re/dumped_1083
            adb pull /data/local/tmp/tm1083 /tmp/re/dumped_1083/ || true
            exit 0

      - name: Decrypt TMSTRV1 strings, decompile dumped DEXs, and publish check-run bundles
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ls -laR /tmp/re/dumped_1092 /tmp/re/dumped_1083 /tmp/re/report || true

          # Decrypt any tm_strings_*.dat files using StringBridge V2 AES-GCM
          python3 - <<'PY'
          import glob, struct, json, os
          from cryptography.hazmat.primitives.ciphers.aead import AESGCM

          DOMAIN_STRING = b"TM_DEX_STRING_V1"
          for p in sorted(glob.glob("/tmp/re/dumped_1092/**/tm_strings_*.dat", recursive=True)):
              data = open(p, "rb").read()
              if data[:8] != b"TMSTRV1\x00":
                  continue
              ver = struct.unpack_from("<I", data, 8)[0]
              key = data[16:48]
              pkg_hash = data[48:80]
              cert_hash = data[80:112]
              rcnt = struct.unpack_from("<I", data, 112)[0]
              aes = AESGCM(key)
              out = {}
              off = 116
              for _ in range(rcnt):
                  rid = struct.unpack_from("<i", data, off)[0]
                  owner = struct.unpack_from("<q", data, off + 4)[0]
                  nonce = data[off + 44 : off + 56]
                  tag = data[off + 56 : off + 72]
                  ctlen = struct.unpack_from("<i", data, off + 72)[0]
                  ct = data[off + 76 : off + 76 + ctlen]
                  off += 76 + ctlen
                  aad = bytearray(96)
                  aad[0:16] = DOMAIN_STRING
                  aad[16:48] = pkg_hash
                  aad[48:80] = cert_hash
                  struct.pack_into("<qII", aad, 80, owner, rid & 0xffffffff, ver)
                  try:
                      pt = aes.decrypt(nonce, ct + tag, bytes(aad)).decode("utf-8", "replace")
                      out[str(rid)] = pt
                  except Exception as e:
                      out[str(rid)] = f"<ERR:{e}>"
              out_json = "/tmp/re/report/" + os.path.basename(p) + ".json"
              json.dump(out, open(out_json, "w"), ensure_ascii=False, indent=2)
              print(f"Decrypted {len(out)} strings from {p} -> {out_json}")
          PY

          mkdir -p /tmp/re/jadx_1092 /tmp/re/jadx_1083
          for d in $(find /tmp/re/dumped_1092 -name "*.dex" 2>/dev/null | sort); do
            sz=$(stat -c%s "$d")
            if [ "$sz" -gt 10000 ]; then
              /tmp/re/jadx/bin/jadx -j 4 --show-bad-code -d /tmp/re/jadx_1092 "$d" || true
            fi
          done
          for d in $(find /tmp/re/dumped_1083 -name "*.dex" 2>/dev/null | sort); do
            sz=$(stat -c%s "$d")
            if [ "$sz" -gt 10000 ]; then
              /tmp/re/jadx/bin/jadx -j 4 --show-bad-code -d /tmp/re/jadx_1083 "$d" || true
            fi
          done

          python3 - <<'PY'
          import os, shutil, tarfile, base64, json, subprocess

          skip_subs = ["/R.java", "Dagger", "Hilt_", "_HiltModules", "_Factory.java", "_GeneratedInjector.java", "_MembersInjector.java", "_Impl.java", "ComposableSingletons$"]

          for tag, src_base, pkg_sub in [
              ("tm1092", "/tmp/re/jadx_1092/sources", "extremeqr"),
              ("tm1083", "/tmp/re/jadx_1083/sources", "funpainty"),
          ]:
              dst_base = f"/tmp/re/clean_{tag}"
              os.makedirs(dst_base, exist_ok=True)
              idx = []
              if os.path.isdir(src_base):
                  for root, _, files in os.walk(src_base):
                      for f in sorted(files):
                          if not f.endswith(".java"):
                              continue
                          full = os.path.join(root, f)
                          rel = os.path.relpath(full, src_base)
                          idx.append(rel)
                          if (pkg_sub in rel or "protector" in rel or "funtime" in rel or "proapps" in rel or "vplayer" in rel or "doomvideo" in rel) and not any(s in full for s in skip_subs):
                              out = os.path.join(dst_base, rel)
                              os.makedirs(os.path.dirname(out), exist_ok=True)
                              shutil.copyfile(full, out)
              open(f"/tmp/re/report/index_{tag}.txt", "w").write("\n".join(idx))
              print(f"{tag}: total_classes={len(idx)}")

          with tarfile.open("/tmp/re/r2_report_and_tm.tar.gz", "w:gz") as tf:
              tf.add("/tmp/re/report", arcname="report")
              if os.path.isdir("/tmp/re/clean_tm1092"):
                  tf.add("/tmp/re/clean_tm1092", arcname="clean_tm1092")
              if os.path.isdir("/tmp/re/clean_tm1083"):
                  tf.add("/tmp/re/clean_tm1083", arcname="clean_tm1083")

          with tarfile.open("/tmp/re/r2_dp_clean.tar.gz", "w:gz") as tf:
              if os.path.isdir("/tmp/re/dp_clean"):
                  tf.add("/tmp/re/dp_clean", arcname="dp_clean")

          sha = os.environ.get("GITHUB_SHA")
          repo = os.environ.get("GITHUB_REPOSITORY")

          def upload_tar(tar_path, prefix):
              b64 = base64.b64encode(open(tar_path, "rb").read()).decode("ascii")
              chunk_size = 60000
              chunks = [b64[i:i+chunk_size] for i in range(0, len(b64), chunk_size)]
              print(f"Uploading {tar_path}: {len(b64)} b64 chars in {len(chunks)} chunks")
              for idx, ch in enumerate(chunks[:30]):
                  payload = {
                      "name": f"{prefix}-{idx:02d}",
                      "head_sha": sha,
                      "status": "completed",
                      "conclusion": "success",
                      "output": {
                          "title": f"{prefix} {idx+1}/{len(chunks)}",
                          "summary": f"total={len(chunks)} size={len(b64)}",
                          "text": ch
                      }
                  }
                  open("/tmp/re/cp.json", "w").write(json.dumps(payload))
                  subprocess.run(["gh", "api", "-X", "POST", f"repos/{repo}/check-runs", "--input", "/tmp/re/cp.json"], check=False)

          upload_tar("/tmp/re/r2_report_and_tm.tar.gz", "r2-tm")
