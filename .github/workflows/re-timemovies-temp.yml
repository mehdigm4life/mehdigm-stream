                      s0 = wj["ss"][0]
                      ss_id = (s0.get("ss") or {}).get("_id")
                      eps = s0.get("eps") or []
                      if eps:
                          ep_id = eps[0].get("_id")
                          fc = eps[0].get("fc") or fc
                          print(f"First episode: ep_id={ep_id}, fc={fc}, ss_id={ss_id}, sample={json.dumps(eps[0], ensure_ascii=False)[:700]}")

                  rq = c.req("POST", "media/qualities", json_body={
                      "work_id": wid,
                      "episode_id": ep_id,
                      "action": "watch",
                  })
                  print(f"media/qualities({kind}):", rq.status_code, rq.text[:1000])

                  for action in ["watch", "download"]:
                      for target in ["internal", "external"]:
                          rg = c.req("POST", "media/grant", json_body={
                              "work_id": wid,
                              "version": 1,
                              "episode_id": ep_id,
                              "action": action,
                              "quality": None,
                              "executor_target": target,
                              "player_installed": True,
                              "client_attempt_key": str(uuid.uuid4()),
                              "season_id": ss_id,
                          })
                          print(f"media/grant({kind}, {action}, {target}):", rg.status_code, rg.text[:1500])
                          if rg.status_code == 200:
                              gj = rg.json()
                              gd = gj.get("result") or gj
                              if not isinstance(gd, dict):
                                  continue
                              ext = gd.get("external") or {}
                              ticket = ext.get("ticket") if isinstance(ext, dict) else None
                              grant = gd.get("grant")
                              if ticket:
                                  dp_ep = "resolve-download" if action == "download" else "resolve-play"
                                  rdp = requests.post(
                                      f"https://api.apks.lol/api/player/v1.6/app/{dp_ep}",
                                      headers={
                                          "ai": "6a5216d91e12eeadc194ab91",
                                          "x-b": "1065",
                                          "Content-Type": "application/json",
                                          "User-Agent": "okhttp/4.12.0",
                                      },
                                      json={"src": ticket},
                                      timeout=20,
                                  )
                                  print(f"  DoomPlayer {dp_ep}:", rdp.status_code, rdp.text[:1500])
                                  if rdp.status_code == 200:
                                      dpd = (rdp.json().get("result") or rdp.json().get("data") or rdp.json())
                                      murl = dpd.get("url") if isinstance(dpd, dict) else None
                                      if murl and ".m3u8" in murl:
                                          rm3u = requests.get(murl, timeout=15)
                                          print(f"  M3U8 ({rm3u.status_code}):\n{rm3u.text[:2000]}")
                              if grant:
                                  v2_ep = "download" if action == "download" else "manifest"
                                  rv2 = requests.post(
                                      f"https://api.apks.lol/v2/media/{v2_ep}",
                                      headers={"X-Media-Grant": grant, "User-Agent": "okhttp/4.12.0"},
                                      timeout=20,
                                  )
                                  print(f"  v2/media/{v2_ep}:", rv2.status_code, rv2.text[:1500])
          PY

      - name: Publish Probe Report via Check Runs
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import base64, gzip, os, requests
          raw = open("/tmp/probe_out/probe_report.txt", "rb").read()
          b64 = base64.b64encode(gzip.compress(raw, 9)).decode("ascii")
          repo = os.environ["REPO"]
          sha = os.environ["SHA"]
          tok = os.environ["GH_TOKEN"]
          CHUNK = 60000
          parts = [b64[i:i+CHUNK] for i in range(0, len(b64), CHUNK)] or [""]
          for idx, part in enumerate(parts):
              r = requests.post(
                  f"https://api.github.com/repos/{repo}/check-runs",
                  headers={
                      "Authorization": f"Bearer {tok}",
                      "Accept": "application/vnd.github+json",
                  },
                  json={
                      "name": f"probe-r7-part-{idx:02d}",
                      "head_sha": sha,
                      "status": "completed",
                      "conclusion": "success",
                      "output": {
                          "title": f"part {idx+1}/{len(parts)} ({len(raw)}B)",
                          "summary": f"total_parts={len(parts)}",
                          "text": part,
                      },
                  },
                  timeout=20,
              )
              print("check-run", idx, r.status_code)
          PY
