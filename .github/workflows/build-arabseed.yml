name: Build ArabSeed Plugin

on:
  workflow_dispatch:
  push:
    paths:
      - 'ArabSeed/**'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build ArabSeed plugin
        run: ./gradlew :ArabSeed:make

      - name: Upload ArabSeed.cs3 artifact
        uses: actions/upload-artifact@v4
        with:
          name: ArabSeed
          path: ArabSeed/build/ArabSeed.cs3

      - name: Commit and push built cs3 to build/
        run: |
          if [ -f "ArabSeed/build/ArabSeed.cs3" ]; then
            cp ArabSeed/build/ArabSeed.cs3 build/ArabSeed.cs3
            git config --local user.email "github-actions[bot]@users.noreply.github.com"
            git config --local user.name "github-actions[bot]"
            git add build/ArabSeed.cs3
            if ! git diff --staged --quiet; then
              git commit -m "🤖 Build ArabSeed.cs3"
              git push
            else
              echo "No changes to commit"
            fi
          else
            echo "ArabSeed.cs3 not found!"
          fi
