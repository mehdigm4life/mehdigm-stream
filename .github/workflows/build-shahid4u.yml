name: Build Shahid4u Plugin

on:
  workflow_dispatch:
  push:
    paths:
      - 'Shahid4u/**'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Shahid4u plugin
        run: ./gradlew :Shahid4u:make

      - name: Upload Shahid4u.cs3 artifact
        uses: actions/upload-artifact@v4
        with:
          name: Shahid4u
          path: Shahid4u/build/Shahid4u.cs3

      - name: Commit and push built cs3 to build/
        run: |
          if [ -f "Shahid4u/build/Shahid4u.cs3" ]; then
            cp Shahid4u/build/Shahid4u.cs3 build/Shahid4u.cs3
            git config --local user.email "github-actions[bot]@users.noreply.github.com"
            git config --local user.name "github-actions[bot]"
            git add -f build/Shahid4u.cs3
            if ! git diff --staged --quiet; then
              git commit -m "🤖 Build Shahid4u.cs3"
              git push
            else
              echo "No changes to commit"
            fi
          else
            echo "Shahid4u.cs3 not found!"
          fi