name: 🤖 OpenCode AI Cloud (Web)

# يعمل هذا الـ workflow على أي repository تضع فيه هذا الملف
# المسار المطلوب: .github/workflows/opencode.yml
# يقوم بتثبيت OpenCode AI كاملاً على Ubuntu runner ويفتح API/Web
# عبر Cloudflare Tunnel (TryCloudflare) — يطبع رابط عام يمكنك الدخول منه
# والتحدث مع النماذج وتعديل ملفات الـ repo. أي تعديل يتم commit + push تلقائياً.

on:
  workflow_dispatch:
    inputs:
      duration_minutes:
        description: "كم دقيقة يبقى السيرفر شغّال (الحد الأقصى لـ GitHub Actions = 350 دقيقة ≈ 6 ساعات)"
        required: true
        default: "350"
        type: string
      auto_commit:
        description: "هل تريد commit + push تلقائي لأي تعديلات يقوم بها opencode على الملفات؟"
        required: true
        default: true
        type: boolean
      commit_interval_seconds:
        description: "كل كم ثانية يتم فحص التغييرات وعمل commit (افتراضي 60 ثانية)"
        required: true
        default: "60"
        type: string

# نحتاج صلاحية الكتابة على المحتوى لعمل push
permissions:
  contents: write

jobs:
  opencode-web:
    name: 🚀 Run OpenCode Web + Cloudflare Tunnel
    runs-on: ubuntu-latest
    # الحد الأقصى لـ job في GitHub Actions = 360 دقيقة
    timeout-minutes: 355

    env:
      # ===== مزودات النماذج الشائعة (كلها اختيارية) =====
      OPENCODE_API_KEY:    ${{ secrets.OPENCODE_API_KEY }}
      ANTHROPIC_API_KEY:   ${{ secrets.ANTHROPIC_API_KEY }}
      OPENAI_API_KEY:      ${{ secrets.OPENAI_API_KEY }}
      GEMINI_API_KEY:      ${{ secrets.GEMINI_API_KEY }}
      GOOGLE_GENERATIVE_AI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      OPENROUTER_API_KEY:  ${{ secrets.OPENROUTER_API_KEY }}
      GROQ_API_KEY:        ${{ secrets.GROQ_API_KEY }}
      DEEPSEEK_API_KEY:    ${{ secrets.DEEPSEEK_API_KEY }}
      MISTRAL_API_KEY:     ${{ secrets.MISTRAL_API_KEY }}
      XAI_API_KEY:         ${{ secrets.XAI_API_KEY }}
      COHERE_API_KEY:      ${{ secrets.COHERE_API_KEY }}
      TOGETHER_API_KEY:    ${{ secrets.TOGETHER_API_KEY }}
      PERPLEXITY_API_KEY:  ${{ secrets.PERPLEXITY_API_KEY }}

    steps:
      # -----------------------------------------------------------------------
      # 1) جلب كود الـ repository الحالي
      # -----------------------------------------------------------------------
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      # -----------------------------------------------------------------------
      # 2) إعداد Node.js (يحتاجه opencode-ai من npm)
      # -----------------------------------------------------------------------
      - name: ⚙️ Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # -----------------------------------------------------------------------
      # 3) تثبيت الأدوات المساعدة
      # -----------------------------------------------------------------------
      - name: 🛠️ Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq curl unzip jq git ca-certificates procps

      # -----------------------------------------------------------------------
      # 4) تثبيت OpenCode عبر الطريقة الرسمية
      # -----------------------------------------------------------------------
      - name: 🤖 Install OpenCode AI (official installer)
        run: |
          set -e
          echo "::group::Installing opencode via official installer"
          curl -fsSL https://opencode.ai/install | bash
          echo "::endgroup::"

          # إضافة المسار إلى PATH للـ steps اللاحقة
          echo "$HOME/.opencode/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.opencode/bin:$PATH"

          # تثبيت احتياطي عبر npm
          echo "::group::Installing opencode-ai via npm (fallback)"
          npm install -g opencode-ai || true
          echo "::endgroup::"

          which opencode || true
          opencode --version || true

      # -----------------------------------------------------------------------
      # 5) تثبيت cloudflared
      # -----------------------------------------------------------------------
      - name: ☁️ Install cloudflared
        uses: AnimMouse/setup-cloudflared@v2

      - name: ✅ Verify cloudflared
        run: cloudflared --version

      # -----------------------------------------------------------------------
      # 6) إنشاء ملف إعدادات opencode.json
      # -----------------------------------------------------------------------
      - name: 📝 Prepare opencode config
        run: |
          if [ ! -f "opencode.json" ] && [ ! -f ".opencode/opencode.json" ]; then
            cat > opencode.json <<'JSON'
          {
            "$schema": "https://opencode.ai/config.json",
            "theme": "opencode",
            "autoshare": false,
            "autoupdate": false
          }
          JSON
            echo "Created default opencode.json"
          else
            echo "Using existing opencode config"
          fi

      # -----------------------------------------------------------------------
      # 7) ⭐ تشغيل opencode serve في الخلفية — مع الإصلاح النهائي
      #
      # سبب التعليق سابقاً: nohup … & وحده لا يفصل العملية في GitHub Actions،
      # فالـ step لا يخرج أبداً. الحل: setsid + إعادة توجيه stdin/stdout/stderr
      # + disown، وفحص /global/health (endpoint الصحيح).
      # -----------------------------------------------------------------------
      - name: 🚀 Start OpenCode web server (background)
        timeout-minutes: 5    # ⭐ ضمان عدم تعليق الخطوة أبداً
        run: |
          set -euo pipefail
          export PATH="$HOME/.opencode/bin:$PATH"

          mkdir -p "$RUNNER_TEMP/opencode-logs"
          LOG_FILE="$RUNNER_TEMP/opencode-logs/server.log"
          : > "$LOG_FILE"

          echo "Starting opencode serve on 0.0.0.0:4096 ..."

          # ⭐⭐ الإصلاح الجوهري ⭐⭐
          # setsid  : ينشئ process group جديد ويفصل العملية تماماً عن الـ runner
          # </dev/null : يغلق stdin حتى لا ينتظر input
          # >LOG 2>&1 : يعيد توجيه stdout/stderr إلى ملف فقط (لا pipe للـ runner)
          # &        : خلفية
          # disown   : إزالة الـ job من قائمة jobs الخاصة بـ bash
          setsid bash -c "opencode serve --hostname 0.0.0.0 --port 4096 --cors '*' </dev/null >>'$LOG_FILE' 2>&1" &
          OPENCODE_PID=$!
          disown || true

          echo "$OPENCODE_PID" > "$RUNNER_TEMP/opencode.pid"
          echo "OpenCode PID = $OPENCODE_PID"

          # ننتظر حتى يستجيب على المنفذ
          # نستخدم /global/health (Endpoint الرسمي للفحص حسب توثيق opencode)
          # ومعه fallback: فحص TCP فقط في حال غيّروا الـ API
          UP=0
          for i in $(seq 1 120); do
            # المحاولة 1: health endpoint الرسمي
            if curl -fsS --max-time 2 http://127.0.0.1:4096/global/health >/dev/null 2>&1; then
              UP=1; echo "✅ /global/health responded after ${i}s"; break
            fi
            # المحاولة 2: TCP فقط (المنفذ مفتوح يعني العملية حية)
            if (echo > /dev/tcp/127.0.0.1/4096) >/dev/null 2>&1; then
              # نتأكد أن السيرفر يستجيب لـ HTTP بأي status
              CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 2 http://127.0.0.1:4096/ || echo "000")
              if [ "$CODE" != "000" ]; then
                UP=1; echo "✅ opencode listening on :4096 (HTTP $CODE) after ${i}s"; break
              fi
            fi
            # تحقق أن العملية ما زالت حية أصلاً
            if ! kill -0 "$OPENCODE_PID" 2>/dev/null; then
              echo "❌ opencode process exited prematurely. Logs:"
              cat "$LOG_FILE" || true
              exit 1
            fi
            sleep 1
          done

          if [ "$UP" -ne 1 ]; then
            echo "❌ opencode failed to become reachable in 120s. Logs:"
            tail -n 200 "$LOG_FILE" || true
            # نقتل العملية الفاشلة قبل الخروج
            kill -TERM "$OPENCODE_PID" 2>/dev/null || true
            exit 1
          fi

          echo "----- last 30 lines of opencode log -----"
          tail -n 30 "$LOG_FILE" || true

      # -----------------------------------------------------------------------
      # 8) فتح Cloudflare Quick Tunnel — نفس نمط الفصل الآمن
      # -----------------------------------------------------------------------
      - name: 🌐 Start Cloudflare Quick Tunnel
        id: tunnel
        timeout-minutes: 3
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/cloudflared-logs"
          TUN_LOG="$RUNNER_TEMP/cloudflared-logs/tunnel.log"
          : > "$TUN_LOG"

          # نفس نمط setsid لضمان عدم تعليق الخطوة
          setsid bash -c "cloudflared tunnel --no-autoupdate --url http://127.0.0.1:4096 </dev/null >>'$TUN_LOG' 2>&1" &
          TUN_PID=$!
          disown || true
          echo "$TUN_PID" > "$RUNNER_TEMP/cloudflared.pid"
          echo "cloudflared PID = $TUN_PID"

          # استخراج الرابط https://*.trycloudflare.com من اللوج
          PUBLIC_URL=""
          for i in $(seq 1 90); do
            if grep -Eo 'https://[a-zA-Z0-9.-]+\.trycloudflare\.com' "$TUN_LOG" | head -n1 > /tmp/url.txt 2>/dev/null; then
              PUBLIC_URL=$(cat /tmp/url.txt || true)
              if [ -n "$PUBLIC_URL" ]; then break; fi
            fi
            if ! kill -0 "$TUN_PID" 2>/dev/null; then
              echo "❌ cloudflared exited prematurely. Logs:"
              cat "$TUN_LOG" || true
              exit 1
            fi
            sleep 1
          done

          if [ -z "$PUBLIC_URL" ]; then
            echo "❌ Failed to get tunnel URL in 90s. Tunnel log:"
            cat "$TUN_LOG"
            exit 1
          fi

          echo "PUBLIC_URL=$PUBLIC_URL" >> "$GITHUB_ENV"
          echo "public_url=$PUBLIC_URL" >> "$GITHUB_OUTPUT"

          echo ""
          echo "╔════════════════════════════════════════════════════════════════╗"
          echo "║              🎉 OpenCode AI is LIVE on the Web 🎉              ║"
          echo "╠════════════════════════════════════════════════════════════════╣"
          printf  "║  URL:  %-55s ║\n" "$PUBLIC_URL"
          printf  "║  Health: %-53s ║\n" "$PUBLIC_URL/global/health"
          echo "╚════════════════════════════════════════════════════════════════╝"
          echo ""

      # -----------------------------------------------------------------------
      # 9) كتابة الرابط في Summary
      # -----------------------------------------------------------------------
      - name: 📌 Publish URL to Job Summary
        run: |
          {
            echo "# 🤖 OpenCode AI — Live Session"
            echo ""
            echo "## 🌐 الرابط العام"
            echo ""
            echo "### 👉 [${PUBLIC_URL}](${PUBLIC_URL})"
            echo ""
            echo "- Health check: \`${PUBLIC_URL}/global/health\`"
            echo "- API docs:     \`${PUBLIC_URL}/doc\`"
            echo ""
            echo "| الحقل | القيمة |"
            echo "|------|--------|"
            echo "| **Repository** | \`${GITHUB_REPOSITORY}\` |"
            echo "| **Branch** | \`${GITHUB_REF_NAME}\` |"
            echo "| **مدة التشغيل** | ${{ github.event.inputs.duration_minutes }} دقيقة |"
            echo "| **Auto commit** | ${{ github.event.inputs.auto_commit }} |"
            echo ""
            echo "## ✏️ التعديلات"
            echo "أي تعديل تقوم به على الملفات سيتم رفعه تلقائياً (commit + push)"
            echo "إلى branch: \`${GITHUB_REF_NAME}\` كل ${{ github.event.inputs.commit_interval_seconds }} ثانية."
            echo ""
            echo "## 🛑 لإيقاف الجلسة"
            echo "اضغط على زر **Cancel workflow** في صفحة الـ Actions."
          } >> "$GITHUB_STEP_SUMMARY"

      # -----------------------------------------------------------------------
      # 10) Auto-commit loop في الخلفية — مع setsid
      # -----------------------------------------------------------------------
      - name: 🔁 Start auto-commit loop (background)
        if: ${{ github.event.inputs.auto_commit == 'true' }}
        timeout-minutes: 1
        run: |
          set -euo pipefail
          git config --global user.email "opencode-bot@users.noreply.github.com"
          git config --global user.name  "opencode-bot"

          INTERVAL="${{ github.event.inputs.commit_interval_seconds }}"
          BRANCH="${GITHUB_REF_NAME}"
          LOG="$RUNNER_TEMP/autocommit.log"
          : > "$LOG"

          cat > "$RUNNER_TEMP/autocommit.sh" <<EOF
          #!/usr/bin/env bash
          cd "$GITHUB_WORKSPACE"
          while true; do
            sleep $INTERVAL
            if [ -n "\$(git status --porcelain)" ]; then
              git add -A
              MSG="🤖 opencode: auto-commit \$(date -u +'%Y-%m-%d %H:%M:%SZ')"
              git commit -m "\$MSG" >> "$LOG" 2>&1 || true
              git push origin "$BRANCH" >> "$LOG" 2>&1 || true
              echo "[\$(date -u)] pushed: \$MSG" >> "$LOG"
            fi
          done
          EOF
          chmod +x "$RUNNER_TEMP/autocommit.sh"

          # ⭐ نفس نمط setsid + disown لمنع التعليق
          setsid bash -c "bash '$RUNNER_TEMP/autocommit.sh' </dev/null >>'$LOG' 2>&1" &
          AC_PID=$!
          disown || true
          echo "$AC_PID" > "$RUNNER_TEMP/autocommit.pid"
          echo "✅ Auto-commit loop started (PID=$AC_PID, every ${INTERVAL}s) on branch ${BRANCH}"

      # -----------------------------------------------------------------------
      # 11) إبقاء الـ job حياً للمدة المطلوبة
      # -----------------------------------------------------------------------
      - name: ⏳ Keep session alive
        run: |
          DURATION_MIN="${{ github.event.inputs.duration_minutes }}"
          DURATION_SEC=$(( DURATION_MIN * 60 ))
          echo "Session will run for ${DURATION_MIN} minutes (${DURATION_SEC}s)."
          echo "Public URL: ${PUBLIC_URL}"
          echo ""

          ELAPSED=0
          STEP=300   # 5 minutes
          while [ "$ELAPSED" -lt "$DURATION_SEC" ]; do
            sleep "$STEP"
            ELAPSED=$(( ELAPSED + STEP ))
            REMAIN_MIN=$(( (DURATION_SEC - ELAPSED) / 60 ))
            echo "⏱️ Heartbeat — elapsed=$((ELAPSED/60))min  remaining=${REMAIN_MIN}min"
            echo "🌐 ${PUBLIC_URL}"

            if [ -f "$RUNNER_TEMP/opencode.pid" ] && ! kill -0 "$(cat $RUNNER_TEMP/opencode.pid)" 2>/dev/null; then
              echo "⚠️ opencode process died — exiting."
              exit 1
            fi
            if [ -f "$RUNNER_TEMP/cloudflared.pid" ] && ! kill -0 "$(cat $RUNNER_TEMP/cloudflared.pid)" 2>/dev/null; then
              echo "⚠️ cloudflared process died — exiting."
              exit 1
            fi
          done

          echo "✅ Session duration reached. Shutting down."

      # -----------------------------------------------------------------------
      # 12) commit أخير
      # -----------------------------------------------------------------------
      - name: 💾 Final commit & push
        if: ${{ always() && github.event.inputs.auto_commit == 'true' }}
        run: |
          cd "$GITHUB_WORKSPACE"
          git config --global user.email "opencode-bot@users.noreply.github.com"
          git config --global user.name  "opencode-bot"
          if [ -n "$(git status --porcelain)" ]; then
            git add -A
            git commit -m "🤖 opencode: final auto-commit $(date -u +'%Y-%m-%d %H:%M:%SZ')" || true
            git push origin "${GITHUB_REF_NAME}" || true
          else
            echo "No pending changes to commit."
          fi

      # -----------------------------------------------------------------------
      # 13) عرض اللوجات
      # -----------------------------------------------------------------------
      - name: 📜 Show logs (debug)
        if: ${{ always() }}
        run: |
          echo "===== opencode server log (tail 100) ====="
          tail -n 100 "$RUNNER_TEMP/opencode-logs/server.log" 2>/dev/null || true
          echo ""
          echo "===== cloudflared tunnel log (tail 60) ====="
          tail -n 60  "$RUNNER_TEMP/cloudflared-logs/tunnel.log" 2>/dev/null || true
          echo ""
          echo "===== autocommit log (tail 60) ====="
          tail -n 60  "$RUNNER_TEMP/autocommit.log" 2>/dev/null || true

      # -----------------------------------------------------------------------
      # 14) إغلاق نظيف
      # -----------------------------------------------------------------------
      - name: 🧹 Shutdown cloudflared
        if: ${{ always() }}
        uses: AnimMouse/setup-cloudflared/shutdown@v2
