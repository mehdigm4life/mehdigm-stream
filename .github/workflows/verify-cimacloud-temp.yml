name: Verify CimaCloud Temp

on:
  push:
    branches:
      - 'arena/0c66d3ac-mehdigm-stream'
    paths:
      - '.tmp_verify/**'
      - '.github/workflows/verify-cimacloud-temp.yml'

permissions:
  contents: write

jobs:
  probe:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Phase 2 live CimaCloud probe
        run: |
          python3 .tmp_verify/probe_phase2.py > .tmp_verify/phase2.log 2>&1
      - name: Commit results
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f .tmp_verify/phase2_report.json .tmp_verify/phase2.log
          git commit -m "chore: phase2 probe results [skip ci]" || true
          git pull --rebase origin "${GITHUB_REF_NAME}" || true
          git push origin "HEAD:${GITHUB_REF_NAME}"
