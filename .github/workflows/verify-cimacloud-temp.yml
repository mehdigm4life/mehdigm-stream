name: Verify CimaCloud Temp

on:
  push:
    branches:
      - 'arena/0c66d3ac-mehdigm-stream'
    paths:
      - 'CimaCloud/**'
      - '.tmp_verify/**'
      - '.github/workflows/verify-cimacloud-temp.yml'

permissions:
  contents: write

jobs:
  build-and-verify:
    if: "!contains(github.event.head_commit.message, '[skip ci]') && !contains(github.event.head_commit.message, 'Build plugins')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Compile CimaCloud v35 (.cs3)
        run: |
          chmod +x gradlew
          ./gradlew :CimaCloud:clean :CimaCloud:make --no-daemon --stacktrace > .tmp_verify/gradle_build.log 2>&1
          cp CimaCloud/build/CimaCloud.cs3 build/CimaCloud.cs3

      - name: Run Live E2E Verification (Phony + Star One + Anime + Cartoon)
        run: |
          python3 .tmp_verify/e2e_verify.py > .tmp_verify/e2e.log 2>&1

      - name: Commit build & E2E verification artifacts
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch origin "${GITHUB_REF_NAME}"
            git reset --soft "origin/${GITHUB_REF_NAME}" || true
            [ -f CimaCloud/build/CimaCloud.cs3 ] && cp CimaCloud/build/CimaCloud.cs3 build/CimaCloud.cs3 || true
            git add -f build/CimaCloud.cs3 .tmp_verify/gradle_build.log .tmp_verify/e2e.log .tmp_verify/e2e_report.json 2>/dev/null || git add -f .tmp_verify/gradle_build.log
            git commit -m "chore: cimacloud v35 build + live e2e results [skip ci]" || true
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              break
            fi
            sleep 5
          done
