name: Recon CimaNow

on:
  push:
    branches:
      - 'arena/6c0058bf-mehdigm-stream'
    paths:
      - 'scripts_recon_cimanow.mjs'
      - '.github/workflows/recon-cimanow.yml'

permissions:
  contents: write

jobs:
  recon:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run CimaNow live HTTP & DOM recon
        run: node scripts_recon_cimanow.mjs

      - name: Commit recon report
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          [ -f cimanow_recon.json ] && git add -f cimanow_recon.json
          if ! git diff --cached --quiet; then
            git fetch origin "${GITHUB_REF_NAME}"
            git reset --soft "origin/${GITHUB_REF_NAME}"
            [ -f cimanow_recon.json ] && git add -f cimanow_recon.json
            git commit -m "chore: cimanow recon report [skip ci]"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
